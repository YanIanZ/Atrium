[versions]
paper = "26.1.2.build.74-stable"
hikari = "7.1.0"
caffeine = "3.3.1"
sqlite = "3.54.1.0"
mariadb = "4.0.0"
configurate = "4.2.0"
junit = "6.1.3"
shadow = "9.6.1"
vault = "1.7.1"
placeholderapi = "2.11.6"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
vault = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
