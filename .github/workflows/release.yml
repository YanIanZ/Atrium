name: Release

# Every push to main publishes a pre-release X.Y.Z-build.N (X.Y.Z from gradle.properties).
# Every tag vX.Y.Z publishes a stable release with that version.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          base="$(grep '^version=' gradle.properties | cut -d= -f2 | sed 's/-SNAPSHOT$//')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            prerelease=false
            tag="$GITHUB_REF_NAME"
          else
            version="${base}-build.${GITHUB_RUN_NUMBER}"
            prerelease=true
            tag="v${version}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version: $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --no-daemon --stacktrace

      - name: Boot smoke test on Paper
        run: scripts/ci-smoke.sh

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p dist
          cp "atrium-plugin/build/libs/Atrium-${{ steps.version.outputs.version }}.jar" dist/
          find atrium-vault/build/libs -name 'Vault-*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          (cd dist && sha256sum *.jar > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          title="Atrium ${{ steps.version.outputs.version }}"
          args=(--title "$title" --generate-notes --target "$GITHUB_SHA")
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh release create "$tag" dist/* "${args[@]}"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
