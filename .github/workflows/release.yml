name: Release

# Every push to main publishes the next patch release (1.0.0, 1.0.1, ...) of the MAJOR.MINOR line in
# gradle.properties. A tag vX.Y.Z publishes exactly that version.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # Plain semantic versions. A tag push vX.Y.Z publishes exactly that version. Every push to main
          # publishes the next patch of the MAJOR.MINOR line in gradle.properties (1.0.0, 1.0.1, ...);
          # raise MAJOR.MINOR there (e.g. version=1.1.0) to start a new line.
          git fetch --tags --force --quiet
          base="$(grep '^version=' gradle.properties | cut -d= -f2 | sed 's/-SNAPSHOT$//')"
          if [[ ! "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "gradle.properties version must be MAJOR.MINOR.PATCH, got: $base" >&2; exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            line="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            base_patch="${BASH_REMATCH[3]}"
            latest="$(git tag -l "v${line}.*" | grep -E "^v${line//./\\.}\.[0-9]+$" | sed 's/^v//' | sort -V | tail -1 || true)"
            if [[ -z "$latest" ]]; then
              version="$base"
            else
              next=$(( ${latest##*.} + 1 ))
              (( next < base_patch )) && next=$base_patch
              version="${line}.${next}"
            fi
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Tag v${version} already exists" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --no-daemon --stacktrace

      - name: Boot smoke test on Paper
        run: scripts/ci-smoke.sh

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p dist
          cp "atrium-plugin/build/libs/Atrium-${{ steps.version.outputs.version }}.jar" dist/
          find atrium-vault/build/libs -name 'Vault-*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          (cd dist && sha256sum *.jar > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          title="Atrium ${{ steps.version.outputs.version }}"
          gh release create "$tag" dist/* --title "$title" --generate-notes --target "$GITHUB_SHA" --latest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
