name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Boot smoke test on Paper
        run: scripts/ci-smoke.sh
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  # Compatibility harness: boots a Paper server with pinned popular plugins (checksums verified against
  # scripts/compat-plugins.lock) and fails on Atrium/Vault errors, failed modules or command conflicts that
  # break Atrium's reload. Runs on PRs and pushes but is independent of the release workflow.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compatibility smoke test on Paper with pinned plugins
        run: scripts/compat-smoke.sh --target paper
      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-report
          path: |
            run/compat-paper/report.txt
            run/compat-paper/command-report.txt
            run/compat-paper/*.out
            run/compat-paper/smoke.log
          if-no-files-found: ignore
