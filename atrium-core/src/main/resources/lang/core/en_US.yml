# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
prefix: "<dark_gray>[<gradient:#5fb3a1:#3b7f9a>Atrium</gradient>]</dark_gray> "
player-only: "<prefix><error>Only players can use this."
player-not-found: "<prefix><error>No matching player is online."
user-not-found: "<prefix><error>No player named <highlight><name></highlight> has joined this server."
no-permission-others: "<prefix><error>You need <highlight><permission></highlight> to do this to other players."
data-load-failed: "<error>Your player data could not be loaded. Please try again in a moment."
invalid-number: "<prefix><error><input> is not a valid number."
invalid-duration: "<prefix><error><input> is not a valid duration. Use for example 30s, 5m, 2h30m, 1d."
cooldown: "<prefix><error>You can do this again in <highlight><time></highlight>."
error: "<prefix><error>Something went wrong. The error was logged for the server staff."
version: "<prefix><muted>Atrium <highlight><version></highlight> with <highlight><modules></highlight> modules enabled."
modules-header: "<prefix><muted>Modules:"
modules-entry:
  enabled: " <success>●</success> <highlight><module>"
  disabled_by_config: " <muted>○ <module> <dark_gray>(disabled in modules.yml)"
  missing_dependency: " <warning>○ <module> <dark_gray>(a required module is not enabled)"
  failed: " <red>✖ <module> <dark_gray>(failed, see console)"
reloaded: "<prefix><success>Configuration and messages reloaded."
reload-partial: "<prefix><warning>Reloaded, but these modules failed: <highlight><modules></highlight>. See the console."
# <error> is the error text here, so this line uses a plain colour.
reload-failed: "<prefix><red>Reload failed: <highlight><error></highlight>. The previous configuration stays active."
docs-written: "<prefix><success>Wrote <highlight><commands></highlight> commands and <highlight><permissions></highlight> permissions to <highlight><path></highlight>."
docs-failed: "<prefix><error>Writing the docs failed. See the console."
help:
  header: "<muted><strikethrough>        </strikethrough> <primary><bold>Atrium help</bold></primary> <muted>(<highlight><page></highlight>/<highlight><pages></highlight>) <strikethrough>        </strikethrough>"
  module: "<secondary><bold><module></bold></secondary> <muted><description>"
  module-header: "<muted><strikethrough>      </strikethrough> <primary><bold><module></bold></primary> <muted><description> <strikethrough>      </strikethrough>"
  entry: " <primary><command></primary> <muted>- <description>"
  usage: "   <highlight><usage>"
  hover: "<primary><command></primary><newline><usages><newline><accent>Click to paste the command."
  click-to-paste: "<accent>Click to paste <highlight><command></highlight>."
  footer: "<muted>Page <highlight><page></highlight>/<highlight><pages></highlight>   <previous>   <next>   <muted>/atrium help [module]"
  previous: "<primary>« Previous"
  previous-disabled: "<dark_gray>« Previous"
  next: "<primary>Next »"
  next-disabled: "<dark_gray>Next »"
  empty: "<prefix><muted>There are no commands you can use."
  unknown-module: "<prefix><error>No module named <highlight><module></highlight> has commands you can use."
  menu-title: "<primary>Atrium commands"
  menu-module-name: "<primary><bold><module>"
  menu-module-lore: "<muted><description><newline><muted>Commands: <highlight><count><newline><newline><accent>Click to browse."
  menu-module-title: "<primary><module> <muted>commands"
  menu-command-name: "<primary><command>"
  menu-command-lore: "<muted><description>"
  menu-command-hint: "<accent>Click to get the usages in chat."
menu:
  back: "<muted>« <highlight>Back"
  close: "<error>Close"
  previous: "<primary>« Previous page"
  next: "<primary>Next page »"
  page: "<muted>Page <highlight><page></highlight>/<highlight><pages>"
  empty: "<muted>Nothing to show here."
  confirm-yes: "<success><bold>Confirm"
  confirm-no: "<error><bold>Cancel"
# /atrium profile (SourbyCraft AWF MultiProfile integration)
profile:
  unavailable: "<prefix><muted>Profiles: <warning>not available</warning> <muted>(SourbyCraft MultiProfile is not running or the sourbycraft module is idle)."
  status: "<prefix><muted>Profiles: <success>SourbyCraft MultiProfile</success> <muted>is active."
  scoped: "<prefix><muted>Follows the active profile: <highlight><scoped>"
  registered: "<prefix><muted>Profile-scoped data available: <highlight><ids>"
  economy: "<prefix><muted>Economy: <highlight><mode>"
  active: "<prefix><highlight><player></highlight> <muted>is on profile <highlight><profile></highlight> <muted>(type <highlight><type></highlight>, role <highlight><role></highlight>, <status>)."
  none: "<prefix><muted><highlight><player></highlight> has no active profile."
  failed: "<prefix><error>Could not read the profile of <highlight><player></highlight>. See the console."
