# Tag tema: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (warnanya diatur di config.yml bagian "theme"). Pakai tag ini, bukan warna mentah.
prefix: "<dark_gray>[<gradient:#5fb3a1:#3b7f9a>Atrium</gradient>]</dark_gray> "
player-only: "<prefix><error>Hanya pemain yang bisa memakai ini."
player-not-found: "<prefix><error>Tidak ada pemain online yang cocok."
user-not-found: "<prefix><error>Belum ada pemain bernama <highlight><name></highlight> yang pernah masuk server ini."
no-permission-others: "<prefix><error>Kamu butuh <highlight><permission></highlight> untuk melakukan ini ke pemain lain."
data-load-failed: "<error>Data pemainmu gagal dimuat. Coba lagi sebentar lagi."
invalid-number: "<prefix><error><input> bukan angka yang valid."
invalid-duration: "<prefix><error><input> bukan durasi yang valid. Contoh: 30s, 5m, 2h30m, 1d."
cooldown: "<prefix><error>Kamu bisa melakukan ini lagi dalam <highlight><time></highlight>."
error: "<prefix><error>Terjadi kesalahan. Detailnya sudah dicatat untuk staf server."
version: "<prefix><muted>Atrium <highlight><version></highlight> dengan <highlight><modules></highlight> modul aktif."
modules-header: "<prefix><muted>Modul:"
modules-entry:
  enabled: " <success>●</success> <highlight><module>"
  disabled_by_config: " <muted>○ <module> <dark_gray>(dimatikan di modules.yml)"
  missing_dependency: " <warning>○ <module> <dark_gray>(modul yang dibutuhkan tidak aktif)"
  failed: " <red>✖ <module> <dark_gray>(gagal, lihat konsol)"
reloaded: "<prefix><success>Konfigurasi dan pesan dimuat ulang."
reload-partial: "<prefix><warning>Dimuat ulang, tetapi modul ini gagal: <highlight><modules></highlight>. Lihat konsol."
# <error> di sini berisi teks galat, jadi baris ini memakai warna biasa.
reload-failed: "<prefix><red>Gagal memuat ulang: <highlight><error></highlight>. Konfigurasi sebelumnya tetap dipakai."
docs-written: "<prefix><success>Menulis <highlight><commands></highlight> perintah dan <highlight><permissions></highlight> izin ke <highlight><path></highlight>."
docs-failed: "<prefix><error>Gagal menulis dokumentasi. Lihat konsol."
help:
  header: "<muted><strikethrough>        </strikethrough> <primary><bold>Bantuan Atrium</bold></primary> <muted>(<highlight><page></highlight>/<highlight><pages></highlight>) <strikethrough>        </strikethrough>"
  module: "<secondary><bold><module></bold></secondary> <muted><description>"
  module-header: "<muted><strikethrough>      </strikethrough> <primary><bold><module></bold></primary> <muted><description> <strikethrough>      </strikethrough>"
  entry: " <primary><command></primary> <muted>- <description>"
  usage: "   <highlight><usage>"
  hover: "<primary><command></primary><newline><usages><newline><accent>Klik untuk menempel perintah."
  click-to-paste: "<accent>Klik untuk menempel <highlight><command></highlight>."
  footer: "<muted>Halaman <highlight><page></highlight>/<highlight><pages></highlight>   <previous>   <next>   <muted>/atrium help [modul]"
  previous: "<primary>« Sebelumnya"
  previous-disabled: "<dark_gray>« Sebelumnya"
  next: "<primary>Berikutnya »"
  next-disabled: "<dark_gray>Berikutnya »"
  empty: "<prefix><muted>Tidak ada perintah yang bisa kamu pakai."
  unknown-module: "<prefix><error>Tidak ada modul bernama <highlight><module></highlight> dengan perintah yang bisa kamu pakai."
  menu-title: "<primary>Perintah Atrium"
  menu-module-name: "<primary><bold><module>"
  menu-module-lore: "<muted><description><newline><muted>Perintah: <highlight><count><newline><newline><accent>Klik untuk melihat."
  menu-module-title: "<primary>Perintah <module>"
  menu-command-name: "<primary><command>"
  menu-command-lore: "<muted><description>"
  menu-command-hint: "<accent>Klik untuk melihat cara pakai di chat."
menu:
  back: "<muted>« <highlight>Kembali"
  close: "<error>Tutup"
  previous: "<primary>« Halaman sebelumnya"
  next: "<primary>Halaman berikutnya »"
  page: "<muted>Halaman <highlight><page></highlight>/<highlight><pages>"
  empty: "<muted>Tidak ada yang bisa ditampilkan."
  confirm-yes: "<success><bold>Konfirmasi"
  confirm-no: "<error><bold>Batal"
# /atrium profile (integrasi SourbyCraft AWF MultiProfile)
profile:
  unavailable: "<prefix><muted>Profil: <warning>tidak tersedia</warning> <muted>(SourbyCraft MultiProfile tidak berjalan atau modul sourbycraft sedang idle)."
  status: "<prefix><muted>Profil: <success>SourbyCraft MultiProfile</success> <muted>aktif."
  scoped: "<prefix><muted>Mengikuti profil aktif: <highlight><scoped>"
  registered: "<prefix><muted>Data yang bisa dibatasi per profil: <highlight><ids>"
  economy: "<prefix><muted>Ekonomi: <highlight><mode>"
  active: "<prefix><highlight><player></highlight> <muted>memakai profil <highlight><profile></highlight> <muted>(tipe <highlight><type></highlight>, peran <highlight><role></highlight>, <status>)."
  none: "<prefix><muted><highlight><player></highlight> tidak punya profil aktif."
  failed: "<prefix><error>Profil <highlight><player></highlight> tidak bisa dibaca. Lihat konsol."
