# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours come from config.yml under "theme").
# Placeholders available in most lines: <player> <actor> <reason> <duration> <remaining> <expires>
# <date> <id> <type> <jail> <ip> <revoker> <count>. Player-typed text is always inserted literally.
permanent: "permanent"
silent-tag: "<dark_gray>[<muted>silent</muted>]</dark_gray> "
summary:
  punish: "<prefix><muted>Done: <highlight>#<id></highlight> <type-label> <highlight><player></highlight> <dark_gray>(<duration>)</dark_gray> <muted>- <reason>"
  revoke: "<prefix><muted>Lifted: <highlight>#<id></highlight> <type-label> <highlight><player></highlight> <muted>- <reason>"
  instant: "<prefix><muted>Done: <highlight>#<id></highlight> <type-label> <highlight><player></highlight> <muted>- <reason>"
type:
  ban: "<error>ban</error>"
  tempban: "<error>temp ban</error>"
  ipban: "<error><bold>IP ban</bold></error>"
  mute: "<warning>mute</warning>"
  tempmute: "<warning>temp mute</warning>"
  shadowmute: "<warning><italic>shadow mute</italic></warning>"
  warn: "<accent>warning</accent>"
  kick: "<secondary>kick</secondary>"
  jail: "<secondary>jail</secondary>"
  freeze: "<accent>freeze</accent>"
self: "<prefix><error>You cannot do this to yourself."
