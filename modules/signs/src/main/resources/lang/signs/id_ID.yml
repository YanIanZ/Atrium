# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage-signedit: "<prefix><muted>Penggunaan: <highlight>/signedit (1-4) (teks)</highlight>. Arahkan pandangan ke papan tanda dulu."
muted: "<prefix><error>Kamu tidak bisa menulis di papan tanda saat dibisukan."
no-sign: "<prefix><error>Arahkan pandangan langsung ke papan tanda dalam <highlight><reach></highlight> blok."
too-long: "<prefix><error>Satu baris papan tanda maksimal <highlight><max></highlight> karakter."
cancelled: "<prefix><error>Perubahan papan tanda dibatalkan oleh plugin perlindungan."
waxed: "<prefix><error>Papan tanda ini sudah dilapisi lilin dan tidak bisa diedit."
edited: "<prefix><success>Baris papan tanda <highlight><line></highlight> diperbarui."
copied: "<prefix><success>Papan tanda disalin ke clipboard-mu."
pasted: "<prefix><success>Papan tanda ditempel."
paste-empty: "<prefix><error>Gunakan <highlight>/signcopy</highlight> pada papan tanda terlebih dahulu."
disabled: "<prefix><error>Pengeditan papan tanda dinonaktifkan."
dynamic-usage: "<prefix><muted>Pemakaian: <primary>/dsign create <nama></primary> (lihat papan), <primary>/dsign lines <nama> <baris1>|<baris2>|...</primary>, <primary>/dsign interval|range|personal</primary>, <primary>/dsign list|info|remove|reload</primary>."
dynamic-list: "<prefix><muted>Papan dinamis (<highlight><count></highlight>): <highlight><signs>"
dynamic-list-empty: "<prefix><muted>Belum ada papan dinamis. Lihat papan lalu pakai <primary>/dsign create <nama></primary>."
dynamic-info: "<prefix><primary><name></primary> <muted>di <highlight><location></highlight>, jangkauan <highlight><range></highlight>, interval <highlight><interval></highlight> ms, personal <highlight><personal></highlight>, <highlight><lines></highlight> baris."
dynamic-info-lines: "<muted><lines>"
dynamic-invalid-name: "<prefix><error>Nama memakai 1-32 karakter: a-z, 0-9, _ dan -."
dynamic-exists: "<prefix><error>Papan dinamis bernama <highlight><name></highlight> sudah ada."
dynamic-unknown: "<prefix><error>Tidak ada papan dinamis bernama <highlight><name></highlight>."
dynamic-occupied: "<prefix><error>Papan itu sudah menjadi papan dinamis."
dynamic-limit: "<prefix><error>Paling banyak <highlight><max></highlight> papan dinamis."
dynamic-created: "<prefix><success><highlight><name></highlight> sekarang papan dinamis (<highlight><lines></highlight> baris). Pemain di sekitar melihatnya bergulir."
dynamic-removed: "<prefix><success><highlight><name></highlight> bukan lagi papan dinamis."
dynamic-removed-broken: "<prefix><muted>Papan yang hancur dihapus dari papan dinamis (<highlight><name></highlight>)."
dynamic-lines-set: "<prefix><success>Baris diatur (<highlight><lines></highlight>). Pisahkan dengan <highlight>|</highlight>; <highlight>_</highlight> adalah baris kosong."
dynamic-empty-lines: "<prefix><error>Butuh minimal satu baris yang tidak kosong."
dynamic-interval-set: "<prefix><success>Interval gulir diatur ke <highlight><interval></highlight> ms."
dynamic-bad-interval: "<prefix><error><highlight><value></highlight> bukan interval yang valid. Pakai misalnya 1s, 1500ms atau 2s."
dynamic-range-set: "<prefix><success>Jangkauan pandang diatur ke <highlight><range></highlight> blok."
dynamic-personal-set: "<prefix><success>Gulir personal diatur ke <highlight><value></highlight>."
dynamic-reloaded: "<prefix><success>Memuat ulang <highlight><count></highlight> papan dinamis."
dynamic-save-failed: "<prefix><error>Papan dinamis gagal disimpan. Lihat log server."
