# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage-signedit: "<prefix><muted>Usage: <highlight>/signedit (1-4) (text)</highlight>. Look at a sign first."
muted: "<prefix><error>You cannot write on signs while muted."
no-sign: "<prefix><error>Look directly at a sign within <highlight><reach></highlight> blocks."
too-long: "<prefix><error>A sign line can have at most <highlight><max></highlight> characters."
cancelled: "<prefix><error>The sign change was cancelled by a protection plugin."
waxed: "<prefix><error>This sign is waxed and cannot be edited."
edited: "<prefix><success>Sign line <highlight><line></highlight> updated."
copied: "<prefix><success>Sign copied to your clipboard."
pasted: "<prefix><success>Sign pasted."
paste-empty: "<prefix><error>Use <highlight>/signcopy</highlight> on a sign first."
disabled: "<prefix><error>Sign editing is disabled."
dynamic-usage: "<prefix><muted>Usage: <primary>/dsign create <name></primary> (look at a sign), <primary>/dsign lines <name> <line1>|<line2>|...</primary>, <primary>/dsign interval|range|personal</primary>, <primary>/dsign list|info|remove|reload</primary>."
dynamic-list: "<prefix><muted>Dynamic signs (<highlight><count></highlight>): <highlight><signs>"
dynamic-list-empty: "<prefix><muted>No dynamic signs yet. Look at a sign and use <primary>/dsign create <name></primary>."
dynamic-info: "<prefix><primary><name></primary> <muted>at <highlight><location></highlight>, range <highlight><range></highlight>, interval <highlight><interval></highlight> ms, personal <highlight><personal></highlight>, <highlight><lines></highlight> line(s)."
dynamic-info-lines: "<muted><lines>"
dynamic-invalid-name: "<prefix><error>Names use 1-32 characters: a-z, 0-9, _ and -."
dynamic-exists: "<prefix><error>A dynamic sign named <highlight><name></highlight> already exists."
dynamic-unknown: "<prefix><error>There is no dynamic sign named <highlight><name></highlight>."
dynamic-occupied: "<prefix><error>That sign is already a dynamic sign."
dynamic-limit: "<prefix><error>At most <highlight><max></highlight> dynamic signs are allowed."
dynamic-created: "<prefix><success><highlight><name></highlight> is now a dynamic sign (<highlight><lines></highlight> line(s)). Players in range see it scroll."
dynamic-removed: "<prefix><success><highlight><name></highlight> is no longer a dynamic sign."
dynamic-removed-broken: "<prefix><muted>The broken sign was removed from the dynamic signs (<highlight><name></highlight>)."
dynamic-lines-set: "<prefix><success>Lines set (<highlight><lines></highlight>). Separate them with <highlight>|</highlight>; <highlight>_</highlight> is a blank line."
dynamic-empty-lines: "<prefix><error>At least one non-empty line is required."
dynamic-interval-set: "<prefix><success>Scroll interval set to <highlight><interval></highlight> ms."
dynamic-bad-interval: "<prefix><error><highlight><value></highlight> is not a valid interval. Use e.g. 1s, 1500ms or 2s."
dynamic-range-set: "<prefix><success>View range set to <highlight><range></highlight> blocks."
dynamic-personal-set: "<prefix><success>Personal scrolling set to <highlight><value></highlight>."
dynamic-reloaded: "<prefix><success>Reloaded <highlight><count></highlight> dynamic sign(s)."
dynamic-save-failed: "<prefix><error>The dynamic sign could not be saved. See the server log."
