# Inventory snapshots. Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>.
player-not-found: "<prefix><error>No player named <highlight><player></highlight> is known."
invalid-label: "<prefix><error>The label must be 1-<highlight><max></highlight> printable characters."
saved: "<prefix><success>Saved snapshot <highlight>#<id></highlight> of <highlight><player></highlight> (<highlight><stacks></highlight> stacks)."
saved-copy: "<prefix><success>Saved snapshot <highlight>#<id></highlight> of <highlight><player></highlight> from their last stored state, because they are offline."
offline-no-data: "<prefix><error><highlight><player></highlight> is offline and has no stored snapshot to copy. Let them join once first."
must-be-online: "<prefix><error><highlight><player></highlight> must be online for this command."
no-permission-others: "<prefix><error>You need <highlight><permission></highlight> to use this on another player."
failed: "<prefix><error>The command failed. The error was logged for the server staff."
target-left: "<prefix><error>The target player disconnected before the command ran."
snapshot-missing: "<prefix><error><highlight><player></highlight> has no snapshot <highlight>#<id></highlight>."
corrupt: "<prefix><error>Snapshot <highlight>#<id></highlight> of <highlight><player></highlight> is unreadable and was skipped. The server log has the details."
newer-format: "<prefix><error>Snapshot <highlight>#<id></highlight> of <highlight><player></highlight> uses format <highlight><format></highlight>, but this server supports up to <highlight><supported></highlight>. Update Atrium to read it."
confirm-load: "<prefix><warning>Run the same command again within <highlight><seconds></highlight> seconds to <mode> snapshot <highlight>#<id></highlight> into <highlight><player></highlight>."
confirm-remove-all: "<prefix><warning>Run the same command again within <highlight><seconds></highlight> seconds to delete every saved snapshot of <highlight><player></highlight>."
confirm-clear-ender: "<prefix><warning>Run the same command again within <highlight><seconds></highlight> seconds to back up and clear the ender chest of <highlight><player></highlight>."
loaded: "<prefix><success>Loaded snapshot <highlight>#<id></highlight> into <highlight><player></highlight> (<mode>). Backup: <highlight>#<backup></highlight>."
loaded-target: "<prefix><warning>An administrator restored inventory snapshot <highlight>#<id></highlight> to you."
load-overflow: "<prefix><warning><highlight><stacks></highlight> stack(s) of that snapshot did not fit the current slot counts of <highlight><player></highlight> (for example a larger ender chest): <highlight><moved></highlight> moved into free inventory space, <highlight><dropped></highlight> dropped at their feet."
overflow-dropped-target: "<prefix><warning><highlight><dropped></highlight> restored stack(s) did not fit your inventory and were dropped at your feet."
backup-failed: "<prefix><error>The backup snapshot could not be saved, so nothing was changed. See the server log."
merge-overflow: "<prefix><error>The items of that snapshot do not fit into the inventory of <highlight><player></highlight>. Nothing was changed; use the replace mode instead."
removed: "<prefix><success>Deleted snapshot <highlight>#<id></highlight> of <highlight><player></highlight>."
removed-all: "<prefix><success>Deleted <highlight><count></highlight> snapshot(s) of <highlight><player></highlight>."
ender-empty: "<prefix><muted>The ender chest of <highlight><player></highlight> is already empty."
cleared: "<prefix><success>Cleared the ender chest of <highlight><player></highlight>. Backup: <highlight>#<backup></highlight>."
cleared-target: "<prefix><warning>An administrator cleared your ender chest after taking a backup."
clearall-cleared: "<prefix><success>Cleared the inventory, armour, offhand and ender chest of <highlight><player></highlight>. Backup: <highlight>#<backup></highlight>."
clearall-cleared-target: "<prefix><warning>An administrator cleared your inventory and ender chest after taking a backup."
clearall-empty: "<prefix><muted>The inventory and ender chest of <highlight><player></highlight> are already empty."
clearall-all-done: "<prefix><success>Cleared <highlight><cleared></highlight> player(s); <highlight><failed></highlight> could not be cleared. Check the console for details."
clearall-none-online: "<prefix><muted>No players are online right now."
clearall-online: "<prefix><muted>Online right now: <online>"
clearall-online-none: "<prefix><muted>No players are online right now, so there is nothing to suggest."
clearall-online-hover: "<accent>Click to put /clearall <highlight><player></highlight> in your chat."
confirm-clearall-one: "<prefix><warning>Run the same command again within <highlight><seconds></highlight> seconds to back up and clear the inventory and ender chest of <highlight><player></highlight>."
confirm-clearall-all: "<prefix><warning>Run the same command again within <highlight><seconds></highlight> seconds to back up and clear the inventory and ender chest of <highlight><players></highlight> online players."
no-permission-all: "<prefix><error>You need <highlight><permission></highlight> to clear every online player."
list-header: "<prefix><primary>Saved inventories of <highlight><player></highlight> <muted>(page <highlight><page></highlight>/<highlight><pages></highlight>, <highlight><total></highlight> total)"
list-empty: "<prefix><muted><highlight><player></highlight> has no saved inventory snapshots."
list-entry: "<dark_gray>#<id></dark_gray> <highlight><label></highlight> <muted>- <reason> <dark_gray><date> <muted>(<stacks> stacks)"
list-hover:
  - "<primary>Snapshot <highlight>#<id></highlight> of <highlight><player></highlight>"
  - "<secondary>Label: <highlight><label>"
  - "<secondary>Reason: <reason>"
  - "<secondary>Created: <highlight><date>"
  - "<secondary>Stored stacks: <highlight><stacks>"
  - ""
  - "<accent>Click to preview."
list-no-label: "<dark_gray>(no label)"
list-prev: "<accent>[« previous]"
list-next: "<accent>[next »]"
list-prev-disabled: "<dark_gray>[« previous]"
list-next-disabled: "<dark_gray>[next »]"
list-footer: "<muted>Page <highlight><page></highlight>/<highlight><pages></highlight> <prev> <next>"
list-load: " <accent>[load]"
list-remove: " <error>[delete]"
usage-invsave: "<prefix><muted>Usage: <highlight>/invsave [-s] \\<player> [label]"
usage-invlist: "<prefix><muted>Usage: <highlight>/invlist \\<player> [page]"
usage-invcheck: "<prefix><muted>Usage: <highlight>/invcheck \\<player> \\<id>"
usage-invload: "<prefix><muted>Usage: <highlight>/invload [-s] \\<player> \\<id> [-m|--merge]"
usage-invremove: "<prefix><muted>Usage: <highlight>/invremove [-s] \\<player> \\<id>"
usage-invremoveall: "<prefix><muted>Usage: <highlight>/invremoveall [-s] \\<player>"
usage-clearender: "<prefix><muted>Usage: <highlight>/clearender [-s] \\<player>"
usage-clearall: "<prefix><muted>Usage: <highlight>/clearall \\<player|all> [-s]"
preview-title: "<primary>Snapshot #<id> of <highlight><player>"
preview-ender-title: "<primary>Ender chest of <highlight><player></highlight> <muted>(#<id>)"
preview-readonly: "<prefix><muted>This is a read-only preview: items cannot be taken. Use the buttons to switch pages."
preview-info-name: "<primary><bold>Snapshot #<id>"
preview-info-player: "<secondary>Player: <highlight><player>"
preview-info-reason: "<secondary>Reason: <reason>"
preview-info-date: "<secondary>Created: <highlight><date>"
preview-info-label: "<secondary>Label: <label>"
preview-info-stacks: "<secondary>Stored stacks: <highlight><stacks>"
preview-info-hint: "<muted>This preview cannot change anything."
preview-ender-button: "<primary>Ender chest"
preview-ender-lore: "<accent>Click to view the stored ender chest."
preview-back-button: "<muted>« <highlight>Back to the inventory"
preview-back-lore: "<accent>Click to return to the inventory page."
reason:
  manual: "<highlight>manual save"
  death: "<error>death"
  quit: "<muted>quit"
  pre_load: "<warning>before a load"
  clear_ender: "<warning>before an ender chest clear"
  clear_all: "<warning>before a full inventory clear"
  offline_copy: "<muted>offline copy"
  pre_pending_edit: "<warning>before an offline edit"
  pending_edit_rejected: "<error>rejected offline edit"
changed-retry: "<prefix><error>The items of <highlight><player></highlight> kept changing while the backup was saved, so nothing was changed. Please try again."
pending-applied-target: "<prefix><warning>An administrator's offline inventory edit was applied to your inventory."
pending-discarded-changed: "<prefix><warning>Offline edit <highlight>#<id></highlight> of <highlight><player></highlight> was discarded: their inventory no longer matched base snapshot <highlight>#<base></highlight>. The edited copy was kept in the snapshot history."
pending-discarded-missing: "<prefix><warning>Offline edit <highlight>#<id></highlight> of <highlight><player></highlight> was discarded: base snapshot <highlight>#<base></highlight> no longer exists. The edited copy was kept in the snapshot history."
refund-returned: "<prefix><success>Returned <highlight><stacks></highlight> stack(s) of items you placed in the offline inventory of <highlight><player></highlight>; that edit was not applied."
refund-delivered: "<prefix><success>Returned <highlight><stacks></highlight> stack(s) of items you placed in offline inventories. Anything that did not fit was dropped at your feet."
