status-hooked: "<prefix><success>The 'atrium' PlaceholderAPI expansion is registered."
status-missing: "<prefix><warning>PlaceholderAPI is not installed or not enabled; the 'atrium' placeholders are inactive."
status-cached: "<prefix><muted>Players in the placeholder cache: <highlight><count></highlight>."
status-list: "<prefix><muted>Placeholders: <highlight><placeholders></highlight>"

usermeta-usage: "<prefix><muted>Usage: <highlight>/usermeta <player> <list|add|set|remove|clear|increment> [key] [value]</highlight>. Read them as <highlight>%atrium_user_meta_<key>%</highlight>."
usermeta-header: "<prefix><primary>Metadata of <highlight><player></highlight>: <highlight><count></highlight> value(s)"
usermeta-empty: "<prefix><muted>No metadata stored."
usermeta-entry: "<prefix><muted>• <highlight><key></highlight> = <value>"
usermeta-invalid-key: "<prefix><error>Invalid key. Use 1-32 characters from <highlight>a-z 0-9 _ . -</highlight>."
usermeta-invalid-value: "<prefix><error>Invalid value. Use at most 512 characters without line breaks."
usermeta-set: "<prefix><success><highlight><mode></highlight> <highlight><key></highlight> = <value> for <highlight><player></highlight>."
usermeta-removed: "<prefix><success>Removed <highlight><key></highlight> from <highlight><player></highlight>."
usermeta-missing: "<prefix><muted><player> has no metadata named <highlight><key></highlight>."
usermeta-cleared: "<prefix><success>Removed <highlight><count></highlight> metadata value(s) of <highlight><player></highlight>."
usermeta-not-number: "<prefix><error><highlight><key></highlight> of <highlight><player></highlight> is not a number, so it cannot be incremented."
