# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
max: "<prefix><muted>Kamu sudah berada di peringkat tertinggi."
busy: "<prefix><muted>Kenaikan peringkatmu sedang diproses."
unknown-rank: "<prefix><error>Peringkat <highlight><rank></highlight> tidak dikenal."
changed: "<prefix><error>Peringkatmu berubah saat konfirmasi ini terbuka. Gunakan /rankup lagi."
confirm: "<prefix><warning>Naik ke <highlight><rank></highlight> dengan biaya <highlight><money></highlight>? <accent><u>Klik di sini</u></accent> atau ketik <highlight>/rankup confirm</highlight> dalam <highlight><seconds></highlight> detik."
confirm-hover: "<muted>Syarat diperiksa ulang sebelum ada biaya yang ditagih."
confirm-expired: "<prefix><error>Konfirmasi itu kedaluwarsa atau tidak pernah diminta. Gunakan /rankup lagi."
insufficient-money: "<prefix><error>Uangmu tidak cukup untuk peringkat ini."
economy-unavailable: "<prefix><error>Peringkat ini berbiaya, tetapi modul ekonomi tidak tersedia."
save-failed: "<prefix><warning>Peringkatmu sudah diberikan, tetapi penyimpanannya gagal. Akan dicoba lagi; hubungi staf jika terus terjadi."
grant-failed-refunded: "<prefix><error>Peringkat tidak dapat diberikan. <highlight><money></highlight> sudah dikembalikan."
refund-failed: "<prefix><error>Peringkat tidak dapat diberikan dan pengembalian dana juga gagal. Hubungi administrator."
rankup-success: "<prefix><success>Kamu naik ke peringkat <highlight><rank></highlight>."
rankup-broadcast: "<prefix><success><player></player> naik ke peringkat <highlight><rank></highlight>."
requirements-header: "<prefix><warning>Kamu belum memenuhi syarat untuk <highlight><rank></highlight>:"
