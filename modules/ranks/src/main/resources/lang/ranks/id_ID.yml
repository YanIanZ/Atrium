need-money: "<prefix><muted>Uang: <highlight><have></highlight>/<highlight><need></highlight>"
need-permission: "<prefix><muted>Izin yang belum dimiliki: <highlight><permission></highlight>"
list-header: "<prefix><primary>Tangga peringkat:"
entry: "<primary>◆</primary> <highlight><rank></highlight> <dark_gray>— <status> <dark_gray>· <progress>"
status-current: "<success>sekarang"
status-reached: "<muted>tercapai"
status-next: "<highlight>berikutnya"
status-locked: "<dark_gray>terkunci"
req-playtime-met: "<success><have></success>/<need> waktu bermain"
