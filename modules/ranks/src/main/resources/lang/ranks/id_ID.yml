info-group: "<prefix><muted>Grup LuckPerms: <highlight><group></highlight>"
info-commands: "<prefix><muted>Perintah kenaikan peringkat: <highlight><count></highlight>"
set-success: "<prefix><success>Peringkat <highlight><player></highlight> diatur ke <highlight><rank></highlight>."
set-target: "<prefix><success>Peringkatmu diatur ke <highlight><rank></highlight>."
set-failed: "<prefix><error>Gagal mengatur peringkat <highlight><player></highlight>. Lihat konsol."
usage: "<prefix><muted>Penggunaan: <highlight>/rank set (pemain) (peringkat)</highlight>."
