# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
max: "<prefix><muted>You are already at the highest rank."
busy: "<prefix><muted>Your rank-up is already being processed."
unknown-rank: "<prefix><error>Unknown rank <highlight><rank></highlight>."
changed: "<prefix><error>Your rank changed while this was open. Use /rankup again."
confirm: "<prefix><warning>Rank up to <highlight><rank></highlight> for <highlight><money></highlight>? <accent><u>Click here</u></accent> or type <highlight>/rankup confirm</highlight> within <highlight><seconds></highlight>s."
confirm-hover: "<muted>Requirements are checked again before anything is charged."
confirm-expired: "<prefix><error>That confirmation expired or was not requested. Use /rankup again."
insufficient-money: "<prefix><error>You do not have enough money for this rank."
economy-unavailable: "<prefix><error>This rank costs money, but the economy module is not available."
save-failed: "<prefix><warning>Your rank was granted, but saving it failed. It will be retried; contact staff if it persists."
grant-failed-refunded: "<prefix><error>The rank could not be granted. <highlight><money></highlight> was refunded."
refund-failed: "<prefix><error>The rank could not be granted and the refund also failed. Contact an administrator."
rankup-success: "<prefix><success>You ranked up to <highlight><rank></highlight>."
rankup-broadcast: "<prefix><success><player></player> ranked up to <highlight><rank></highlight>."
requirements-header: "<prefix><warning>You do not meet the requirements for <highlight><rank></highlight> yet:"
need-playtime: "<prefix><muted>Playtime: <highlight><have></highlight>/<highlight><need></highlight>"
need-money: "<prefix><muted>Money: <highlight><have></highlight>/<highlight><need></highlight>"
need-permission: "<prefix><muted>Missing permission: <highlight><permission></highlight>"
list-header: "<prefix><primary>Rank ladder:"
entry: "<primary>◆</primary> <highlight><rank></highlight> <dark_gray>— <status> <dark_gray>· <progress>"
status-current: "<success>current"
status-reached: "<muted>reached"
status-next: "<highlight>next"
status-locked: "<dark_gray>locked"
req-playtime-met: "<success><have></success>/<need> playtime"
req-playtime-unmet: "<error><have></error>/<need> playtime"
req-money-met: "<success><have></success>/<need>"
req-money-unmet: "<error><have></error>/<need>"
req-permission-met: "<success>permission granted"
req-permission-unmet: "<error>permission <permission>"
req-none: "<muted>no requirements"
separator: "<dark_gray>, </dark_gray>"
info-header: "<prefix><primary>Rank <highlight><rank></highlight> <dark_gray>(<id>)"
info-status: "<prefix><muted>Status: <status>"
info-group: "<prefix><muted>LuckPerms group: <highlight><group></highlight>"
info-commands: "<prefix><muted>Configured rank-up commands: <highlight><count></highlight>"
set-success: "<prefix><success>Set <highlight><player></highlight>'s rank to <highlight><rank></highlight>."
set-target: "<prefix><success>Your rank was set to <highlight><rank></highlight>."
set-failed: "<prefix><error>Could not set the rank of <highlight><player></highlight>. See the console."
usage: "<prefix><muted>Usage: <highlight>/rank set (player) (rank)</highlight>."
