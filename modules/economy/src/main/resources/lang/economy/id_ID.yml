# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
balance: '<prefix><highlight><player></highlight>: <highlight><amount></highlight>'
invalid-amount: '<prefix><error>Jumlah tidak valid. Gunakan angka desimal nonnegatif (boleh diikuti k, m, atau b), N% untuk bagian dari saldo, atau rand:min-max.'
minimum: '<prefix><error>Pembayaran minimum adalah <highlight><amount></highlight>.'
self: '<prefix><error>Kamu tidak bisa membayar diri sendiri.'
confirm: '<prefix><warning>Konfirmasi pembayaran <highlight><amount></highlight> kepada <highlight><player></highlight> dengan mengulangi perintah /pay yang sama dalam 30 detik.'
success: '<prefix><success>Transaksi selesai. Jumlah: <highlight><amount></highlight>. Saldo: <highlight><balance></highlight>.'
tax-paid: '<prefix><muted>Pajak <highlight><tax></highlight> termasuk: kamu membayar <highlight><paid></highlight>, penerima mendapat <highlight><received></highlight>.'
tax-too-high: '<prefix><error>Pajak <highlight><tax></highlight> akan menghabiskan seluruh pembayaran. Naikkan jumlahnya atau tanyakan pengaturan pajak kepada administrator.'
status-insufficient_funds: '<prefix><error>Saldo tidak mencukupi.'
status-limit_reached: '<prefix><error>Transaksi ini akan melampaui batas saldo.'
status-no_account: '<prefix><error>Akun tidak ditemukan.'
status-invalid_amount: '<prefix><error>Jumlah atau transaksi tidak valid.'
status-failed: '<prefix><error>Transaksi gagal. Keberhasilan tidak terkonfirmasi; hubungi administrator.'
unknown: '<prefix><error>Pemain itu belum pernah masuk ke server ini, jadi akunnya belum ada.'
empty: '<prefix><muted>Tidak ada entri pada halaman atau log ini.'
top-header: '<prefix><primary>Akun terkaya — halaman <highlight><page></highlight> (snapshot cache)'
top-entry: '<prefix><muted><rank>. <highlight><player></highlight>: <highlight><amount></highlight>'
log: '<prefix><muted><time></muted> <dark_gray>|</dark_gray> <highlight><amount></highlight> <dark_gray>|</dark_gray> <muted>saldo <highlight><balance></highlight> <dark_gray>|</dark_gray> <muted><reason>'
usage: '<prefix><muted>Penggunaan: <highlight>/eco (give|take|set|reset|log) (pemain) [jumlah]</highlight>.'
pay-usage: '<prefix><muted>Penggunaan: <highlight>/pay (pemain) (jumlah)</highlight>. Jumlah boleh 100, 1k, 25% atau rand:10-250.'
cheque-usage: '<prefix><muted>Penggunaan: <highlight>/cheque (jumlah)</highlight>. Klik kanan nota untuk menukarkannya. Jumlah boleh 100, 1k, 25% atau rand:10-250.'
cheque-disabled: '<prefix><error>Cek uang dinonaktifkan di server ini.'
cheque-amount: '<prefix><error>Cek harus lebih dari nol dan paling banyak <highlight><max></highlight>.'
cheque-created: '<prefix><success>Cek senilai <highlight><amount></highlight> dibuat. Klik kanan untuk menukarkan; nota yang hilang berarti uang hilang.'
cheque-name: '<highlight><amount></highlight> <muted>cek'
cheque-lore: '<muted>Klik kanan untuk menukarkan. Sekali pakai; salinannya tidak bernilai.'
cheque-redeemed: '<prefix><success>Cek ditukarkan. Kamu menerima <highlight><amount></highlight>. Saldo: <highlight><balance></highlight>.'
cheque-claim-failed: '<prefix><error>Cek tidak dapat diperiksa saat ini. Tidak ada yang terpakai; coba lagi nanti.'
cheque-invalid: '<prefix><error>Ini bukan cek yang valid dari server ini.'
cheque-used: '<prefix><error>Cek ini sudah ditukarkan. Salinannya tidak bernilai.'
cheque-failed: '<prefix><error>Cek senilai <highlight><amount></highlight> tidak dapat diproses. Tidak ada yang hilang; galat sudah dicatat untuk staf.'
cheque-no-permission: '<prefix><error>Kamu tidak diizinkan menukarkan cek.'
cheque-creative: '<prefix><error>Cek tidak dapat ditukarkan dalam mode kreatif.'
