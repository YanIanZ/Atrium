# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
balance: '<prefix><highlight><player></highlight>: <highlight><amount></highlight>'
invalid-amount: '<prefix><error>Invalid amount. Use a non-negative decimal (optionally k, m or b), N% for a share of the balance, or rand:min-max.'
minimum: '<prefix><error>The minimum payment is <highlight><amount></highlight>.'
self: '<prefix><error>You cannot pay yourself.'
confirm: '<prefix><warning>Confirm a payment of <highlight><amount></highlight> to <highlight><player></highlight> by repeating the same /pay command within 30 seconds.'
success: '<prefix><success>Transaction completed. Amount: <highlight><amount></highlight>. Balance: <highlight><balance></highlight>.'
tax-paid: '<prefix><muted>Tax <highlight><tax></highlight> included: you paid <highlight><paid></highlight>, the receiver got <highlight><received></highlight>.'
tax-too-high: '<prefix><error>The tax of <highlight><tax></highlight> would consume the whole payment. Increase the amount or ask an administrator about the tax settings.'
status-insufficient_funds: '<prefix><error>Insufficient funds.'
status-limit_reached: '<prefix><error>This transaction would exceed a balance limit.'
status-no_account: '<prefix><error>Account not found.'
status-invalid_amount: '<prefix><error>Invalid amount or transaction.'
status-failed: '<prefix><error>Transaction failed. No success was confirmed; contact an administrator.'
unknown: '<prefix><error>That player has not joined this server, so no account exists.'
empty: '<prefix><muted>No entries on this page or in this log.'
top-header: '<prefix><primary>Richest accounts — page <highlight><page></highlight> (cached snapshot)'
top-entry: '<prefix><muted><rank>. <highlight><player></highlight>: <highlight><amount></highlight>'
log: '<prefix><muted><time></muted> <dark_gray>|</dark_gray> <highlight><amount></highlight> <dark_gray>|</dark_gray> <muted>balance <highlight><balance></highlight> <dark_gray>|</dark_gray> <muted><reason>'
usage: '<prefix><muted>Usage: <highlight>/eco (give|take|set|reset|log) (player) [amount] [g:group]</highlight> or <highlight>/eco groups</highlight>.'
pay-usage: '<prefix><muted>Usage: <highlight>/pay (player) (amount)</highlight>. Amount may be 100, 1k, 25% or rand:10-250.'
cheque-usage: '<prefix><muted>Usage: <highlight>/cheque (amount)</highlight>. Right-click the note to redeem it. Amount may be 100, 1k, 25% or rand:10-250.'
cheque-disabled: '<prefix><error>Money cheques are disabled on this server.'
cheque-amount: '<prefix><error>A cheque must be above zero and at most <highlight><max></highlight>.'
cheque-created: '<prefix><success>Cheque for <highlight><amount></highlight> created. Right-click it to redeem; a lost note is lost money.'
cheque-name: '<highlight><amount></highlight> <muted>cheque'
cheque-lore: '<muted>Right-click to redeem. Single use; copies are worthless.'
cheque-redeemed: '<prefix><success>Cheque redeemed. You received <highlight><amount></highlight>. Balance: <highlight><balance></highlight>.'
cheque-claim-failed: '<prefix><error>The cheque could not be checked right now. Nothing was consumed; try again later.'
cheque-invalid: '<prefix><error>This is not a valid cheque of this server.'
cheque-used: '<prefix><error>This cheque was already redeemed. A copy is worthless.'
cheque-failed: '<prefix><error>The cheque for <highlight><amount></highlight> could not be processed. Nothing was lost; the error was logged for the staff.'
cheque-no-permission: '<prefix><error>You are not allowed to redeem cheques.'
cheque-creative: '<prefix><error>Cheques cannot be redeemed in creative mode.'
balance-group: '<prefix><highlight><player></highlight> <muted>(<group>)</muted>: <highlight><amount></highlight>'
top-header-group: '<prefix><primary>Richest accounts in <highlight><group></highlight> — page <highlight><page></highlight> (cached snapshot)'
log-group: '<prefix><muted><time></muted> <dark_gray>|</dark_gray> <muted><group></muted> <dark_gray>|</dark_gray> <highlight><amount></highlight> <dark_gray>|</dark_gray> <muted>balance <highlight><balance></highlight> <dark_gray>|</dark_gray> <muted><reason>'
pay-cross-group: '<prefix><error><highlight><player></highlight> is in world group <highlight><target_group></highlight> and you are in <highlight><group></highlight>. Payments between world groups are disabled.'
group-syntax: '<prefix><error>Choose a world group once with <highlight>g:(group)</highlight> or <highlight>--group (group)</highlight>.'
group-unknown: '<prefix><error>Unknown world group <highlight><group></highlight>. Groups: <highlight><groups></highlight>.'
groups-enabled: '<prefix><primary>World groups: <success>enabled</success>. <muted>Default group <highlight><default></highlight>, cross-group payments <highlight><cross></highlight>.'
groups-disabled: '<prefix><primary>World groups: <warning>disabled</warning>. <muted>Every world uses the default group <highlight><default></highlight>; existing balances stay there when groups are enabled.'
groups-entry: '<prefix><muted>Group <highlight><group></highlight> (<role>): worlds <highlight><worlds></highlight>, <highlight><accounts></highlight> stored account(s).'
groups-world: '<prefix><muted>World <highlight><world></highlight> → <highlight><group></highlight>'
groups-stored: '<prefix><warning>Stored group <highlight><group></highlight> (<accounts> account(s)) is not configured. Its money is kept; add the group back to use it.'
cheque-wrong-group: '<prefix><error>This cheque belongs to world group <highlight><group></highlight>. Redeem it in a world of that group.'
