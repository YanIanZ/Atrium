help:
  - "<prefix><primary><bold>Messaging commands</bold></primary>"
  - " <highlight>/actionbarmsg (player|all) [-t:(duration)] [-s] (message)</highlight> <dark_gray>- action bar"
  - " <highlight>/ctellraw (player|all) [-s] (message)</highlight> <dark_gray>- raw MiniMessage"
  - " <highlight>/helpop (message)</highlight> <dark_gray>- ask staff for help"
  - " <highlight>/alert add|remove|list</highlight> <dark_gray>- staff notes shown on join"
help-actionbar:
  - "<prefix><primary>Action bar message:"
  - " <highlight>/actionbarmsg (player|all) [-t:(duration)] [-s] (message)</highlight>"
  - " <muted>- (message) is MiniMessage and (player) becomes the target name."
  - " <muted>- -t:5s repeats the bar (default 5s, max <highlight><max></highlight>s). -s hides the confirmation."
help-tellraw:
  - "<prefix><primary>Raw message:"
  - " <highlight>/ctellraw (player|all) [-s] (message)</highlight>"
  - " <muted>- (message) is MiniMessage and (player) becomes the target name."
  - " <muted>- -s hides the confirmation; it does not hide the message sent to players."
help-helpop:
  - "<prefix><primary>Ask staff for help:"
  - " <highlight>/helpop (message)</highlight>"
  - " <muted>- Sent to online staff, the console and other servers on the network."
help-alert:
  - "<prefix><primary>Staff alerts:"
  - " <highlight>/alert add (player) (reason)</highlight> <muted>- note shown when the player joins"
  - " <highlight>/alert remove (player)</highlight> <muted>- delete every alert of a player"
  - " <highlight>/alert list [page]</highlight> <muted>- list active alerts"
no-permission-flag: "<prefix><error>You may not use the <highlight><flag></highlight> flag (<highlight><permission></highlight>)."
blank: "<prefix><error>Type a message to send."
too-long: "<prefix><error>That message is too long (maximum <highlight><max></highlight> characters)."
invalid-minimessage: "<prefix><error>That MiniMessage could not be parsed. Check the tags and try again."
target-hidden: "<prefix><error>That player is not visible to you."
no-targets: "<prefix><error>There is nobody to send this to."
actionbar-sent: "<prefix><success>Action bar sent to <highlight><player></highlight> for <highlight><seconds></highlight> seconds."
actionbar-sent-all: "<prefix><success>Action bar sent to <highlight><count></highlight> player(s) for <highlight><seconds></highlight> seconds."
tellraw-sent: "<prefix><success>Message sent to <highlight><player></highlight>."
tellraw-sent-all: "<prefix><success>Message sent to <highlight><count></highlight> player(s)."
helpop-muted: "<prefix><error>You cannot use /helpop while muted."
helpop-accepted: "<prefix><success>Your help request was accepted."
helpop-sent: "<prefix><success>Help request sent to <highlight><count></highlight> staff member(s)."
helpop-sent-quiet: "<prefix><success>Help request sent to the staff."
helpop-sent-network: "<prefix><success>Help request sent to <highlight><count></highlight> staff here and the rest of the network."
helpop-no-staff: "<prefix><warning>No staff are online right now. Your request was logged for the console."
helpop-format: "<error>[HelpOp]</error> <highlight><player></highlight><dark_gray>:</dark_gray> <reset><message>"
helpop-format-tp: "<error>[HelpOp]</error> <highlight><player></highlight><dark_gray>:</dark_gray> <reset><message> <tp>"
helpop-console: "<error>[HelpOp]</error> <highlight><player></highlight><dark_gray>:</dark_gray> <reset><message>"
helpop-remote-format: "<error>[HelpOp]</error> <muted>[<server>]</muted> <highlight><player></highlight><dark_gray>:</dark_gray> <reset><message>"
helpop-remote-console: "<error>[HelpOp]</error> <muted>[<server>]</muted> <highlight><player></highlight><dark_gray>:</dark_gray> <reset><message>"
alert-added: "<prefix><success>Alert <highlight>#<id></highlight> added for <highlight><player></highlight>. Staff will see it when the player next joins."
alert-removed: "<prefix><success>Removed <highlight><count></highlight> alert(s) for <highlight><player></highlight>."
alert-none: "<prefix><muted>There are no alerts for <highlight><player></highlight>."
alert-list-empty: "<prefix><muted>There are no active alerts."
alert-list-header: "<prefix><primary>Alerts <dark_gray>(page <highlight><page></highlight>/<highlight><pages></highlight>, <highlight><total></highlight> total)"
alert-list-entry: "<dark_gray>#<id> <highlight><player></highlight> <muted><reason> <dark_gray>(by <by>, <date>, <expiry>)"
alert-expiry: "<muted>expires <date>"
alert-expiry-never: "<muted>never expires"
alert-join-header: "<prefix><warning>Alerts for <highlight><player></highlight> <dark_gray>(<count>)"
alert-join-entry: "<dark_gray>#<id> <muted><reason> <dark_gray>(by <by>, <date>)"
# Colour tools
colorpicker-header: "<prefix><primary>Click a colour to insert its tag into chat:"
colorpicker-named: "<muted>Named: <swatches>"
colorpicker-hex-header: "<muted>Hex:"
colorpicker-hex-row: "<muted> <swatches>"
colorpicker-hover: "<muted>Click to insert <highlight><value></highlight>"
colorlimits-header: "<prefix><primary>Your colour permissions:"
colorlimits-area-chat: "<secondary>Chat"
colorlimits-area-nick: "<secondary>Nick"
colorlimits-area-signs: "<secondary>Signs"
colorlimits-area-anvils: "<secondary>Anvils"
colorlimits-row: "<prefix><area> <dark_gray>|</dark_gray> <muted>colour <color> <dark_gray>|</dark_gray> <muted>format <format>"
colorlimits-gradient: "<prefix><muted>    gradient <gradient>"
colorlimits-yes: "<success>yes"
colorlimits-no: "<error>no"
colorlimits-na: "<muted>n/a"
