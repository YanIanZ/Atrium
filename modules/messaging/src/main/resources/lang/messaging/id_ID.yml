help-bbroadcast: "<prefix><muted>Pemakaian: <primary>/bbroadcast [-s:server1,server2] <pesan></primary>. Tanpa -s pesan dikirim ke semua server. MiniMessage didukung; \\<cci:'/perintah'>teks\\</cci> hanya mengisi chat, \\<cc:'/perintah'>teks\\</cc> menjalankan perintah sebagai konsol (butuh atrium.messaging.ctellraw.console)."
broadcast-sent: "<prefix><success>Siaran dikirim ke <highlight><count></highlight> pemain lokal dan jaringan (<highlight><servers></highlight>)."
broadcast-sent-local: "<prefix><warning>Siaran hanya dikirim ke <highlight><count></highlight> pemain lokal: tidak ada proxy, server lain tidak menerimanya."
broadcast-bad-server: "<prefix><error><highlight><server></highlight> bukan nama server yang valid."
broadcast-unknown-servers: "<prefix><warning>Server tidak dikenal: <highlight><servers></highlight>. Yang dikenal: <highlight><known></highlight>."
broadcast-none-reachable: "<prefix><error>Tidak ada server yang dipilih, jadi tidak ada yang dikirim."
broadcast-remote: "<prefix><primary>[<server>] <sender></primary> <muted><message>"
serverlinks-header: "<prefix><primary>Tautan server (<highlight><count></highlight>):"
serverlinks-entry: "<muted>- <highlight><label></highlight> -> <highlight><url></highlight> <dark_gray>(tipe: <highlight><type></highlight>)</dark_gray>"
serverlinks-empty: "<prefix><muted>Belum ada tautan server. Tambahkan dengan <primary>/serverlinks add <label> <url></primary>."
serverlinks-invalid: "<prefix><error>Tautan butuh label 1-<max> karakter dan URL http(s)."
serverlinks-added: "<prefix><success>Tautan server <highlight><label></highlight> -> <highlight><url></highlight> ditambahkan."
serverlinks-removed: "<prefix><success>Tautan server <highlight><label></highlight> dihapus."
serverlinks-unknown: "<prefix><error>Tidak ada tautan server berlabel <highlight><label></highlight>."
serverlinks-cleared: "<prefix><success>Semua tautan server dihapus."
serverlinks-reloaded: "<prefix><success>Memuat ulang <highlight><count></highlight> tautan server."
