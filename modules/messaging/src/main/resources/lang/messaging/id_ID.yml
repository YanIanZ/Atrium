help:
  - "<prefix><primary><bold>Perintah pesan</bold></primary>"
  - " <highlight>/actionbarmsg (pemain|all) [-t:(durasi)] [-s] (pesan)</highlight> <dark_gray>- action bar"
  - " <highlight>/ctellraw (pemain|all) [-s] (pesan)</highlight> <dark_gray>- MiniMessage mentah"
  - " <highlight>/helpop (pesan)</highlight> <dark_gray>- minta bantuan staf"
  - " <highlight>/alert add|remove|list</highlight> <dark_gray>- catatan staf saat pemain bergabung"
help-actionbar:
  - "<prefix><primary>Pesan action bar:"
  - " <highlight>/actionbarmsg (pemain|all) [-t:(durasi)] [-s] (pesan)</highlight>"
  - " <muted>- (pesan) adalah MiniMessage dan (pemain) menjadi nama target."
  - " <muted>- -t:5s mengulang bar (bawaan 5s, maksimal <highlight><max></highlight>s). -s menyembunyikan konfirmasi."
help-tellraw:
  - "<prefix><primary>Pesan mentah:"
  - " <highlight>/ctellraw (pemain|all) [-s] (pesan)</highlight>"
  - " <muted>- (pesan) adalah MiniMessage dan (pemain) menjadi nama target."
  - " <muted>- -s menyembunyikan konfirmasi; pesan ke pemain tetap dikirim."
help-helpop:
  - "<prefix><primary>Minta bantuan staf:"
  - " <highlight>/helpop (pesan)</highlight>"
  - " <muted>- Dikirim ke staf online, konsol, dan server lain di jaringan."
help-alert:
  - "<prefix><primary>Alert staf:"
  - " <highlight>/alert add (pemain) (alasan)</highlight> <muted>- catatan yang tampil saat pemain bergabung"
  - " <highlight>/alert remove (pemain)</highlight> <muted>- hapus semua alert pemain"
  - " <highlight>/alert list [halaman]</highlight> <muted>- daftar alert aktif"
no-permission-flag: "<prefix><error>Kamu tidak boleh memakai flag <highlight><flag></highlight> (<highlight><permission></highlight>)."
blank: "<prefix><error>Tulis pesan yang ingin dikirim."
too-long: "<prefix><error>Pesan itu terlalu panjang (maksimal <highlight><max></highlight> karakter)."
invalid-minimessage: "<prefix><error>MiniMessage itu tidak bisa dibaca. Periksa tag-nya lalu coba lagi."
target-hidden: "<prefix><error>Pemain itu tidak terlihat olehmu."
no-targets: "<prefix><error>Tidak ada yang bisa dikirimi pesan ini."
actionbar-sent: "<prefix><success>Action bar dikirim ke <highlight><player></highlight> selama <highlight><seconds></highlight> detik."
actionbar-sent-all: "<prefix><success>Action bar dikirim ke <highlight><count></highlight> pemain selama <highlight><seconds></highlight> detik."
tellraw-sent: "<prefix><success>Pesan dikirim ke <highlight><player></highlight>."
tellraw-sent-all: "<prefix><success>Pesan dikirim ke <highlight><count></highlight> pemain."
helpop-muted: "<prefix><error>Kamu tidak bisa memakai /helpop saat dibisukan."
helpop-accepted: "<prefix><success>Permintaan bantuanmu diterima."
helpop-sent: "<prefix><success>Permintaan bantuan dikirim ke <highlight><count></highlight> staf."
helpop-sent-quiet: "<prefix><success>Permintaan bantuan dikirim ke staf."
helpop-sent-network: "<prefix><success>Permintaan bantuan dikirim ke <highlight><count></highlight> staf di sini dan seluruh jaringan."
helpop-no-staff: "<prefix><warning>Tidak ada staf yang online sekarang. Permintaanmu dicatat untuk konsol."
helpop-format: "<error>[HelpOp]</error> <highlight><player></highlight><dark_gray>:</dark_gray> <reset><message>"
helpop-format-tp: "<error>[HelpOp]</error> <highlight><player></highlight><dark_gray>:</dark_gray> <reset><message> <tp>"
helpop-console: "<error>[HelpOp]</error> <highlight><player></highlight><dark_gray>:</dark_gray> <reset><message>"
helpop-remote-format: "<error>[HelpOp]</error> <muted>[<server>]</muted> <highlight><player></highlight><dark_gray>:</dark_gray> <reset><message>"
helpop-remote-console: "<error>[HelpOp]</error> <muted>[<server>]</muted> <highlight><player></highlight><dark_gray>:</dark_gray> <reset><message>"
alert-added: "<prefix><success>Alert <highlight>#<id></highlight> ditambahkan untuk <highlight><player></highlight>. Staf akan melihatnya saat pemain bergabung lagi."
alert-removed: "<prefix><success>Menghapus <highlight><count></highlight> alert untuk <highlight><player></highlight>."
alert-none: "<prefix><muted>Tidak ada alert untuk <highlight><player></highlight>."
alert-list-empty: "<prefix><muted>Tidak ada alert aktif."
alert-list-header: "<prefix><primary>Alert <dark_gray>(halaman <highlight><page></highlight>/<highlight><pages></highlight>, <highlight><total></highlight> total)"
alert-list-entry: "<dark_gray>#<id> <highlight><player></highlight> <muted><reason> <dark_gray>(oleh <by>, <date>, <expiry>)"
alert-expiry: "<muted>kedaluwarsa <date>"
alert-expiry-never: "<muted>tidak kedaluwarsa"
alert-join-header: "<prefix><warning>Alert untuk <highlight><player></highlight> <dark_gray>(<count>)"
alert-join-entry: "<dark_gray>#<id> <muted><reason> <dark_gray>(oleh <by>, <date>)"
