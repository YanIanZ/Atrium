colorlimits-header: "<prefix><primary>Izin warnamu:"
colorlimits-area-chat: "<secondary>Chat"
colorlimits-area-nick: "<secondary>Nick"
colorlimits-area-signs: "<secondary>Sign"
colorlimits-area-anvils: "<secondary>Anvil"
colorlimits-row: "<prefix><area> <dark_gray>|</dark_gray> <muted>warna <color> <dark_gray>|</dark_gray> <muted>format <format>"
colorlimits-gradient: "<prefix><muted>    gradient <gradient>"
