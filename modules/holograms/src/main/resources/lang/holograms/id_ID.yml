# Tag tema: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (warna diatur di config.yml pada bagian "theme"). Gunakan ini alih-alih warna mentah.
usage:
  - "<prefix><primary><bold>Perintah hologram</bold></primary>"
  - "<muted> /holo create <highlight><name> [teks]</highlight> <dark_gray>- <muted>buat hologram di tempatmu berdiri"
  - "<muted> /holo delete <highlight><name></highlight> <dark_gray>- <muted>hapus hologram"
  - "<muted> /holo list <highlight>[halaman]</highlight> <dark_gray>- <muted>daftar semua hologram"
  - "<muted> /holo near <highlight>[radius]</highlight> <dark_gray>- <muted>daftar hologram di sekitarmu"
  - "<muted> /holo move|movehere|teleport <highlight><name></highlight> <dark_gray>- <muted>pindahkan hologram, atau pergi ke sana"
  - "<muted> /holo addline|setline|insertline|removeline <highlight><name> ...</highlight> <dark_gray>- <muted>ubah baris"
  - "<muted> /holo lineoffset <highlight><name> <baris> <x> <y> <z></highlight> <dark_gray>- <muted>geser satu baris"
  - "<muted> /holo linehover|lineclick <highlight><name> <baris> <teks|none></highlight> <dark_gray>- <muted>teks hover atau perintah klik satu baris"
  - "<muted> /holo addpage|removepage <highlight><name> ...</highlight> <dark_gray>- <muted>ubah halaman"
  - "<muted> /holo setting <highlight><name> <opsi> <nilai></highlight> <dark_gray>- <muted>ubah pengaturan"
  - "<muted> /holo action <highlight><name> add|remove|clear ...</highlight> <dark_gray>- <muted>ubah aksi klik"
  - "<muted> /holo info <highlight><name></highlight> <dark_gray>- <muted>tampilkan detail hologram"
created: "<prefix><success>Hologram <highlight><name></highlight> dibuat. Tambah baris dengan <highlight>/holo addline <name> <teks></highlight>."
