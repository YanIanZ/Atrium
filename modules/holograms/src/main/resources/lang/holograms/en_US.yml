engine-fallback-note: "<muted> Fallback: <highlight><reason></highlight>"
engine-reason-plugin-missing: "the plugin is not installed or not enabled"
engine-reason-folia-unsupported: "DecentHolograms 2.10 or newer is required on Folia"
engine-reason-start-failed: "the engine failed to start (see the console)"
engine-reason-migration-failed: "the new engine failed to start (see the console)"
engine-reason-plugin-disabled: "its plugin was disabled while the server was running"
engine-unknown: "<prefix><error>Unknown hologram engine <highlight><engine></highlight>. Use auto, native, decentholograms or fancyholograms."
