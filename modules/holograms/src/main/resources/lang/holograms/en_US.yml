engine-migrate-config: "<prefix><muted>Set <highlight>engine: <engine></highlight> in modules/holograms.yml and restart to keep this choice."
engine-migrate-failed: "<prefix><error>Migration failed: <highlight><reason></highlight>. Stored holograms were not changed."
