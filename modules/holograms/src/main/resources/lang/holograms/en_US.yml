# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
usage:
  - "<prefix><primary><bold>Hologram commands</bold></primary>"
  - "<muted> /holo create <highlight><name> [text]</highlight> <dark_gray>- <muted>create a hologram where you stand"
  - "<muted> /holo delete <highlight><name></highlight> <dark_gray>- <muted>delete a hologram"
  - "<muted> /holo list <highlight>[page]</highlight> <dark_gray>- <muted>list all holograms"
  - "<muted> /holo near <highlight>[radius]</highlight> <dark_gray>- <muted>list holograms around you"
  - "<muted> /holo move|movehere|teleport <highlight><name></highlight> <dark_gray>- <muted>move a hologram, or go to one"
  - "<muted> /holo addline|setline|insertline|removeline <highlight><name> ...</highlight> <dark_gray>- <muted>edit lines"
  - "<muted> /holo lineoffset <highlight><name> <line> <x> <y> <z></highlight> <dark_gray>- <muted>shift one line"
  - "<muted> /holo linehover|lineclick <highlight><name> <line> <text|none></highlight> <dark_gray>- <muted>hover text or click command of one line"
  - "<muted> /holo addpage|removepage <highlight><name> ...</highlight> <dark_gray>- <muted>edit pages"
  - "<muted> /holo setting <highlight><name> <option> <value></highlight> <dark_gray>- <muted>change a setting"
  - "<muted> /holo action <highlight><name> add|remove|clear ...</highlight> <dark_gray>- <muted>edit click actions"
  - "<muted> /holo info <highlight><name></highlight> <dark_gray>- <muted>show the details of a hologram"
created: "<prefix><success>Hologram <highlight><name></highlight> created. Add lines with <highlight>/holo addline <name> <text></highlight>."
deleted: "<prefix><muted>Hologram <highlight><name></highlight> deleted."
not-found: "<prefix><error>There is no hologram called <highlight><name></highlight>."
exists: "<prefix><error>A hologram called <highlight><name></highlight> already exists."
invalid-name: "<prefix><error>Hologram names may only contain letters, digits, _ and - (at most 32 characters)."
invalid-line: "<prefix><error>Invalid line: <highlight><reason></highlight>."
save-failed: "<prefix><error>The hologram could not be saved. Nothing was changed. The error was logged."
unchanged: "<prefix><muted>Nothing changed."
line-added: "<prefix><success>Line <highlight><line></highlight> added to <highlight><name></highlight>."
line-set: "<prefix><success>Line <highlight><line></highlight> of <highlight><name></highlight> changed."
line-inserted: "<prefix><success>Line inserted as line <highlight><line></highlight> of <highlight><name></highlight>."
line-removed: "<prefix><muted>Line <highlight><line></highlight> removed from <highlight><name></highlight>."
line-offset: "<prefix><success>Offset of line <highlight><line></highlight> of <highlight><name></highlight> set to <highlight><x> <y> <z></highlight>."
no-such-line: "<prefix><error><highlight><name></highlight> has no line <highlight><line></highlight>. See <highlight>/holo info <name></highlight>."
no-such-page: "<prefix><error><highlight><name></highlight> has no page <highlight><page></highlight>."
no-such-action: "<prefix><error><highlight><name></highlight> has no click action <highlight><index></highlight>."
limit: "<prefix><error>Limit reached: at most <highlight><max></highlight> lines per page, <highlight><max_pages></highlight> pages and 64 click actions."
page-added: "<prefix><success>Page <highlight><page></highlight> added to <highlight><name></highlight>."
page-removed: "<prefix><muted>Page <highlight><page></highlight> removed from <highlight><name></highlight>."
moved: "<prefix><success>Hologram <highlight><name></highlight> moved to <highlight><world> <x> <y> <z></highlight>."
teleported: "<prefix><success>Teleported to hologram <highlight><name></highlight>."
teleport-failed: "<prefix><error>Could not teleport to hologram <highlight><name></highlight>."
world-not-loaded: "<prefix><error>The world <highlight><world></highlight> of this hologram is not loaded."
setting-set: "<prefix><success><highlight><option></highlight> of <highlight><name></highlight> set to <highlight><value></highlight>."
setting-invalid: "<prefix><error>Invalid value for <highlight><option></highlight>: <highlight><reason></highlight>."
unknown-setting: "<prefix><error>Unknown option <highlight><option></highlight>. Available options: <highlight><options></highlight>."
action-added: "<prefix><success>Click action <highlight><index></highlight> added to <highlight><name></highlight>."
action-removed: "<prefix><muted>Click action <highlight><index></highlight> removed from <highlight><name></highlight>."
actions-cleared: "<prefix><muted>All click actions of <highlight><name></highlight> removed."
invalid-action: "<prefix><error>Invalid click action: <highlight><reason></highlight>."
no-hand-item: "<prefix><error>Hold the item to show in your main hand."
item-too-large: "<prefix><error>This item is too large to save (<highlight><size></highlight> bytes, limit <highlight><max></highlight>)."
list-header: "<prefix><muted>Holograms (<highlight><count></highlight>), page <highlight><page></highlight>/<highlight><pages></highlight>:"
list-entry: "<muted> - <accent><name></accent> <dark_gray>(<world> <x> <y> <z>, <lines> lines, <pages> pages)</dark_gray>"
list-empty: "<prefix><muted>There are no holograms yet. Create one with <highlight>/holo create <name></highlight>."
list-hover: "<accent>Click to teleport to <highlight><name></highlight>."
near-header: "<prefix><muted>Holograms within <highlight><radius></highlight> blocks:"
near-entry: "<muted> - <accent><name></accent> <dark_gray>(<distance> blocks)</dark_gray>"
near-empty: "<prefix><muted>No holograms within <highlight><radius></highlight> blocks."
