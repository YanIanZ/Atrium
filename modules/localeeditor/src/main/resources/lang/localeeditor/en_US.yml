# Locale editor. Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>.
failed: "<prefix><error>The command failed. The error was logged for the server staff."
usage: "<prefix><muted>Usage: <highlight>/editlocale [set|reset|preview|search] ...<newline><muted>Without arguments it opens the language browser."
usage-set: "<prefix><muted>Usage: <highlight>/editlocale set \\<locale> \\<module> \\<key> \\<text>"
usage-reset: "<prefix><muted>Usage: <highlight>/editlocale reset \\<locale> \\<module> \\<key>"
usage-preview: "<prefix><muted>Usage: <highlight>/editlocale preview \\<locale> \\<module> \\<key>"
usage-search: "<prefix><muted>Usage: <highlight>/editlocale search \\<query>"
invalid-locale: "<prefix><error><highlight><input></highlight> is not a valid locale. Use a folder name such as <highlight>en_US</highlight>."
invalid-module: "<prefix><error><highlight><input></highlight> is not a valid module name. Use letters, digits, '_' and '-' only."
invalid-key: "<prefix><error><highlight><input></highlight> is not a valid message key. Use dots between letters, digits, '_' and '-' only."
# This line receives the parser error as <error>, so it must not use the theme tag of the same name.
invalid-template: "<prefix><red>The text is not valid MiniMessage: <highlight><error></highlight>. Nothing was saved."
section-key: "<prefix><error><highlight><key></highlight> is a section, not a message. Edit one of its keys instead."
parse-failed: "<prefix><error>That language file is not valid YAML, so nothing was written. Fix the file first."
verify-failed: "<prefix><error>The rewritten file did not match the edit, so nothing was written. The file is unchanged."
key-missing: "<prefix><error><highlight><module>.<key></highlight> does not exist in <highlight><locale></highlight>."
no-default: "<prefix><warning>There is no bundled default for <highlight><module>.<key></highlight> in <highlight><locale></highlight>, so there is nothing to reset to."
created: "<prefix><success>Added <highlight><module>.<key></highlight> in <highlight><locale></highlight>."
updated: "<prefix><success>Updated <highlight><module>.<key></highlight> in <highlight><locale></highlight>."
reset-done: "<prefix><success>Restored the bundled default of <highlight><module>.<key></highlight> in <highlight><locale></highlight>."
preview-header: "<prefix><primary><module>.<key> <muted>(<locale>)"
preview-raw: "<muted>Stored text: <highlight><text>"
# This line receives the parser error as <error>, so it must not use the theme tag of the same name.
preview-invalid: "<prefix><red>This text cannot be rendered: <highlight><error></highlight>"
search-header: "<prefix><primary>Search results for <highlight><query></highlight> <muted>(<count>)"
search-empty: "<prefix><muted>No message matches <highlight><query></highlight>."
search-entry: "<dark_gray><locale>/<module></dark_gray> <highlight><key></highlight> <muted>- <value>"
search-hover: "<primary><key><newline><muted><value><newline><newline><accent>Click to edit this message."
search-more: "<prefix><muted>Showing the first <highlight><limit></highlight> results. Use a more specific query."
click-set: "<prefix><muted>Click to edit <highlight><key></highlight>."
click-reset: "<prefix><muted>Click to restore the bundled default of <highlight><key></highlight>."
click-hover: "<accent>Click to put <highlight><command></highlight> in your chat."
menu:
  locales-title: "<primary>Language files <muted>- choose a locale"
  modules-title: "<primary>Language files <muted>- <highlight><locale></highlight>"
  keys-title: "<primary><module> <muted>- <highlight><locale></highlight>"
  locale-name: "<primary><bold><locale>"
  locale-lore: "<muted>Modules on disk: <highlight><modules>"
  module-name: "<primary><bold><module>"
  module-lore: "<muted>Locale: <highlight><locale>"
  key-name: "<primary><key>"
  key-value: "<muted>Current text: <highlight><value>"
  key-set: "<accent>Left click: edit this message."
  key-reset: "<accent>Shift click: restore the bundled default."
  key-preview: "<accent>Right click: preview the rendered message."
