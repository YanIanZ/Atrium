# Editor locale. Tag tema: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>.
failed: "<prefix><error>Perintah gagal. Detailnya sudah dicatat untuk staf server."
usage: "<prefix><muted>Pemakaian: <highlight>/editlocale [set|reset|preview|search] ...<newline><muted>Tanpa argumen, penjelajah bahasa akan terbuka."
usage-set: "<prefix><muted>Pemakaian: <highlight>/editlocale set \\<locale> \\<modul> \\<kunci> \\<teks>"
usage-reset: "<prefix><muted>Pemakaian: <highlight>/editlocale reset \\<locale> \\<modul> \\<kunci>"
usage-preview: "<prefix><muted>Pemakaian: <highlight>/editlocale preview \\<locale> \\<modul> \\<kunci>"
usage-search: "<prefix><muted>Pemakaian: <highlight>/editlocale search \\<kata kunci>"
invalid-locale: "<prefix><error><highlight><input></highlight> bukan nama locale yang valid. Gunakan nama folder seperti <highlight>en_US</highlight>."
invalid-module: "<prefix><error><highlight><input></highlight> bukan nama modul yang valid. Gunakan huruf, angka, '_' dan '-' saja."
invalid-key: "<prefix><error><highlight><input></highlight> bukan kunci pesan yang valid. Gunakan titik di antara huruf, angka, '_' dan '-' saja."
# Baris ini menerima error parser sebagai <error>, jadi tidak boleh memakai tag tema dengan nama yang sama.
invalid-template: "<prefix><red>Teks bukan MiniMessage yang valid: <highlight><error></highlight>. Tidak ada yang disimpan."
section-key: "<prefix><error><highlight><key></highlight> adalah sebuah bagian, bukan pesan. Sunting salah satu kuncinya."
parse-failed: "<prefix><error>File bahasa itu bukan YAML yang valid, jadi tidak ada yang ditulis. Perbaiki file itu dulu."
verify-failed: "<prefix><error>File hasil penulisan ulang tidak cocok dengan suntingan, jadi tidak ada yang ditulis. File tidak berubah."
key-missing: "<prefix><error><highlight><module>.<key></highlight> tidak ada di <highlight><locale></highlight>."
no-default: "<prefix><warning>Tidak ada bawaan dari jar untuk <highlight><module>.<key></highlight> di <highlight><locale></highlight>, jadi tidak ada yang bisa dipulihkan."
created: "<prefix><success><highlight><module>.<key></highlight> ditambahkan di <highlight><locale></highlight>."
updated: "<prefix><success><highlight><module>.<key></highlight> diperbarui di <highlight><locale></highlight>."
reset-done: "<prefix><success>Bawaan jar untuk <highlight><module>.<key></highlight> dipulihkan di <highlight><locale></highlight>."
preview-header: "<prefix><primary><module>.<key> <muted>(<locale>)"
preview-raw: "<muted>Teks tersimpan: <highlight><text>"
# Baris ini menerima error parser sebagai <error>, jadi tidak boleh memakai tag tema dengan nama yang sama.
preview-invalid: "<prefix><red>Teks ini tidak dapat ditampilkan: <highlight><error></highlight>"
search-header: "<prefix><primary>Hasil pencarian <highlight><query></highlight> <muted>(<count>)"
search-empty: "<prefix><muted>Tidak ada pesan yang cocok dengan <highlight><query></highlight>."
search-entry: "<dark_gray><locale>/<module></dark_gray> <highlight><key></highlight> <muted>- <value>"
search-hover: "<primary><key><newline><muted><value><newline><newline><accent>Klik untuk menyunting pesan ini."
search-more: "<prefix><muted>Menampilkan <highlight><limit></highlight> hasil pertama. Gunakan kata kunci yang lebih spesifik."
click-set: "<prefix><muted>Klik untuk menyunting <highlight><key></highlight>."
click-reset: "<prefix><muted>Klik untuk memulihkan bawaan jar dari <highlight><key></highlight>."
click-hover: "<accent>Klik untuk menaruh <highlight><command></highlight> di chat."
menu:
  locales-title: "<primary>File bahasa <muted>- pilih locale"
  modules-title: "<primary>File bahasa <muted>- <highlight><locale></highlight>"
  keys-title: "<primary><module> <muted>- <highlight><locale></highlight>"
  locale-name: "<primary><bold><locale>"
  locale-lore: "<muted>Modul di disk: <highlight><modules>"
  module-name: "<primary><bold><module>"
  module-lore: "<muted>Locale: <highlight><locale>"
  key-name: "<primary><key>"
  key-value: "<muted>Teks saat ini: <highlight><value>"
  key-set: "<accent>Klik kiri: sunting pesan ini."
  key-reset: "<accent>Shift klik: pulihkan bawaan jar."
  key-preview: "<accent>Klik kanan: pratinjau pesan yang ditampilkan."
