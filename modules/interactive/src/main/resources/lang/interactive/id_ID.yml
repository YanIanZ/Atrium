# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (warna diatur di config.yml pada bagian "theme"). Utamakan tag ini dibanding warna mentah.
not-found: "<prefix><error>Tidak ada perintah interaktif bernama <highlight><name></highlight>."
save-failed: "<prefix><error>Perubahan tidak dapat disimpan. Tidak ada yang diubah. Kesalahannya sudah dicatat untuk staf server."
invalid-name: "<prefix><error>Nama hanya boleh berisi huruf, angka, _ dan - (maksimal 32 karakter)."
invalid-permission: "<prefix><error>Itu bukan node izin yang valid. Gunakan <highlight>none</highlight> untuk menghapus izin."
invalid-duration: "<prefix><error>Durasi <highlight><value></highlight> tidak valid. Contoh: 0, 30s, 5m, 1h30m."
invalid-trigger: "<prefix><error>Pemicu <highlight><value></highlight> tidak valid. Gunakan left, right, both, atau physical."
exists: "<prefix><error>Perintah interaktif bernama <highlight><name></highlight> sudah ada."
created: "<prefix><success>Perintah interaktif <highlight><name></highlight> dibuat. Selanjutnya, tambahkan aksi dengan <accent>/ic actions <name> add</accent> dan ikat dengan <accent>/ic bind <name> block|entity|item</accent>."
deleted: "<prefix><muted>Perintah interaktif <highlight><name></highlight> beserta ikatan blok dan entitasnya sudah dihapus."
list-header: "<prefix><primary>Perintah interaktif (<highlight><count></highlight>):"
list-empty: "<muted>  tidak ada"
list-entry: "<muted>  - <highlight><name></highlight> <dark_gray>(<trigger>, <actions> aksi, <blocks> blok, <entities> entitas)"
info: "<prefix><primary>Perintah interaktif <highlight><name></highlight><newline><secondary>  Pemicu: <highlight><trigger></highlight>  <secondary>Izin: <highlight><permission></highlight><newline><secondary>  Cooldown: <highlight><cooldown></highlight>  <secondary>Batalkan event: <highlight><cancel_event></highlight>  <secondary>Aksi: <highlight><actions></highlight>"
info-block: "<secondary>  blok: <highlight><block>"
info-entity: "<secondary>  entitas: <highlight><entity>"
select-block: "<prefix><warning>Klik blok yang akan diikat ke <highlight><name></highlight> (dalam <highlight><seconds></highlight> detik)."
select-entity: "<prefix><warning>Klik entitas yang akan diikat ke <highlight><name></highlight> (dalam <highlight><seconds></highlight> detik)."
select-unbind-block: "<prefix><warning>Klik blok yang ikatannya akan dilepas (dalam <highlight><seconds></highlight> detik)."
select-unbind-entity: "<prefix><warning>Klik entitas yang ikatannya akan dilepas (dalam <highlight><seconds></highlight> detik)."
bound: "<prefix><success><highlight><target></highlight> diikat ke <highlight><name></highlight>."
already-bound: "<prefix><error><highlight><target></highlight> sudah terikat ke <highlight><name></highlight>. Lepas dulu ikatannya."
not-bound: "<prefix><error><highlight><target></highlight> tidak terikat ke perintah interaktif mana pun."
unbound: "<prefix><muted>Ikatan <highlight><target></highlight> dari <highlight><name></highlight> dilepas."
no-item: "<prefix><error>Pegang item yang akan diikat di tangan utama."
bound-item: "<prefix><success>Item di tanganmu sekarang menjalankan <highlight><name></highlight>."
item-not-bound: "<prefix><error>Item di tanganmu tidak terikat ke perintah interaktif."
item-unbound: "<prefix><muted>Item di tanganmu tidak lagi interaktif."
actions-header: "<prefix><primary>Aksi dari <highlight><name></highlight> (<highlight><count></highlight>):"
actions-empty: "<muted>  tidak ada"
action-entry: "<muted>  <highlight><index>.</highlight> <line>"
# <error> di sini adalah teks kesalahan, jadi baris ini memakai warna biasa.
action-invalid: "<prefix><red>Aksi tidak valid: <highlight><error></highlight>"
too-many-actions: "<prefix><error>Satu perintah interaktif paling banyak memiliki <highlight><max></highlight> aksi."
action-added: "<prefix><success>Ditambahkan ke <highlight><name></highlight>: <muted><line>"
action-index: "<prefix><error>Tidak ada aksi dengan nomor itu (perintah ini memiliki <highlight><count></highlight> aksi)."
action-removed: "<prefix><muted>Aksi dihapus dari <highlight><name></highlight>: <line>"
set-permission: "<prefix><success>Izin <highlight><name></highlight> diatur ke <highlight><permission></highlight>."
set-cooldown: "<prefix><success>Cooldown <highlight><name></highlight> diatur ke <highlight><cooldown></highlight>."
set-cancel-event: "<prefix><success>Batalkan event untuk <highlight><name></highlight> diatur ke <highlight><value></highlight>."
set-trigger: "<prefix><success>Pemicu <highlight><name></highlight> diatur ke <highlight><trigger></highlight>."
no-permission: "<prefix><error>Kamu tidak diizinkan menggunakan ini."
on-cooldown: "<prefix><error>Tunggu <highlight><time></highlight> sebelum menggunakan ini lagi."
