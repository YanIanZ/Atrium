# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
not-found: "<prefix><error>There is no interactive command called <highlight><name></highlight>."
save-failed: "<prefix><error>The change could not be saved. Nothing was changed. The error was logged for the server staff."
invalid-name: "<prefix><error>Names may only contain letters, digits, _ and - (at most 32 characters)."
invalid-permission: "<prefix><error>That is not a valid permission node. Use <highlight>none</highlight> to remove the permission."
invalid-duration: "<prefix><error>Invalid duration <highlight><value></highlight>. Examples: 0, 30s, 5m, 1h30m."
invalid-trigger: "<prefix><error>Invalid trigger <highlight><value></highlight>. Use left, right, both or physical."
exists: "<prefix><error>An interactive command called <highlight><name></highlight> already exists."
created: "<prefix><success>Interactive command <highlight><name></highlight> created. Next, add actions with <accent>/ic actions <name> add</accent> and bind it with <accent>/ic bind <name> block|entity|item</accent>."
deleted: "<prefix><muted>Interactive command <highlight><name></highlight> and its block and entity bindings were deleted."
list-header: "<prefix><primary>Interactive commands (<highlight><count></highlight>):"
list-empty: "<muted>  none"
list-entry: "<muted>  - <highlight><name></highlight> <dark_gray>(<trigger>, <actions> actions, <blocks> blocks, <entities> entities)"
info: "<prefix><primary>Interactive command <highlight><name></highlight><newline><secondary>  Trigger: <highlight><trigger></highlight>  <secondary>Permission: <highlight><permission></highlight><newline><secondary>  Cooldown: <highlight><cooldown></highlight>  <secondary>Cancel event: <highlight><cancel_event></highlight>  <secondary>Actions: <highlight><actions></highlight>"
info-block: "<secondary>  block: <highlight><block>"
info-entity: "<secondary>  entity: <highlight><entity>"
select-block: "<prefix><warning>Click the block to bind to <highlight><name></highlight> (within <highlight><seconds></highlight>s)."
select-entity: "<prefix><warning>Click the entity to bind to <highlight><name></highlight> (within <highlight><seconds></highlight>s)."
select-unbind-block: "<prefix><warning>Click the block to unbind (within <highlight><seconds></highlight>s)."
select-unbind-entity: "<prefix><warning>Click the entity to unbind (within <highlight><seconds></highlight>s)."
bound: "<prefix><success>Bound <highlight><target></highlight> to <highlight><name></highlight>."
already-bound: "<prefix><error><highlight><target></highlight> is already bound to <highlight><name></highlight>. Unbind it first."
not-bound: "<prefix><error><highlight><target></highlight> is not bound to any interactive command."
unbound: "<prefix><muted>Unbound <highlight><target></highlight> from <highlight><name></highlight>."
no-item: "<prefix><error>Hold the item to bind in your main hand."
bound-item: "<prefix><success>The item in your hand now runs <highlight><name></highlight>."
item-not-bound: "<prefix><error>The item in your hand is not bound to an interactive command."
item-unbound: "<prefix><muted>The item in your hand is no longer interactive."
actions-header: "<prefix><primary>Actions of <highlight><name></highlight> (<highlight><count></highlight>):"
actions-empty: "<muted>  none"
action-entry: "<muted>  <highlight><index>.</highlight> <line>"
# <error> is the error text here, so this line uses a plain colour.
action-invalid: "<prefix><red>Invalid action: <highlight><error></highlight>"
too-many-actions: "<prefix><error>An interactive command can have at most <highlight><max></highlight> actions."
action-added: "<prefix><success>Added to <highlight><name></highlight>: <muted><line>"
action-index: "<prefix><error>There is no action with that number (the command has <highlight><count></highlight>)."
action-removed: "<prefix><muted>Removed action from <highlight><name></highlight>: <line>"
set-permission: "<prefix><success>Permission of <highlight><name></highlight> set to <highlight><permission></highlight>."
set-cooldown: "<prefix><success>Cooldown of <highlight><name></highlight> set to <highlight><cooldown></highlight>."
set-cancel-event: "<prefix><success>Cancel event of <highlight><name></highlight> set to <highlight><value></highlight>."
set-trigger: "<prefix><success>Trigger of <highlight><name></highlight> set to <highlight><trigger></highlight>."
no-permission: "<prefix><error>You are not allowed to use this."
on-cooldown: "<prefix><error>Please wait <highlight><time></highlight> before using this again."
