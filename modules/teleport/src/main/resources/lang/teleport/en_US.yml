# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
# Warmup, cooldown and failures (sent by the teleport service for every module)
warmup-started: "<prefix><warning>Teleporting in <highlight><seconds></highlight>s. Do not move."
warmup-countdown: "<muted>Teleporting in <highlight><seconds></highlight>..."
warmup-cancelled-move: "<prefix><error>Teleport cancelled because you moved."
warmup-cancelled-damage: "<prefix><error>Teleport cancelled because you took damage."
warmup-replaced: "<prefix><warning>Your previous teleport was replaced."
on-cooldown: "<prefix><error>You can teleport again in <highlight><time></highlight>."
unsafe: "<prefix><error>The destination is not safe, so you were not teleported."
failed: "<prefix><error>The teleport failed."
world-not-loaded: "<prefix><error>The world <highlight><world></highlight> is not loaded."
world-loading: "<prefix><muted>Loading the world <highlight><world></highlight>..."
world-unavailable-not-allowed: "<prefix><error>The world <highlight><world></highlight> is not loaded and may not be loaded on demand."
world-unavailable-busy: "<prefix><error>The world <highlight><world></highlight> is busy (being created, saved or unloaded). Try again in a moment."
world-unavailable-timeout: "<prefix><error>The world <highlight><world></highlight> did not load in time. Try again later."
world-unavailable-failed: "<prefix><error>The world <highlight><world></highlight> could not be loaded. The error was logged for the server staff."
warmup-cancelled-world-unload: "<prefix><error>Teleport cancelled because the world <highlight><world></highlight> is being unloaded."
save-failed: "<prefix><error>Could not save. The error was logged for the server staff."
cannot-self: "<prefix><error>You cannot teleport to yourself."
target-toggled: "<prefix><error><highlight><player></highlight> does not accept teleports."
position-out-of-range: "<prefix><error>Those coordinates are outside the world."
# Usage lines for a bare root command
usage-tp: "<prefix><muted>Usage: <highlight>/tp <player></highlight>, <highlight>/tp <x> <y> <z> [world]</highlight>, or <highlight>/tp <player> <destination></highlight>."
usage-tphere: "<prefix><muted>Usage: <highlight>/tphere <player></highlight>."
usage-tpa: "<prefix><muted>Usage: <highlight>/tpa <player></highlight>."
usage-tpahere: "<prefix><muted>Usage: <highlight>/tpahere <player></highlight>."
# /tp, /tphere, /tpall, /top
tp-to-player: "<prefix><success>Teleported to <highlight><player></highlight>."
tp-other-to-player: "<prefix><success>Teleported <highlight><player></highlight> to <highlight><target></highlight>."
tp-to-position: "<prefix><success>Teleported to <highlight><to_x> <to_y> <to_z></highlight> in <highlight><to_world></highlight>."
tp-other-to-position: "<prefix><success>Teleported <highlight><player></highlight> to <highlight><to_x> <to_y> <to_z></highlight> in <highlight><to_world></highlight>."
tphere: "<prefix><success>Teleported <highlight><player></highlight> to you."
tphere-target: "<prefix><muted><highlight><player></highlight> teleported you to them."
tpall: "<prefix><muted>Teleporting <highlight><count></highlight> players to you."
top: "<prefix><success>Teleported to the top."
top-none: "<prefix><error>There is no safe spot above you."
# /back
back: "<prefix><success>Returned to your previous location."
back-death: "<prefix><success>Returned to where you died."
back-none: "<prefix><error>You have no location to return to."
back-death-no-permission: "<prefix><error>You are not allowed to return to your death location."
back-none-other: "<prefix><error><highlight><player></highlight> has no location to return to."
back-index: "<prefix><error>There are only <highlight><count></highlight> locations to return to. Use <highlight>/back 1</highlight> to <highlight><count></highlight>."
back-other: "<prefix><success>Sent <highlight><player></highlight> back to their previous location."
back-list-header: "<prefix><primary><bold>Your last <highlight><count></highlight> locations</bold></primary> <muted>(newest first):"
back-list-header-other: "<prefix><primary><bold>Last <highlight><count></highlight> locations of <highlight><player></highlight></bold></primary> <muted>(newest first):"
back-list-entry: "<dark_gray>#<highlight><index></highlight></dark_gray> <secondary><kind></secondary> <highlight><world></highlight> <muted><x> <y> <z></muted> <dark_gray>(<highlight><age></highlight> ago)</dark_gray>"
back-list-death: "<error>death"
back-list-teleport: "<accent>teleport"
back-list-hover: "<accent>Click to return to this location."
target-offline: "<prefix><error><highlight><player></highlight> is not online, so cannot be teleported."
# Requests
tptoggle-on: "<prefix><success>You accept teleport requests again."
tptoggle-off: "<prefix><muted>You no longer accept teleport requests."
request-sent: "<prefix><muted>Request sent to <highlight><player></highlight>. It expires in <highlight><seconds></highlight>s."
tpa-received: "<prefix><highlight><player></highlight> <muted>wants to teleport to you. The request expires in <highlight><seconds></highlight>s."
tpahere-received: "<prefix><highlight><player></highlight> <muted>wants you to teleport to them. The request expires in <highlight><seconds></highlight>s."
request-buttons: "<prefix><accept> <dark_gray>|</dark_gray> <deny>"
button-accept: "<success><bold>[Accept]</bold></success>"
button-accept-hover: "<accent>Click to accept this request."
button-deny: "<error><bold>[Deny]</bold></error>"
button-deny-hover: "<accent>Click to deny this request."
request-already: "<prefix><error>You already sent <highlight><player></highlight> a request."
request-other-world: "<prefix><error>You cannot send requests to players in another world."
request-accepted-receiver: "<prefix><success>You accepted the request of <highlight><player></highlight>."
request-accepted-sender: "<prefix><success><highlight><player></highlight> accepted your request."
request-denied-receiver: "<prefix><muted>You denied the request of <highlight><player></highlight>."
request-denied-sender: "<prefix><error><highlight><player></highlight> denied your request."
request-cancelled-sender: "<prefix><muted>Your request to <highlight><player></highlight> was cancelled."
request-cancelled-receiver: "<prefix><muted><highlight><player></highlight> cancelled their request."
request-cancelled-quit: "<prefix><muted>The request with <highlight><player></highlight> was cancelled because they left."
request-expired-sender: "<prefix><muted>Your request to <highlight><player></highlight> expired."
request-expired-receiver: "<prefix><muted>The request from <highlight><player></highlight> expired."
no-request: "<prefix><error>You have no pending teleport request."
no-request-from: "<prefix><error>You have no pending request from <highlight><player></highlight>."
no-outgoing: "<prefix><error>You have no pending outgoing request."
requester-offline: "<prefix><error>That player is no longer online."
# Spawn
spawn: "<prefix><success>Teleported to the spawn."
spawn-other: "<prefix><success>Sent <highlight><player></highlight> to the spawn."
spawn-none: "<prefix><error>No spawn is available."
setspawn-world: "<prefix><success>Spawn of <highlight><world></highlight> set to <highlight><at_x> <at_y> <at_z></highlight>."
setspawn-default: "<prefix><success>Default spawn set to <highlight><at_x> <at_y> <at_z></highlight> in <highlight><world></highlight>."
setspawn-first-join: "<prefix><success>First-join spawn set to <highlight><at_x> <at_y> <at_z></highlight> in <highlight><world></highlight>."
