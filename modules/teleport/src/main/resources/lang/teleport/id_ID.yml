# Tag tema: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (warna diatur di config.yml pada bagian "theme"). Gunakan ini alih-alih warna mentah.
# Warmup, cooldown dan kegagalan (dikirim oleh layanan teleport untuk semua modul)
warmup-started: "<prefix><warning>Teleport dalam <highlight><seconds></highlight> dtk. Jangan bergerak."
warmup-countdown: "<muted>Teleport dalam <highlight><seconds></highlight>..."
warmup-cancelled-move: "<prefix><error>Teleport dibatalkan karena kamu bergerak."
warmup-cancelled-damage: "<prefix><error>Teleport dibatalkan karena kamu terkena damage."
warmup-replaced: "<prefix><warning>Teleport sebelumnya diganti."
on-cooldown: "<prefix><error>Kamu bisa teleport lagi dalam <highlight><time></highlight>."
unsafe: "<prefix><error>Tujuan tidak aman, jadi kamu tidak dipindahkan."
failed: "<prefix><error>Teleport gagal."
world-not-loaded: "<prefix><error>World <highlight><world></highlight> tidak dimuat."
world-loading: "<prefix><muted>Memuat dunia <highlight><world></highlight>..."
world-unavailable-not-allowed: "<prefix><error>Dunia <highlight><world></highlight> tidak dimuat dan tidak boleh dimuat sesuai permintaan."
world-unavailable-busy: "<prefix><error>Dunia <highlight><world></highlight> sedang sibuk (dibuat, disimpan, atau dilepas). Coba lagi sebentar lagi."
world-unavailable-timeout: "<prefix><error>Dunia <highlight><world></highlight> tidak selesai dimuat tepat waktu. Coba lagi nanti."
world-unavailable-failed: "<prefix><error>Dunia <highlight><world></highlight> tidak bisa dimuat. Kesalahan sudah dicatat untuk staf server."
warmup-cancelled-world-unload: "<prefix><error>Teleport dibatalkan karena dunia <highlight><world></highlight> sedang dilepas."
save-failed: "<prefix><error>Gagal menyimpan. Galat sudah dicatat untuk staf server."
cannot-self: "<prefix><error>Kamu tidak bisa teleport ke dirimu sendiri."
target-toggled: "<prefix><error><highlight><player></highlight> tidak menerima teleport."
position-out-of-range: "<prefix><error>Koordinat itu berada di luar world."
# Baris penggunaan untuk perintah tanpa argumen
usage-tp: "<prefix><muted>Penggunaan: <highlight>/tp <pemain></highlight>, <highlight>/tp <x> <y> <z> [world]</highlight>, atau <highlight>/tp <pemain> <tujuan></highlight> (nama sendiri di depan memindahkan pemain itu ke tempatmu)."
usage-tphere: "<prefix><muted>Penggunaan: <highlight>/tphere <pemain></highlight>."
usage-tpa: "<prefix><muted>Penggunaan: <highlight>/tpa <pemain></highlight>."
usage-tpahere: "<prefix><muted>Penggunaan: <highlight>/tpahere <pemain></highlight>."
# /tp, /tphere, /tpall, /top
tp-to-player: "<prefix><success>Teleport ke <highlight><player></highlight>."
tp-other-to-player: "<prefix><success><highlight><player></highlight> dipindahkan ke <highlight><target></highlight>."
tp-to-position: "<prefix><success>Teleport ke <highlight><to_x> <to_y> <to_z></highlight> di <highlight><to_world></highlight>."
tp-other-to-position: "<prefix><success><highlight><player></highlight> dipindahkan ke <highlight><to_x> <to_y> <to_z></highlight> di <highlight><to_world></highlight>."
tphere: "<prefix><success><highlight><player></highlight> dipindahkan ke tempatmu."
tphere-target: "<prefix><muted><highlight><player></highlight> memindahkanmu ke tempatnya."
tpall: "<prefix><muted>Memindahkan <highlight><count></highlight> pemain ke tempatmu."
top: "<prefix><success>Teleport ke puncak."
top-none: "<prefix><error>Tidak ada tempat aman di atasmu."
# /back
back: "<prefix><success>Kembali ke lokasi sebelumnya."
back-death: "<prefix><success>Kembali ke tempat kamu mati."
back-none: "<prefix><error>Tidak ada lokasi untuk kembali."
back-death-no-permission: "<prefix><error>Kamu tidak diizinkan kembali ke lokasi kematian."
back-none-other: "<prefix><error><highlight><player></highlight> tidak punya lokasi untuk kembali."
back-index: "<prefix><error>Hanya ada <highlight><count></highlight> lokasi untuk kembali. Gunakan <highlight>/back 1</highlight> sampai <highlight><count></highlight>."
back-other: "<prefix><success><highlight><player></highlight> dikirim kembali ke lokasi sebelumnya."
back-list-header: "<prefix><primary><bold><highlight><count></highlight> lokasi terakhirmu</bold></primary> <muted>(terbaru lebih dulu):"
back-list-header-other: "<prefix><primary><bold><highlight><count></highlight> lokasi terakhir <highlight><player></highlight></bold></primary> <muted>(terbaru lebih dulu):"
back-list-entry: "<dark_gray>#<highlight><index></highlight></dark_gray> <secondary><kind></secondary> <highlight><world></highlight> <muted><x> <y> <z></muted> <dark_gray>(<highlight><age></highlight> lalu)</dark_gray>"
back-list-death: "<error>kematian"
back-list-teleport: "<accent>teleport"
back-list-hover: "<accent>Klik untuk kembali ke lokasi ini."
target-offline: "<prefix><error><highlight><player></highlight> tidak online, jadi tidak bisa dipindahkan."
# Permintaan
tptoggle-on: "<prefix><success>Kamu menerima permintaan teleport lagi."
tptoggle-off: "<prefix><muted>Kamu tidak lagi menerima permintaan teleport."
request-sent: "<prefix><muted>Permintaan dikirim ke <highlight><player></highlight>. Berlaku <highlight><seconds></highlight> dtk."
tpa-received: "<prefix><highlight><player></highlight> <muted>ingin teleport ke tempatmu. Permintaan berlaku <highlight><seconds></highlight> dtk."
tpahere-received: "<prefix><highlight><player></highlight> <muted>ingin kamu teleport ke tempatnya. Permintaan berlaku <highlight><seconds></highlight> dtk."
request-buttons: "<prefix><accept> <dark_gray>|</dark_gray> <deny>"
button-accept: "<success><bold>[Terima]</bold></success>"
button-accept-hover: "<accent>Klik untuk menerima permintaan ini."
button-deny: "<error><bold>[Tolak]</bold></error>"
button-deny-hover: "<accent>Klik untuk menolak permintaan ini."
request-already: "<prefix><error>Kamu sudah mengirim permintaan ke <highlight><player></highlight>."
request-other-world: "<prefix><error>Kamu tidak bisa mengirim permintaan ke pemain di world lain."
request-accepted-receiver: "<prefix><success>Kamu menerima permintaan dari <highlight><player></highlight>."
request-accepted-sender: "<prefix><success><highlight><player></highlight> menerima permintaanmu."
request-denied-receiver: "<prefix><muted>Kamu menolak permintaan dari <highlight><player></highlight>."
request-denied-sender: "<prefix><error><highlight><player></highlight> menolak permintaanmu."
request-cancelled-sender: "<prefix><muted>Permintaanmu ke <highlight><player></highlight> dibatalkan."
request-cancelled-receiver: "<prefix><muted><highlight><player></highlight> membatalkan permintaannya."
request-cancelled-quit: "<prefix><muted>Permintaan dengan <highlight><player></highlight> dibatalkan karena dia keluar."
request-expired-sender: "<prefix><muted>Permintaanmu ke <highlight><player></highlight> kedaluwarsa."
request-expired-receiver: "<prefix><muted>Permintaan dari <highlight><player></highlight> kedaluwarsa."
no-request: "<prefix><error>Kamu tidak punya permintaan teleport yang tertunda."
no-request-from: "<prefix><error>Kamu tidak punya permintaan tertunda dari <highlight><player></highlight>."
no-outgoing: "<prefix><error>Kamu tidak punya permintaan keluar yang tertunda."
requester-offline: "<prefix><error>Pemain itu sudah tidak online."
# Spawn
spawn: "<prefix><success>Teleport ke spawn."
spawn-other: "<prefix><success><highlight><player></highlight> dikirim ke spawn."
spawn-none: "<prefix><error>Tidak ada spawn yang tersedia."
setspawn-world: "<prefix><success>Spawn <highlight><world></highlight> diatur ke <highlight><at_x> <at_y> <at_z></highlight>."
setspawn-default: "<prefix><success>Spawn default diatur ke <highlight><at_x> <at_y> <at_z></highlight> di <highlight><world></highlight>."
setspawn-first-join: "<prefix><success>Spawn saat pertama masuk diatur ke <highlight><at_x> <at_y> <at_z></highlight> di <highlight><world></highlight>."
# Pendaratan aman, /tpbypass dan login aman
unsafe-can-bypass: "<prefix><error>Tujuan tidak aman, jadi kamu tidak dipindahkan. Gunakan <highlight>/tpbypass</highlight> dalam <highlight><seconds></highlight> dtk untuk memaksanya."
tpbypass: "<prefix><warning>Tujuan tidak aman dipaksakan."
tpbypass-none: "<prefix><error>Tidak ada teleport tidak aman yang baru saja gagal."
safe-login: "<prefix><muted>Kamu masuk di dalam blok, jadi kamu dipindahkan ke tempat aman terdekat."
# Elevator tanda
elevator-none-up: "<prefix><error>Tidak ada perhentian elevator di atasmu."
elevator-none-down: "<prefix><error>Tidak ada perhentian elevator di bawahmu."
elevator-blocked: "<prefix><error>Perhentian elevator berikutnya tidak punya ruang untuk berdiri."
elevator-ride: "<muted>Elevator: <highlight><y></highlight>"
# /jump dan /down
jump: "<prefix><success>Melompat ke blok yang kamu lihat."
jump-none: "<prefix><error>Lihat blok dalam jangkauan untuk melompat ke sana."
down: "<prefix><success>Teleport ke tempat aman terendah di bawahmu."
down-none: "<prefix><error>Tidak ada tempat aman di bawahmu."
# /tppos, /tpo, /tpallworld
usage-tppos: "<prefix><muted>Penggunaan: <highlight>/tppos <x> <y> <z> [world]</highlight> atau <highlight>/tppos <pemain> <x> <y> <z> [world]</highlight>."
usage-tpo: "<prefix><muted>Penggunaan: <highlight>/tpo <x> <y> <z> [world]</highlight> atau <highlight>/tpo <pemain> <tujuan|koordinat></highlight>."
usage-tpallworld: "<prefix><muted>Penggunaan: <highlight>/tpallworld <world></highlight>."
tpallworld: "<prefix><muted><highlight><count></highlight> pemain dari world-mu dipindahkan ke <highlight><world></highlight>."
tpallworld-target: "<prefix><muted>Kamu dipindahkan ke <highlight><world></highlight>."
# /resetback
resetback: "<prefix><success>Riwayat /back kamu dihapus."
resetback-other: "<prefix><success>Riwayat /back <highlight><player></highlight> dihapus."
# Permintaan: jangkauan, daftar abaikan dan daftar item terlarang
request-too-far: "<prefix><error><highlight><player></highlight> terlalu jauh. Batasnya <highlight><distance></highlight> blok."
request-ignored: "<prefix><error><highlight><player></highlight> mengabaikanmu, jadi permintaan tidak dikirim."
request-you-ignore: "<prefix><error>Kamu mengabaikan <highlight><player></highlight>. Hentikan pengabaian untuk mengirim permintaan."
request-blocked-item: "<prefix><error>Kamu tidak bisa mengirim permintaan teleport sambil memegang <highlight><item></highlight>."
tpaall: "<prefix><muted>Meminta <highlight><count></highlight> pemain untuk teleport ke tempatmu."
