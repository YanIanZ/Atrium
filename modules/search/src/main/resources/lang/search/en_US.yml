# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
usage: "<prefix><muted>Usage: <highlight>/search item (material) [name:(text)] [cmd:(n)] [player:(name)]</highlight>, <highlight>/search results [page]</highlight>, <highlight>/search cancel</highlight>."
invalid-item: "<prefix><error><highlight><item></highlight> is not a valid item material."
invalid-option: "<prefix><error>Bad search option: <reason>. Use <highlight>name:(text)</highlight>, <highlight>cmd:(n)</highlight> or <highlight>player:(name)</highlight>."
player-not-online: "<prefix><error><highlight><player></highlight> is not online."
started: "<prefix><muted>Searching <highlight><players></highlight> player(s) for <highlight><filter></highlight>…"
busy: "<prefix><error>You already have a search running. Use <highlight>/search cancel</highlight> first."
no-players: "<prefix><warning>No online player inventory is available to search."
done: "<prefix><muted>Searched <highlight><checked></highlight> player(s) in <highlight><seconds></highlight>s: <highlight><found></highlight> player(s) with matches, <highlight><items></highlight> item(s)."
done-failed: "<prefix><warning><highlight><failed></highlight> player scan(s) failed; details are in the server log."
done-timeout: "<prefix><warning>The search timed out; the results below are partial."
done-capped: "<prefix><warning>Only the first players were checked (the per-search player cap was reached)."
cancelled-summary: "<prefix><warning>Search cancelled after <highlight><seconds></highlight>s: <highlight><checked></highlight> player(s) checked, <highlight><found></highlight> player(s) with matches."
cancelled-requested: "<prefix><warning>Cancelling your search…"
cancel-none: "<prefix><muted>You have no search running."
results-empty: "<prefix><muted>No matching items were found."
results-header: "<prefix><primary>Results for <highlight><filter></highlight> — page <highlight><page></highlight>/<highlight><pages></highlight>, <highlight><players></highlight> player(s):"
results-row: "<prefix><highlight><player></highlight><muted>: <highlight><amount></highlight> item(s) in <highlight><stacks></highlight> stack(s) — inventory <highlight><inventory></highlight>, ender chest <highlight><ender></highlight>, shulker boxes <highlight><shulker></highlight>."
results-footer: "<prefix><muted>Use <highlight>/search results <next></highlight> for the next page."
results-expired: "<prefix><muted>There is no stored search result. Use <highlight>/search item …</highlight> first."

scan-usage: "<prefix><muted>Usage: <highlight>/scan containers (material) [radius]</highlight> (radius in chunks, at most <highlight><max></highlight>), <highlight>/scan entities [world]</highlight>, <highlight>/scan cancel</highlight>."
scan-busy: "<prefix><error>You already have a scan running. Use <highlight>/scan cancel</highlight> first."
scan-cancel-requested: "<prefix><warning>Cancelling your scan…"
scan-cancel-none: "<prefix><muted>You have no scan running."
scan-cancel-all: "<prefix><warning>Cancelling <highlight><count></highlight> scan(s)."
containers-started: "<prefix><muted>Scanning <highlight><chunks></highlight> chunk(s) around <highlight><x>, <z></highlight> within <highlight><radius></highlight> chunk(s) for <highlight><item></highlight>…"
containers-progress: "<prefix><muted>Container scan: <highlight><done>/<total></highlight> chunk(s), <highlight><found></highlight> container(s) found, speed <highlight><speed></highlight>."
containers-done: "<prefix><success>Container scan finished in <highlight><seconds></highlight>s: <highlight><found></highlight> container(s) in <highlight><done>/<total></highlight> chunk(s), <highlight><skipped></highlight> not loaded."
containers-cancelled: "<prefix><warning>Container scan cancelled after <highlight><seconds></highlight>s: <highlight><found></highlight> container(s) found in <highlight><done>/<total></highlight> chunk(s)."
containers-none: "<prefix><muted>No loaded container holds that item within <highlight><radius></highlight> chunk(s)."
containers-hit: "<prefix><highlight><amount></highlight><muted> x <highlight><item></highlight> — <highlight><container></highlight> at <highlight><world> <x>, <y>, <z></highlight>"
containers-more: "<prefix><muted><highlight><count></highlight> more result(s) were not shown (result or line cap)."
containers-radius: "<prefix><error>The scan radius may be at most <highlight><max></highlight> chunks."

entities-started: "<prefix><muted>Scanning entities around <highlight><players></highlight> player(s)…"
entities-unknown-world: "<prefix><error>Unknown world <highlight><world></highlight>."
entities-no-players: "<prefix><muted>No online players are available to centre an entity scan on."
entities-header: "<prefix><primary>Entity scan in <highlight><world></highlight> around <highlight><players></highlight> player(s): <highlight><chunks></highlight> loaded chunk(s) inspected. On Folia this walks each player's region surroundings instead of World#getLoadedChunks()."
entities-players-capped: "<prefix><warning>Only <highlight><max></highlight> player region(s) were used as scan centres."
entities-empty: "<prefix><muted>No loaded chunk with entities was found."
entities-entity-header: "<prefix><secondary>Top chunks by entity count:"
entities-entity-line: "<prefix><muted><rank>. <highlight><world></highlight> chunk <highlight><x>,<z></highlight> — <highlight><count></highlight> entities"
entities-tile-header: "<prefix><secondary>Top chunks by tile-entity count:"
entities-tile-line: "<prefix><muted><rank>. <highlight><world></highlight> chunk <highlight><x>,<z></highlight> — <highlight><count></highlight> tile entities"
entities-capped: "<prefix><warning>The chunk limit of <highlight><max></highlight> was reached; later chunks were skipped."
entities-done: "<prefix><success>Entity scan finished in <highlight><seconds></highlight>s."
entities-cancelled: "<prefix><warning>Entity scan cancelled."
