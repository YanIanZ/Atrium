# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
usage: "<prefix><muted>Pemakaian: <highlight>/search item (material) [name:(teks)] [cmd:(n)] [player:(nama)]</highlight>, <highlight>/search results [halaman]</highlight>, <highlight>/search cancel</highlight>."
invalid-item: "<prefix><error><highlight><item></highlight> bukan material item yang valid."
invalid-option: "<prefix><error>Opsi pencarian salah: <reason>. Pakai <highlight>name:(teks)</highlight>, <highlight>cmd:(n)</highlight> atau <highlight>player:(nama)</highlight>."
player-not-online: "<prefix><error><highlight><player></highlight> sedang tidak online."
started: "<prefix><muted>Mencari <highlight><filter></highlight> di <highlight><players></highlight> pemain…"
busy: "<prefix><error>Kamu masih punya pencarian yang berjalan. Pakai <highlight>/search cancel</highlight> dulu."
no-players: "<prefix><warning>Tidak ada inventaris pemain online yang bisa dicari."
done: "<prefix><muted><highlight><checked></highlight> pemain diperiksa dalam <highlight><seconds></highlight> detik: <highlight><found></highlight> pemain punya kecocokan, <highlight><items></highlight> item."
done-failed: "<prefix><warning><highlight><failed></highlight> pemeriksaan pemain gagal; detailnya ada di log server."
done-timeout: "<prefix><warning>Pencarian melewati batas waktu; hasil di bawah hanya sebagian."
done-capped: "<prefix><warning>Hanya pemain pertama yang diperiksa (batas pemain per pencarian tercapai)."
cancelled-summary: "<prefix><warning>Pencarian dibatalkan setelah <highlight><seconds></highlight> detik: <highlight><checked></highlight> pemain diperiksa, <highlight><found></highlight> pemain punya kecocokan."
cancelled-requested: "<prefix><warning>Membatalkan pencarianmu…"
cancel-none: "<prefix><muted>Kamu tidak punya pencarian yang berjalan."
results-empty: "<prefix><muted>Tidak ada item yang cocok."
results-header: "<prefix><primary>Hasil untuk <highlight><filter></highlight> — halaman <highlight><page></highlight>/<highlight><pages></highlight>, <highlight><players></highlight> pemain:"
results-row: "<prefix><highlight><player></highlight><muted>: <highlight><amount></highlight> item dalam <highlight><stacks></highlight> stack — inventaris <highlight><inventory></highlight>, ender chest <highlight><ender></highlight>, kotak shulker <highlight><shulker></highlight>."
results-footer: "<prefix><muted>Pakai <highlight>/search results <next></highlight> untuk halaman berikutnya."
results-expired: "<prefix><muted>Belum ada hasil pencarian tersimpan. Pakai <highlight>/search item …</highlight> dulu."

scan-usage: "<prefix><muted>Pemakaian: <highlight>/scan containers (material) [radius]</highlight> (radius dalam chunk, maksimal <highlight><max></highlight>), <highlight>/scan entities [world]</highlight>, <highlight>/scan cancel</highlight>."
scan-busy: "<prefix><error>Kamu masih punya pemindaian yang berjalan. Pakai <highlight>/scan cancel</highlight> dulu."
scan-cancel-requested: "<prefix><warning>Membatalkan pemindaianmu…"
scan-cancel-none: "<prefix><muted>Kamu tidak punya pemindaian yang berjalan."
scan-cancel-all: "<prefix><warning>Membatalkan <highlight><count></highlight> pemindaian."
containers-started: "<prefix><muted>Memindai <highlight><chunks></highlight> chunk di sekitar <highlight><x>, <z></highlight> dalam <highlight><radius></highlight> chunk untuk <highlight><item></highlight>…"
containers-progress: "<prefix><muted>Pemindaian kontainer: <highlight><done>/<total></highlight> chunk, <highlight><found></highlight> kontainer ditemukan, kecepatan <highlight><speed></highlight>."
containers-done: "<prefix><success>Pemindaian kontainer selesai dalam <highlight><seconds></highlight> detik: <highlight><found></highlight> kontainer di <highlight><done>/<total></highlight> chunk, <highlight><skipped></highlight> tidak termuat."
containers-cancelled: "<prefix><warning>Pemindaian kontainer dibatalkan setelah <highlight><seconds></highlight> detik: <highlight><found></highlight> kontainer ditemukan di <highlight><done>/<total></highlight> chunk."
containers-none: "<prefix><muted>Tidak ada kontainer termuat yang berisi item itu dalam <highlight><radius></highlight> chunk."
containers-hit: "<prefix><highlight><amount></highlight><muted> x <highlight><item></highlight> — <highlight><container></highlight> di <highlight><world> <x>, <y>, <z></highlight>"
containers-more: "<prefix><muted><highlight><count></highlight> hasil lain tidak ditampilkan (batas hasil atau baris)."
containers-radius: "<prefix><error>Radius pemindaian maksimal <highlight><max></highlight> chunk."

entities-started: "<prefix><muted>Memindai entitas di sekitar <highlight><players></highlight> pemain…"
entities-unknown-world: "<prefix><error>Dunia <highlight><world></highlight> tidak dikenal."
entities-no-players: "<prefix><muted>Tidak ada pemain online untuk jadi pusat pemindaian entitas."
entities-header: "<prefix><primary>Pemindaian entitas di <highlight><world></highlight> sekitar <highlight><players></highlight> pemain: <highlight><chunks></highlight> chunk termuat diperiksa. Di Folia ini menelusuri sekitar region tiap pemain, bukan World#getLoadedChunks()."
entities-players-capped: "<prefix><warning>Hanya <highlight><max></highlight> region pemain yang dipakai sebagai pusat pemindaian."
entities-empty: "<prefix><muted>Tidak ada chunk termuat yang berisi entitas."
entities-entity-header: "<prefix><secondary>Chunk teratas menurut jumlah entitas:"
entities-entity-line: "<prefix><muted><rank>. <highlight><world></highlight> chunk <highlight><x>,<z></highlight> — <highlight><count></highlight> entitas"
entities-tile-header: "<prefix><secondary>Chunk teratas menurut jumlah tile entity:"
entities-tile-line: "<prefix><muted><rank>. <highlight><world></highlight> chunk <highlight><x>,<z></highlight> — <highlight><count></highlight> tile entity"
entities-capped: "<prefix><warning>Batas <highlight><max></highlight> chunk tercapai; chunk berikutnya dilewati."
entities-done: "<prefix><success>Pemindaian entitas selesai dalam <highlight><seconds></highlight> detik."
entities-cancelled: "<prefix><warning>Pemindaian entitas dibatalkan."
