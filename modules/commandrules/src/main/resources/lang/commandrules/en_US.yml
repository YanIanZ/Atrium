# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
usage: "<prefix><muted>Usage: <highlight>/commandrules (list|reload|check (command) [player])</highlight>."
list-header: "<prefix><primary>Command rules (<highlight><count></highlight>):"
list-empty: "<prefix><muted>No command rules are configured."
list-entry: "<muted>- <highlight>/<command></highlight> <dark_gray>|</dark_gray> money <highlight><cost></highlight>, levels <highlight><levels></highlight>, cooldown <highlight><cooldown></highlight>, warmup <highlight><warmup></highlight>s, worlds <highlight><worlds></highlight>, permission <highlight><permission></highlight>, confirm <highlight><confirm></highlight>"
reloaded: "<prefix><success>Reloaded <highlight><count></highlight> command rule(s)."
# The <error> placeholder below holds the error text, so it uses a plain colour.
reload-failed: "<prefix><error>Could not reload commandrules.yml: <red><error></red>"
check-header: "<prefix><muted>Command <highlight>/<command></highlight> resolves to <highlight>/<canonical></highlight>."
check-no-rule: "<prefix><muted>No rule matches <highlight>/<command></highlight>."
check-rule: "<muted>money <highlight><cost></highlight>, levels <highlight><levels></highlight>, cooldown <highlight><cooldown></highlight>, warmup <highlight><warmup></highlight>s, worlds <highlight><worlds></highlight>, permission <highlight><permission></highlight>, confirm <highlight><confirm></highlight>"
check-player: "<muted>Player <highlight><player></highlight>: cooldown <highlight><cooldown></highlight>, bypass <highlight><bypass></highlight>, extra permission <highlight><permission></highlight>"
check-player-unknown: "<prefix><error>Unknown player <highlight><player></highlight>."
check-player-failed: "<prefix><error>Could not load the data of <highlight><player></highlight>; the error was logged."
blocked-world: "<prefix><error>You cannot use <highlight>/<command></highlight> in <highlight><world></highlight>."
no-permission: "<prefix><error>You need the permission <highlight><permission></highlight> to use <highlight>/<command></highlight>."
no-permission-command: "<prefix><error>You are not allowed to use <highlight>/<command></highlight>."
cooldown: "<prefix><error>Wait <highlight><time></highlight> before using <highlight>/<command></highlight> again."
cost-confirm: "<prefix><warning>Using <highlight>/<command></highlight> costs <highlight><cost></highlight>. Run it again within <highlight><seconds></highlight> seconds to confirm."
insufficient-money: "<prefix><error>You need <highlight><cost></highlight> to use <highlight>/<command></highlight>."
insufficient-exp: "<prefix><error>You need <highlight><levels></highlight> experience levels to use <highlight>/<command></highlight>."
charge-failed: "<prefix><error>The payment for <highlight>/<command></highlight> failed, so the command was not run. The error was logged."
economy-missing: "<prefix><error><highlight>/<command></highlight> costs money, but the economy is not available."
command-failed: "<prefix><error>The command <highlight>/<command></highlight> could not be run."
refunded: "<prefix><warning><highlight><cost></highlight> was refunded because <highlight>/<command></highlight> did not run."
charge-after-failed: "<prefix><warning><highlight>/<command></highlight> ran, but the payment could not be taken. The error was logged."
warmup-started: "<prefix><muted>Using <highlight>/<command></highlight> in <highlight><seconds></highlight> seconds. Do not move or take damage."
warmup-countdown: "<muted>/<command> in <highlight><seconds></highlight>s"
warmup-cancelled: "<prefix><error>The warmup for <highlight>/<command></highlight> was cancelled by another command."
warmup-cancelled-move: "<prefix><error>The warmup for <highlight>/<command></highlight> was cancelled: you moved."
warmup-cancelled-inventory: "<prefix><error>The warmup for <highlight>/<command></highlight> was cancelled: you opened an inventory."
warmup-cancelled-damage: "<prefix><error>The warmup for <highlight>/<command></highlight> was cancelled: you took damage."
value-none: "none"
value-all: "all"
value-lifetime: "once per player"
value-yes: "yes"
value-no: "no"
value-unknown: "unknown"
value-ready: "ready"
