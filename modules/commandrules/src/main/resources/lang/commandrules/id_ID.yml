# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
usage: "<prefix><muted>Cara pakai: <highlight>/commandrules (list|reload|check (command) [player])</highlight>."
list-header: "<prefix><primary>Aturan perintah (<highlight><count></highlight>):"
list-empty: "<prefix><muted>Belum ada aturan perintah yang dikonfigurasi."
list-entry: "<muted>- <highlight>/<command></highlight> <dark_gray>|</dark_gray> uang <highlight><cost></highlight>, level <highlight><levels></highlight>, cooldown <highlight><cooldown></highlight>, warmup <highlight><warmup></highlight>s, dunia <highlight><worlds></highlight>, izin <highlight><permission></highlight>, konfirmasi <highlight><confirm></highlight>"
reloaded: "<prefix><success>Berhasil memuat ulang <highlight><count></highlight> aturan perintah."
# Placeholder <error> di bawah berisi teks kesalahan, jadi memakai warna biasa.
reload-failed: "<prefix><error>Gagal memuat ulang commandrules.yml: <red><error></red>"
check-header: "<prefix><muted>Perintah <highlight>/<command></highlight> mengarah ke <highlight>/<canonical></highlight>."
check-no-rule: "<prefix><muted>Tidak ada aturan untuk <highlight>/<command></highlight>."
check-rule: "<muted>uang <highlight><cost></highlight>, level <highlight><levels></highlight>, cooldown <highlight><cooldown></highlight>, warmup <highlight><warmup></highlight>s, dunia <highlight><worlds></highlight>, izin <highlight><permission></highlight>, konfirmasi <highlight><confirm></highlight>"
check-player: "<muted>Pemain <highlight><player></highlight>: cooldown <highlight><cooldown></highlight>, bypass <highlight><bypass></highlight>, izin tambahan <highlight><permission></highlight>"
check-player-unknown: "<prefix><error>Pemain <highlight><player></highlight> tidak dikenal."
check-player-failed: "<prefix><error>Gagal memuat data <highlight><player></highlight>; kesalahan sudah dicatat."
blocked-world: "<prefix><error>Kamu tidak boleh memakai <highlight>/<command></highlight> di <highlight><world></highlight>."
no-permission: "<prefix><error>Kamu memerlukan izin <highlight><permission></highlight> untuk memakai <highlight>/<command></highlight>."
no-permission-command: "<prefix><error>Kamu tidak diizinkan memakai <highlight>/<command></highlight>."
cooldown: "<prefix><error>Tunggu <highlight><time></highlight> sebelum memakai <highlight>/<command></highlight> lagi."
cost-confirm: "<prefix><warning>Memakai <highlight>/<command></highlight> membutuhkan <highlight><cost></highlight>. Jalankan lagi dalam <highlight><seconds></highlight> detik untuk konfirmasi."
insufficient-money: "<prefix><error>Kamu memerlukan <highlight><cost></highlight> untuk memakai <highlight>/<command></highlight>."
insufficient-exp: "<prefix><error>Kamu memerlukan <highlight><levels></highlight> level pengalaman untuk memakai <highlight>/<command></highlight>."
charge-failed: "<prefix><error>Pembayaran untuk <highlight>/<command></highlight> gagal, jadi perintah tidak dijalankan. Kesalahan sudah dicatat."
economy-missing: "<prefix><error><highlight>/<command></highlight> membutuhkan uang, tetapi ekonomi tidak tersedia."
command-failed: "<prefix><error>Perintah <highlight>/<command></highlight> tidak dapat dijalankan."
refunded: "<prefix><warning><highlight><cost></highlight> dikembalikan karena <highlight>/<command></highlight> tidak dijalankan."
charge-after-failed: "<prefix><warning><highlight>/<command></highlight> sudah dijalankan, tetapi pembayaran gagal diambil. Kesalahan sudah dicatat."
warmup-started: "<prefix><muted>Memakai <highlight>/<command></highlight> dalam <highlight><seconds></highlight> detik. Jangan bergerak atau menerima damage."
warmup-countdown: "<muted>/<command> dalam <highlight><seconds></highlight>s"
warmup-cancelled: "<prefix><error>Warmup untuk <highlight>/<command></highlight> dibatalkan oleh perintah lain."
warmup-cancelled-move: "<prefix><error>Warmup untuk <highlight>/<command></highlight> dibatalkan: kamu bergerak."
warmup-cancelled-inventory: "<prefix><error>Warmup untuk <highlight>/<command></highlight> dibatalkan: kamu membuka inventaris."
warmup-cancelled-damage: "<prefix><error>Warmup untuk <highlight>/<command></highlight> dibatalkan: kamu menerima damage."
value-none: "tidak ada"
value-all: "semua"
value-lifetime: "sekali per pemain"
value-yes: "ya"
value-no: "tidak"
value-unknown: "tidak diketahui"
value-ready: "siap"
