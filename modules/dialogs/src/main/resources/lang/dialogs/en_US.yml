failed: "<prefix><error>Something went wrong with this dialog. See the server log."
build-failed: "<prefix><error>Dialog <highlight><name></highlight> could not be shown. See the server log."
outdated: "<prefix><error>This dialog was reloaded meanwhile. Please open it again."
cooldown: "<prefix><error>Please wait <highlight><time></highlight> before opening this dialog again."
no-permission-button: "<prefix><error>You are not allowed to use that button."
no-permission-dialog: "<prefix><error>You are not allowed to open that dialog."
invalid-missing: "<prefix><error>Please fill in <highlight><input></highlight>."
invalid-too-long: "<prefix><error><highlight><input></highlight> may be at most <max> characters long."
invalid-pattern: "<prefix><error><highlight><input></highlight> contains characters that are not allowed."
invalid-option: "<prefix><error>Please choose one of the offered options for <highlight><input></highlight>."
invalid-range: "<prefix><error>The value of <highlight><input></highlight> is out of range."
invalid-action: "<prefix><error>That button is not part of this dialog."
input-unsafe: "<prefix><error>Your input cannot be used here. Use only letters, digits and single spaces."
actions-unavailable: "<prefix><error>This dialog cannot run its actions right now."
busy: "<prefix><error>Please wait until your previous action has finished."
unknown: "<prefix><error>There is no dialog named <highlight><name></highlight>."
opened-other: "<prefix><muted>Opened dialog <highlight><name></highlight> for <highlight><player></highlight>."
target-left: "<prefix><error>The target player disconnected before the dialog opened."
list: "<prefix><muted>Dialogs (<highlight><count></highlight>): <highlight><dialogs></highlight>"
list-empty: "<prefix><muted>There are no dialogs you can open."
reloaded: "<prefix><success>Loaded <highlight><count></highlight> dialogs.</success> <muted>Skipped files: <highlight><failed></highlight> (see the server log)."
reload-failed: "<prefix><error>Reloading the dialogs failed. See the server log."
bedrock-action: "Action"
usage:
  - "<prefix><primary>Dialogs:"
  - "<primary>/dialog open <name> [player]</primary> <muted>- open a dialog"
  - "<primary>/dialog preview <name></primary> <muted>- see a dialog without running its actions"
  - "<primary>/dialog list</primary> <muted>- list the dialogs you can open"
  - "<primary>/dialog reload</primary> <muted>- reload the dialog files"
