gamerule-usage: "<prefix><muted>Usage: <primary>/gamerule <world> <rule> [value]</primary>. Leave the value out to read the current rule."
gamerule-unknown-world: "<prefix><error>World <highlight><world></highlight> is not loaded."
gamerule-unknown-rule: "<prefix><error>Unknown game rule <highlight><rule></highlight>. Tab completion lists every rule this server knows."
gamerule-invalid: "<prefix><error><highlight><value></highlight> is not a valid value for <highlight><rule></highlight>; expected <highlight><expected></highlight>."
gamerule-show: "<prefix><muted><highlight><rule></highlight> in <highlight><world></highlight> is <highlight><value></highlight>."
gamerule-set: "<prefix><success>Set <highlight><rule></highlight> in <highlight><world></highlight> to <highlight><value></highlight>."
gamerule-failed: "<prefix><error>The game rule could not be changed; another plugin may have cancelled it."
compass-usage: "<prefix><muted>Usage: <primary>/compass <player|spawn|x z|reset> [target]</primary>. Tracking a player refreshes while you hold a compass."
compass-tracking: "<prefix><success>Your compass now tracks <highlight><player></highlight>."
compass-tracking-other: "<prefix><success>The compass of <highlight><holder></highlight> now tracks <highlight><player></highlight>."
compass-already: "<prefix><muted>Your compass already tracks <highlight><player></highlight>."
compass-busy: "<prefix><error>Too many players are tracking a compass right now. Try again later."
compass-needs-item: "<prefix><error>Hold a compass to track a player."
compass-spawn: "<prefix><success>Your compass points to the spawn of <highlight><world></highlight>."
compass-spawn-other: "<prefix><success>The compass of <highlight><holder></highlight> points to the spawn of <highlight><world></highlight>."
compass-reset: "<prefix><success>Your compass was reset to the spawn of <highlight><world></highlight>."
compass-reset-other: "<prefix><success>The compass of <highlight><holder></highlight> was reset to the spawn of <highlight><world></highlight>."
compass-coords: "<prefix><success>Your compass points to <highlight><x></highlight>, <highlight><z></highlight> in <highlight><world></highlight>."
compass-coords-other: "<prefix><success>The compass of <highlight><holder></highlight> points to <highlight><x></highlight>, <highlight><z></highlight> in <highlight><world></highlight>."
compass-item-lost: "<prefix><muted>Compass tracking stopped because you no longer hold a compass."
compass-target-left: "<prefix><muted>Compass tracking stopped because the tracked player left."
target-left: "<prefix><error>The target player disconnected before the command ran."
pearl-cooldown: "<prefix><error>Ender pearls are cooling down: <highlight><seconds></highlight> second(s) left."
elytra-disabled: "<prefix><error>Elytra gliding is disabled in this world."
pvp-disabled: "<prefix><error>PvP is disabled in this world."
blockcycle-none: "<prefix><error>Look at a block within reach first."
blockcycle-not-owned: "<prefix><error>That block is in another region; move closer and try again."
blockcycle-unsupported: "<prefix><muted>This block has no state that /blockcycle can change."
blockcycle-cancelled: "<prefix><error>The block change was cancelled by a protection plugin."
blockcycle-failed: "<prefix><error>The block could not be changed. See the server log."
blockcycle-done: "<prefix><success>Cycled the state of <highlight><block></highlight>."
