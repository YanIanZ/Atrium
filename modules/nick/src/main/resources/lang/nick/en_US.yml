# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage-nick: "<prefix><muted>Usage: <highlight>/nick (nickname|off) [player]</highlight>."
usage-realname: "<prefix><muted>Usage: <highlight>/realname (nickname)</highlight>."
changed: "<prefix><success>Your nickname is now <nick>."
changed-other: "<prefix><success>Nickname of <highlight><player></highlight> is now <nick>."
cleared: "<prefix><muted>Your nickname has been removed."
cleared-other: "<prefix><muted>Removed the nickname of <highlight><player></highlight>."
current: "<prefix><muted>Your nickname: <nick>"
current-none: "<prefix><muted>You do not have a nickname. Set one with <highlight>/nick (nickname)</highlight>."
in-use: "<prefix><error>That nickname is already used by <highlight><player></highlight>."
in-use-generic: "<prefix><error>That nickname is already in use."
in-use-real: "<prefix><error>That name belongs to <highlight><player></highlight>."
invalid-length: "<prefix><error>A nickname must be <highlight><min></highlight> to <highlight><max></highlight> characters long."
invalid-characters: "<prefix><error>That nickname contains characters that are not allowed. Allowed pattern: <highlight><pattern></highlight>"
invalid-format: "<prefix><error>That nickname formatting is not valid."
blocked: "<prefix><error>That nickname contains a blocked word."
too-long: "<prefix><error>A nickname may be at most <highlight><max></highlight> characters before formatting."
failed: "<prefix><error>The nickname could not be saved. See the server log."
realname-result: "<prefix><muted>Nickname <nick> <muted>belongs to <highlight><player></highlight>."
realname-no-nick: "<prefix><muted><highlight><player></highlight> has no nickname."
realname-none: "<prefix><error>No player uses that nickname."
target-left: "<prefix><error>The target player disconnected before the command ran."
