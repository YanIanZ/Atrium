# Importer messages. Theme tags are configured in config.yml under "theme".
# Everything a player or a foreign plugin wrote is inserted with Msg.unparsed, never parsed.
usage: "<prefix><error>Usage: /atrium-import <sources> [dry-run|run] [--only=<categories>] [--overwrite] — <reason>"
usage-cmi: "<prefix><error>Usage: /atrium-import cmi [dry-run|run] [--only=<categories>] [--overwrite] — <reason>"
usage-essentials: "<prefix><error>Usage: /atrium-import essentials [dry-run|run] [--only=<categories>] [--overwrite] — <reason>"
reason-missing-subcommand: "no subcommand given"
reason-unknown-option: "unknown option <highlight><value></highlight>"
reason-unknown-category: "unknown category <highlight><value></highlight>"
reason-missing-only-list: "<highlight>--only</highlight> needs a comma-separated list of categories"
no-cmi-folder: "<prefix><error>CMI data folder not found: <highlight><path></highlight>. Set <highlight>cmiFolder</highlight> in modules/importer.yml."
no-essentials-folder: "<prefix><error>EssentialsX data folder not found: <highlight><path></highlight>. Set <highlight>essentialsFolder</highlight> in modules/importer.yml."
already-running: "<prefix><error>An import is already running. Use /atrium-import status to check it or /atrium-import cancel to stop it."
started: "<prefix><muted>Started the <highlight><source></highlight> import (<highlight><options></highlight>). Source folder: <highlight><path></highlight>."
dry-run-started: "<prefix><muted>Started the <highlight><source></highlight> dry run (<highlight><options></highlight>). Nothing will be written. Source folder: <highlight><path></highlight>."
progress: "<prefix><muted><phase>: <highlight><percent></highlight> (<highlight><processed></highlight>/<highlight><total></highlight>), ETA <highlight><eta></highlight>."
cancel-none: "<prefix><muted>No import is running."
cancel-requested: "<prefix><warning>Import cancellation requested; it stops after the current record."
cancelled: "<prefix><warning>Import cancelled after <highlight><imported></highlight> item(s)."
summary-header: "<prefix><primary><source> summary:"
summary-line: "<prefix><muted><line>"
finished: "<prefix><success><source> import finished: imported <highlight><imported></highlight>, skipped <highlight><skipped></highlight>, invalid <highlight><invalid></highlight>, failed <highlight><failed></highlight>, unsupported <highlight><unsupported></highlight>."
dry-run-finished: "<prefix><success><source> dry run finished: would import <highlight><imported></highlight>, skipped <highlight><skipped></highlight>, invalid <highlight><invalid></highlight>, failed <highlight><failed></highlight>, unsupported <highlight><unsupported></highlight>."
failed: "<prefix><error><source> import failed: <highlight><reason></highlight>. See the server log and the report file."
report-failed: "<prefix><error>Cannot write the import report: <highlight><reason></highlight>."
report-saved: "<prefix><muted>Report saved to <accent><path></accent>."
report-copy-hover: "<muted>Click to copy this path"
problem: "<prefix><error><problem>"
more-problems: "<prefix><error>... and <highlight><count></highlight> more problem(s); see the report file."
status-none: "<prefix><muted>No import has run in this server session."
status-line: "<prefix><muted><source> <mode> import [<highlight><state></highlight>] — <phase> <highlight><percent></highlight> (<highlight><processed></highlight>/<highlight><total></highlight>), ETA <highlight><eta></highlight>, elapsed <highlight><elapsed></highlight>."
status-line2: "<prefix><muted>Imported <highlight><imported></highlight>, skipped <highlight><skipped></highlight>, invalid <highlight><invalid></highlight>, failed <highlight><failed></highlight>, unsupported <highlight><unsupported></highlight>."
status-report: "<prefix><muted>Report: <accent><path></accent>"
backup-started: "<prefix><muted>Creating an Atrium database backup..."
backup-done: "<prefix><success>Backup written to <highlight><file></highlight> (<highlight><removed></highlight> old backup(s) removed)."
backup-missing: "<prefix><error>Atrium SQLite database not found: <highlight><file></highlight>"
backup-failed: "<prefix><error>Backup failed: <highlight><reason></highlight>. See the server log."
backup-mysql: "<prefix><warning>Atrium uses MySQL/MariaDB. Run mysqldump on the database host, for example: <highlight>mysqldump --single-transaction -h <host> -P <port> -u <user> <database> > backup.sql</highlight>"
