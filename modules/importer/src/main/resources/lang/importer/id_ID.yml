# Pesan importer. Tag tema diatur di config.yml pada bagian "theme".
# Semua teks dari pemain atau plugin lain dimasukkan dengan Msg.unparsed, tidak pernah diparse.
usage: "<prefix><error>Penggunaan: /atrium-import <sources> [dry-run|run] [--only=<categories>] [--overwrite] — <reason>"
usage-cmi: "<prefix><error>Penggunaan: /atrium-import cmi [dry-run|run] [--only=<categories>] [--overwrite] — <reason>"
usage-essentials: "<prefix><error>Penggunaan: /atrium-import essentials [dry-run|run] [--only=<categories>] [--overwrite] — <reason>"
reason-missing-subcommand: "subperintah belum diberikan"
reason-unknown-option: "opsi tidak dikenal <highlight><value></highlight>"
reason-unknown-category: "kategori tidak dikenal <highlight><value></highlight>"
reason-missing-only-list: "<highlight>--only</highlight> membutuhkan daftar kategori yang dipisahkan koma"
no-cmi-folder: "<prefix><error>Folder data CMI tidak ditemukan: <highlight><path></highlight>. Atur <highlight>cmiFolder</highlight> di modules/importer.yml."
no-essentials-folder: "<prefix><error>Folder data EssentialsX tidak ditemukan: <highlight><path></highlight>. Atur <highlight>essentialsFolder</highlight> di modules/importer.yml."
already-running: "<prefix><error>Impor sedang berjalan. Gunakan /atrium-import status untuk memeriksanya atau /atrium-import cancel untuk menghentikannya."
started: "<prefix><muted>Impor <highlight><source></highlight> dimulai (<highlight><options></highlight>). Folder sumber: <highlight><path></highlight>."
dry-run-started: "<prefix><muted>Uji kering <highlight><source></highlight> dimulai (<highlight><options></highlight>). Tidak ada yang akan ditulis. Folder sumber: <highlight><path></highlight>."
progress: "<prefix><muted><phase>: <highlight><percent></highlight> (<highlight><processed></highlight>/<highlight><total></highlight>), perkiraan <highlight><eta></highlight>."
cancel-none: "<prefix><muted>Tidak ada impor yang sedang berjalan."
cancel-requested: "<prefix><warning>Pembatalan impor diminta; impor berhenti setelah data saat ini."
cancelled: "<prefix><warning>Impor dibatalkan setelah <highlight><imported></highlight> item."
summary-header: "<prefix><primary>Ringkasan <source>:"
summary-line: "<prefix><muted><line>"
finished: "<prefix><success>Impor <source> selesai: diimpor <highlight><imported></highlight>, dilewati <highlight><skipped></highlight>, tidak valid <highlight><invalid></highlight>, gagal <highlight><failed></highlight>, tidak didukung <highlight><unsupported></highlight>."
dry-run-finished: "<prefix><success>Uji kering <source> selesai: akan diimpor <highlight><imported></highlight>, dilewati <highlight><skipped></highlight>, tidak valid <highlight><invalid></highlight>, gagal <highlight><failed></highlight>, tidak didukung <highlight><unsupported></highlight>."
failed: "<prefix><error>Impor <source> gagal: <highlight><reason></highlight>. Lihat log server dan berkas laporan."
report-failed: "<prefix><error>Tidak dapat menulis laporan impor: <highlight><reason></highlight>."
report-saved: "<prefix><muted>Laporan disimpan di <accent><path></accent>."
report-copy-hover: "<muted>Klik untuk menyalin path ini"
problem: "<prefix><error><problem>"
more-problems: "<prefix><error>... dan <highlight><count></highlight> masalah lain; lihat berkas laporan."
status-none: "<prefix><muted>Belum ada impor yang berjalan di sesi server ini."
status-line: "<prefix><muted>Impor <source> <mode> [<highlight><state></highlight>] — <phase> <highlight><percent></highlight> (<highlight><processed></highlight>/<highlight><total></highlight>), perkiraan <highlight><eta></highlight>, berlalu <highlight><elapsed></highlight>."
status-line2: "<prefix><muted>Diimpor <highlight><imported></highlight>, dilewati <highlight><skipped></highlight>, tidak valid <highlight><invalid></highlight>, gagal <highlight><failed></highlight>, tidak didukung <highlight><unsupported></highlight>."
status-report: "<prefix><muted>Laporan: <accent><path></accent>"
backup-started: "<prefix><muted>Membuat cadangan basis data Atrium..."
backup-done: "<prefix><success>Cadangan ditulis ke <highlight><file></highlight> (<highlight><removed></highlight> cadangan lama dihapus)."
backup-missing: "<prefix><error>Basis data SQLite Atrium tidak ditemukan: <highlight><file></highlight>"
backup-failed: "<prefix><error>Cadangan gagal: <highlight><reason></highlight>. Lihat log server."
backup-mysql: "<prefix><warning>Atrium memakai MySQL/MariaDB. Jalankan mysqldump di host basis data, misalnya: <highlight>mysqldump --single-transaction -h <host> -P <port> -u <user> <database> > backup.sql</highlight>"
