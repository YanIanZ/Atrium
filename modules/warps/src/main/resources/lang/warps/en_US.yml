# Warps. Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>.
teleported: "<prefix><success>Teleported to the warp <highlight><warp></highlight>."
teleported-other: "<prefix><success>Sent <highlight><player></highlight> to the warp <highlight><warp></highlight>."
not-found: "<prefix><error>There is no warp called <highlight><warp></highlight>."
world-not-loaded: "<prefix><error>The world <highlight><world></highlight> of this warp is not loaded."
invalid-name: "<prefix><error>Warp and category names may only contain letters, digits, _ and - (at most 32 characters)."
created: "<prefix><success>Warp <highlight><warp></highlight> created in the category <highlight><category></highlight> at <highlight><at_x> <at_y> <at_z></highlight>."
moved: "<prefix><success>Warp <highlight><warp></highlight> moved to <highlight><at_x> <at_y> <at_z></highlight> (category <highlight><category></highlight>)."
deleted: "<prefix><success>Warp <highlight><warp></highlight> deleted."
renamed: "<prefix><success>Warp <highlight><warp></highlight> renamed to <highlight><new_name></highlight>."
exists: "<prefix><error>A warp called <highlight><new_name></highlight> already exists."
cancelled: "<prefix><error>Another plugin blocked this change. Nothing was changed."
save-failed: "<prefix><error>The warp could not be saved, so nothing was changed. The error was logged."
list-header: "<prefix><primary>Warps <muted>(<highlight><count></highlight>):"
list-empty: "<muted>  There are no warps you can use."
list-category: "<secondary><category></secondary> <dark_gray>(<count>)</dark_gray><muted>: </muted><warps>"
list-entry: "<accent><warp></accent>"
list-separator: "<dark_gray>, </dark_gray>"
list-hover: "<muted>Click to warp to <highlight><warp></highlight><newline><muted><world> <x> <y> <z>"
not-owner: "<prefix><error>The warp <highlight><warp></highlight> belongs to another player."
limit-reached: "<prefix><error>You already own <highlight><limit></highlight> warps. Delete one with <accent>/delwarp</accent> first."
cooldown: "<prefix><warning>Wait <highlight><time></highlight> before using <highlight><warp></highlight> again."
cost-insufficient: "<prefix><error>The warp <highlight><warp></highlight> costs <highlight><cost></highlight>, but your balance is <highlight><balance></highlight>."
cost-failed: "<prefix><error>The teleport cost could not be charged, so the warp was cancelled. Nothing was taken."
economy-missing: "<prefix><error>This warp has a teleport cost, but the economy module is not enabled. Nothing was taken."
groups-header: "<prefix><primary>Warp groups <muted>(<highlight><groups></highlight> groups, <highlight><warps></highlight> warps)"
groups-list: "<prefix><groups>"
groups-entry: "<accent><group></accent> <dark_gray>(<count>)</dark_gray>"
groups-hover: "<muted>Click to list the <highlight><count></highlight> warps in <highlight><group></highlight>."
groups-empty: "<muted>  There are no warp groups you can use."
icon-set: "<prefix><success>The menu icon of <highlight><warp></highlight> is now the item in your hand."
icon-empty-hand: "<prefix><error>Hold the item you want to use as the icon first."
usage-setwarp: "<prefix><muted>Usage: <highlight>/setwarp \\<name> [category]"
usage-delwarp: "<prefix><muted>Usage: <highlight>/delwarp \\<warp>"
usage-renamewarp: "<prefix><muted>Usage: <highlight>/renamewarp \\<warp> \\<new name>"
usage-setwarpicon: "<prefix><muted>Usage: <highlight>/setwarpicon \\<warp></highlight> <muted>while holding the icon item"
# /warps chest menu
gui-title: "<primary>Warps"
gui-title-category: "<primary>Warps: <highlight><category>"
gui-category: "<secondary><bold><category></bold> <muted>(<count>)"
gui-item-name: "<primary><warp>"
gui-item-location: "<secondary>Location: <highlight><world> <x> <y> <z>"
gui-item-category: "<secondary>Category: <highlight><category>"
gui-item-click: "<accent>Click to teleport."
gui-empty: "<muted>No warps are available to you."
gui-item-cost: "<secondary>Cost: <highlight><cost>"
gui-item-cooldown: "<secondary>Cooldown: <highlight><seconds>s"
gui-item-locations: "<secondary>Random locations: <highlight><count>"
gui-prev: "<primary>« Previous page"
gui-prev-hover: "<muted>Show the previous page."
gui-next: "<primary>Next page »"
gui-next-hover: "<muted>Show the next page."
gui-page: "<muted>Page <highlight><page></highlight>/<highlight><pages>"
gui-close: "<error>Close"
gui-close-hover: "<muted>Close the menu."
invalid-permission: "<prefix><error><highlight><permission></highlight> is not a valid permission node (letters, digits, _ . - * and :)."
# /editwarp
edit-usage: "<prefix><muted>Usage: <highlight>/editwarp \\<warp></highlight><muted>, then <highlight>move</highlight>, <highlight>rename \\<name></highlight>, <highlight>category \\<category></highlight>, <highlight>permission \\<node|none></highlight>, <highlight>cost \\<amount></highlight>, <highlight>cooldown \\<seconds></highlight>, <highlight>addlocation</highlight>, <highlight>locations</highlight>, <highlight>clearlocations</highlight>, <highlight>icon</highlight> or <highlight>delete</highlight>."
edit-header: "<prefix><primary>Warp <highlight><warp></highlight>"
edit-location: "<secondary>  Location: <highlight><world> <x> <y> <z>"
edit-category: "<secondary>  Category: <highlight><category>"
edit-permission: "<secondary>  Permission: <highlight><permission>"
edit-permission-derived: "<secondary>  Permission: <highlight><permission></highlight> <muted>(derived from the name)"
edit-icon: "<secondary>  Icon: <highlight><icon></highlight> <muted>(custom model data <model>)"
edit-icon-default: "<secondary>  Icon: <highlight><icon></highlight> <muted>(default)"
edit-owner: "<secondary>  Owner: <highlight><owner></highlight> <muted>(<uuid>)"
edit-owner-server: "<secondary>  Owner: <highlight>server"
edit-actions: "<secondary>  Actions: <actions>"
edit-no-actions: "<muted>  You may view this warp, but not change it."
edit-denied: "<prefix><error>You may not change the warp <highlight><warp></highlight>. You need <highlight><permission></highlight> or must own the warp."
edit-button-move: "<accent>[Move here]"
edit-button-rename: "<accent>[Rename]"
edit-button-category: "<accent>[Category]"
edit-button-permission: "<accent>[Permission]"
edit-button-icon: "<accent>[Icon from hand]"
edit-button-delete: "<error>[Delete]"
edit-hover-move: "<muted>Move this warp to where you stand."
edit-hover-rename: "<muted>Suggest the rename command."
edit-hover-category: "<muted>Suggest the category command."
edit-hover-permission: "<muted>Suggest the permission command (use <highlight>none</highlight> to clear it)."
edit-hover-icon: "<muted>Use the item in your hand as the menu icon."
edit-hover-delete: "<muted>Ask for confirmation, then delete this warp."
edit-delete-confirm: "<prefix><warning>Delete the warp <highlight><warp></highlight>? Click <confirm> or run <highlight>/editwarp <warp> delete confirm</highlight>."
edit-confirm-button: "<error>[Confirm delete]"
edit-confirm-hover: "<muted>Click to delete this warp."
edit-permission-set: "<prefix><success>The permission of <highlight><warp></highlight> is now <highlight><permission></highlight>."
edit-permission-cleared: "<prefix><success>The permission of <highlight><warp></highlight> is derived from its name again."
edit-cost: "<secondary>  Cost: <highlight><cost>"
edit-cost-free: "<secondary>  Cost: <highlight>free"
edit-cooldown: "<secondary>  Cooldown: <highlight><seconds>s"
edit-locations: "<secondary>  Random locations: <highlight><extra></highlight> extra <muted>(<total> in the deck, mode <mode>)"
edit-cost-set: "<prefix><success>The warp <highlight><warp></highlight> now costs <highlight><cost></highlight>."
edit-cooldown-set: "<prefix><success>The cooldown of <highlight><warp></highlight> is now <highlight><seconds>s</highlight>."
invalid-cost: "<prefix><error>That is not a valid cost. Use a number of 0 or more, such as <highlight>25</highlight>."
invalid-cooldown: "<prefix><error>That is not a valid cooldown. Use a whole number of seconds from 0 to 604800."
usage-editwarpcost: "<prefix><muted>Usage: <highlight>/editwarp \\<warp> cost \\<amount></highlight> <muted>(0 makes the warp free)"
usage-editwarpcooldown: "<prefix><muted>Usage: <highlight>/editwarp \\<warp> cooldown \\<seconds></highlight> <muted>(0 disables the cooldown)"
locations-header: "<prefix><primary>Random locations of <highlight><warp></highlight> <muted>(<highlight><total></highlight> in the deck, mode <highlight><mode></highlight>)"
locations-primary: "<secondary>  <highlight><index></highlight>. <muted><world> <x> <y> <z> <dark_gray>(main location)"
locations-entry: "<secondary>  <highlight><index></highlight>. <muted><world> <x> <y> <z>"
locations-added: "<prefix><success>Added <highlight><world> <x> <y> <z></highlight> to the deck of <highlight><warp></highlight> <muted>(<count> extra, <total> in total)."
locations-full: "<prefix><error>This warp already has the maximum of <highlight><max></highlight> extra random locations."
locations-cleared: "<prefix><success>Removed <highlight><count></highlight> extra random location(s) of <highlight><warp></highlight>."
locations-clear-confirm: "<prefix><warning>Remove every extra random location of <highlight><warp></highlight>? Click <confirm> or run <highlight>/editwarp <warp> clearlocations confirm</highlight>."
locations-clear-button: "<error>[Confirm removal]"
locations-clear-hover: "<muted>Click to remove every extra random location of this warp."
