# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
location: "<prefix><muted>You died at <highlight><death_world></highlight> <highlight><death_x></highlight>, <highlight><death_y></highlight>, <highlight><death_z></highlight>."
stats-header: "<prefix><primary>Death statistics of <highlight><player></highlight>:"
