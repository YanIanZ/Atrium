# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage: "<prefix><muted>Usage: <highlight>/particles</highlight> opens the menu; <highlight>/particles (style) [particle] [colour]</highlight>, <highlight>/particles off</highlight>, <highlight>/particles list</highlight>, <highlight>/particles preset (name)</highlight>."
effect-applied: "<prefix><success>Particle effect <highlight><style></highlight> enabled with <highlight><particle></highlight>."
effect-removed: "<prefix><muted>The <highlight><style></highlight> effect has been removed."
all-removed: "<prefix><muted>All your particle effects have been removed."
not-active: "<prefix><warning>You do not have the <highlight><style></highlight> effect active."
slots-full: "<prefix><error>You can use at most <highlight><slots></highlight> effects at once. Remove one first with <highlight>/particles off</highlight>."
style-denied: "<prefix><error>You do not have permission for the <highlight><style></highlight> style."
particle-denied: "<prefix><error>You do not have permission for the <highlight><particle></highlight> particle."
list-header: "<prefix><primary>Your active particle effects:"
list-entry: " <highlight><style></highlight> <muted>- <highlight><particle></highlight> <muted>(<colour>)"
list-empty: "<prefix><muted>You have no active particle effects. Open <highlight>/particles</highlight> to choose one."
hideothers-on: "<prefix><success>Particles of other players are now hidden from you."
hideothers-off: "<prefix><muted>Particles of other players are shown to you again."
hideothers-denied: "<prefix><error>You do not have permission to hide other players' particles."
hidden-on: "<prefix><muted>Your own particle effects are now hidden."
hidden-off: "<prefix><success>Your own particle effects are visible again."
preset-unknown: "<prefix><error>No particle preset named <highlight><name></highlight> exists."
preset-denied: "<prefix><error>You do not have permission to use particle presets."
preset-empty: "<prefix><error>The preset <highlight><name></highlight> has no valid effects."
preset-applied: "<prefix><success>Applied the particle preset <highlight><name></highlight>."
preset-truncated: "<prefix><warning>The preset has more effects than your slots; only the first <highlight><slots></highlight> were applied."
unknown-style: "<prefix><error>Unknown particle style <highlight><style></highlight>. Use <highlight>/particles</highlight> to browse."
unknown-particle: "<prefix><error>Unknown particle <highlight><particle></highlight>."
unsupported-particle: "<prefix><error>The particle <highlight><particle></highlight> needs extra data and cannot be used here."
unknown-colour: "<prefix><error>Unknown colour <highlight><colour></highlight>. Use a hex value such as <highlight>#5FB3A1</highlight>, <highlight>rainbow</highlight> or <highlight>gradient</highlight>."
usage-preset: "<prefix><muted>Usage: <highlight>/particles preset (name)</highlight>."
usage-admin-set: "<prefix><muted>Usage: <highlight>/particles admin set (player) (style) [particle] [colour]</highlight>."
usage-admin-clear: "<prefix><muted>Usage: <highlight>/particles admin clear (player)</highlight>."
admin-set: "<prefix><success>Gave <highlight><player></highlight> the <highlight><style></highlight> effect with <highlight><particle></highlight>."
admin-cleared: "<prefix><success>Removed every particle effect of <highlight><player></highlight>."
admin-set-target: "<prefix><success>An administrator gave you the <highlight><style></highlight> particle effect."
admin-clear-target: "<prefix><muted>An administrator removed your particle effects."
admin-reloaded: "<prefix><success>Particle configuration reloaded."
admin-reload-failed: "<prefix><error>Reloading the particle configuration failed. See the server log."
admin-failed: "<prefix><error>The particle change could not be saved. See the server log."
target-left: "<prefix><error><player> left before the particle change could be applied."
