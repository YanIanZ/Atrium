enabled: "<prefix><success>You are now vanished."
disabled: "<prefix><muted>You are visible again."
enabled-other: "<prefix><success><highlight><player></highlight> is now vanished."
disabled-other: "<prefix><muted><highlight><player></highlight> is visible again."
joined-vanished: "<prefix><muted>You joined vanished. Use <accent>/vanish</accent> to become visible."
pickup-enabled: "<prefix><success>You now pick up items while vanished."
pickup-disabled: "<prefix><muted>You no longer pick up items while vanished."
action-bar: "<muted>You are <highlight>vanished</highlight>"
# The fake join/quit lines imitate the vanilla messages, so they keep the vanilla yellow on purpose.
fake-quit: "<yellow><lang:multiplayer.player.left:'<player>'>"
fake-join: "<yellow><lang:multiplayer.player.joined:'<player>'>"
notify-vanished: "<prefix><muted><highlight><player></highlight> vanished."
notify-reappeared: "<prefix><muted><highlight><player></highlight> is visible again."
level-too-high: "<prefix><error>You cannot change the vanish state of <highlight><player></highlight>: their vanish level is above yours."
cancelled: "<prefix><error>The vanish change was cancelled by another plugin."
target-left: "<prefix><error><highlight><player></highlight> already had that state or disconnected."
failed: "<prefix><error>The action failed. The error was logged for the server staff."
save-failed: "<prefix><warning>The vanish state of <highlight><player></highlight> changed but could not be saved yet; saving will be retried."
silent-title: "<primary>Silent view <muted>(read-only)"
silent-title-modify: "<primary>Silent view"
silent-readonly: "<prefix><muted>Opened silently. This view is read-only."
silent-loot: "<prefix><error>This container has not generated its loot yet, so it cannot be opened silently."
silent-distant: "<prefix><error>You are too far from the container to edit it."
