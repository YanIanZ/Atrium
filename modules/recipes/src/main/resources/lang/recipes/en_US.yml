given-other: "<prefix><muted>Gave <highlight><amount>x <material></highlight> to <highlight><player></highlight> <dark_gray>(<id>)</dark_gray>."
given-dropped: "<prefix><warning>Your inventory was full; the remaining item(s) were dropped at your feet."
give-failed: "<prefix><error>That recipe result could not be created. The error was logged for the server staff."
give-target-left: "<prefix><error>The target player left before the item could be given."
enchant-unavailable: "<prefix><error>That enchantment is disabled on this server."
enchants-cleaned: "<prefix><warning>Some enchantments on your items are disabled here; they were removed or reduced."
