usage: "<prefix><muted>Usage: <primary>/customrecipe list</primary>, <primary>/customrecipe reload</primary>, <primary>/customrecipe give <id> [player]</primary>."
list-header: "<prefix><primary>Custom recipes (<highlight><count></highlight>):"
list-empty: "<prefix><muted>No custom recipes are loaded. Add YAML files to <highlight>plugins/Atrium/modules/recipes/</highlight>."
list-entry: "<prefix><highlight><id></highlight> <dark_gray>(<type>)</dark_gray> <muted>→ <highlight><material></highlight> x<amount>"
