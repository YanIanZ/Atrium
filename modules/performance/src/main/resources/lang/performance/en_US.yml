# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
lag-header: "<prefix><primary>Platform <highlight><platform></highlight> · uptime <highlight><uptime></highlight> · <highlight><players></highlight> online."
lag-server-metrics: "<prefix><muted><source> (1m): <highlight><regions></highlight> regions · worst TPS <highlight><worst_tps></highlight>, median <highlight><median_tps></highlight> · <highlight><avg_mspt></highlight> ms avg, p95 <highlight><p95_mspt></highlight>, max <highlight><max_mspt></highlight> · global TPS <highlight><global_tps></highlight> <dark_gray>(<freshness>)</dark_gray>"
lag-tps-global: "<prefix><muted>TPS <highlight><tps1></highlight> / <highlight><tps5></highlight> / <highlight><tps15></highlight> (1m/5m/15m) · <highlight><mspt></highlight> ms per tick."
lag-global-region: "<prefix><muted>Global region: TPS <highlight><tps1></highlight> / <highlight><tps5></highlight> / <highlight><tps15></highlight> · <highlight><mspt></highlight> ms per tick."
lag-region-self: "<prefix><muted>Your region: TPS <highlight><tps1></highlight> / <highlight><tps5></highlight> / <highlight><tps15></highlight> · <highlight><mspt></highlight> ms per tick."
lag-region-header: "<prefix><secondary>Regions with online players (<highlight><count></highlight>):"
lag-region-line: "<prefix><muted>· <highlight><region></highlight> (<world>) — TPS <highlight><tps1>/<tps5>/<tps15></highlight>, <highlight><mspt></highlight> ms, <highlight><players></highlight> player(s)."
lag-region-summary: "<prefix><muted>Player regions: <highlight><regions></highlight> sampled, min TPS <highlight><min></highlight>, average <highlight><avg></highlight>, max <highlight><max></highlight>."
lag-region-more: "<prefix><muted>… and <highlight><count></highlight> more region(s) not shown."
lag-no-regions: "<prefix><muted>No online player region is available to sample."
lag-memory: "<prefix><muted>Memory: <highlight><used></highlight>/<highlight><max></highlight> MB (<highlight><percent></highlight>%) · <highlight><free></highlight> MB free."
lag-world-header: "<prefix><secondary>Worlds:"
lag-world-line: "<prefix><muted>· <highlight><world></highlight> — <highlight><entities></highlight> entities, <highlight><chunks></highlight> loaded chunks, <highlight><players></highlight> players."
lag-worlds-empty: "<prefix><muted>No world counts are available."
lag-worlds-unsupported: "<prefix><muted>Entity and chunk counts are not sampled on Folia: they are owned by the regions, not by the global thread."
lag-entity: "<prefix><muted>Entity limiter: <highlight><denied></highlight> spawn(s) denied (<highlight><animals></highlight> animals, <highlight><monsters></highlight> monsters, <highlight><items></highlight> items, <highlight><minecarts></highlight> minecarts)."
lag-entity-disabled: "<prefix><muted>Entity limiter: disabled."
lag-timeout: "<prefix><warning>Some samples timed out; the values above are partial."
groundclean-usage: "<prefix><muted>Usage: <highlight>/groundclean [world] [-s] [-now]</highlight>. Use <highlight>-now</highlight> to skip the countdown, <highlight>-s</highlight> to suppress broadcasts (requires <highlight>atrium.groundclean.silent</highlight>), <highlight>/groundclean cancel</highlight> to stop, <highlight>/groundclean history [page]</highlight> for past runs. Drops of players with <highlight>atrium.groundclean.protect</highlight> are kept."
groundclean-started: "<prefix><success>Ground cleanup for <highlight><world></highlight> starts in <highlight><seconds></highlight>s. Removing items and XP orbs older than <highlight><age></highlight>s within <highlight><radius></highlight> chunks of each online player."
groundclean-started-now: "<prefix><success>Ground cleanup for <highlight><world></highlight> is running now. Removing items and XP orbs older than <highlight><age></highlight>s within <highlight><radius></highlight> chunks of each online player."
groundclean-warning: "<prefix><warning>Ground cleanup in <highlight><seconds></highlight> seconds. Move valuable drops off the ground."
groundclean-broadcast: "<prefix><muted>Ground cleanup finished: <highlight><items></highlight> item(s) and <highlight><orbs></highlight> XP orb(s) removed."
groundclean-done: "<prefix><success>Ground cleanup (<highlight><world></highlight>) finished in <highlight><seconds></highlight>s: <highlight><items></highlight> item(s) and <highlight><orbs></highlight> orb(s) removed, <highlight><whitelisted></highlight> whitelisted, <highlight><protected></highlight> protected, <highlight><young></highlight> too young, <highlight><chunks></highlight> chunk(s) scanned, <highlight><players></highlight> player(s)."
groundclean-partial: "<prefix><warning>Ground cleanup (<highlight><world></highlight>) timed out after <highlight><seconds></highlight>s: <highlight><items></highlight> item(s) and <highlight><orbs></highlight> orb(s) removed from <highlight><chunks></highlight> chunk(s); <highlight><whitelisted></highlight> whitelisted, <highlight><protected></highlight> protected, <highlight><young></highlight> too young."
groundclean-cancelled-summary: "<prefix><warning>Ground cleanup (<highlight><world></highlight>) cancelled after <highlight><seconds></highlight>s: <highlight><items></highlight> item(s) and <highlight><orbs></highlight> orb(s) removed from <highlight><chunks></highlight> chunk(s)."
groundclean-cancelling: "<prefix><warning>Cancelling the ground cleanup…"
groundclean-cancelled: "<prefix><warning>Ground cleanup for <highlight><world></highlight> cancelled."
groundclean-cancel-none: "<prefix><muted>No ground cleanup is pending or running."
