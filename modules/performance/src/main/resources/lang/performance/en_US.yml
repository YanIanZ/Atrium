groundclean-history-line: "<prefix><muted><time></muted> <dark_gray>·</dark_gray> <highlight><world></highlight> <dark_gray>·</dark_gray> <highlight><items></highlight> item(s), <highlight><orbs></highlight> orb(s), <highlight><whitelisted></highlight> whitelisted, <highlight><protected></highlight> protected <dark_gray>·</dark_gray> <highlight><seconds></highlight>s <dark_gray>·</dark_gray> <highlight><actor></highlight> (<trigger>)"
groundclean-history-empty: "<prefix><muted>No ground cleanup runs recorded on page <highlight><page></highlight>."
groundclean-history-next: "<prefix><muted>Use <highlight>/groundclean history <next></highlight> for older runs."
