# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
lag-header: "<prefix><primary>Platform <highlight><platform></highlight> · aktif <highlight><uptime></highlight> · <highlight><players></highlight> pemain online."
lag-server-metrics: "<prefix><muted><source> (1m): <highlight><regions></highlight> region · TPS terburuk <highlight><worst_tps></highlight>, median <highlight><median_tps></highlight> · rata-rata <highlight><avg_mspt></highlight> ms, p95 <highlight><p95_mspt></highlight>, maks <highlight><max_mspt></highlight> · TPS global <highlight><global_tps></highlight> <dark_gray>(<freshness>)</dark_gray>"
lag-tps-global: "<prefix><muted>TPS <highlight><tps1></highlight> / <highlight><tps5></highlight> / <highlight><tps15></highlight> (1m/5m/15m) · <highlight><mspt></highlight> ms per tick."
lag-global-region: "<prefix><muted>Region global: TPS <highlight><tps1></highlight> / <highlight><tps5></highlight> / <highlight><tps15></highlight> · <highlight><mspt></highlight> ms per tick."
lag-region-self: "<prefix><muted>Regionmu: TPS <highlight><tps1></highlight> / <highlight><tps5></highlight> / <highlight><tps15></highlight> · <highlight><mspt></highlight> ms per tick."
lag-region-header: "<prefix><secondary>Region dengan pemain online (<highlight><count></highlight>):"
lag-region-line: "<prefix><muted>· <highlight><region></highlight> (<world>) — TPS <highlight><tps1>/<tps5>/<tps15></highlight>, <highlight><mspt></highlight> ms, <highlight><players></highlight> pemain."
lag-region-summary: "<prefix><muted>Region pemain: <highlight><regions></highlight> sampel, TPS minimum <highlight><min></highlight>, rata-rata <highlight><avg></highlight>, maksimum <highlight><max></highlight>."
lag-region-more: "<prefix><muted>… dan <highlight><count></highlight> region lain tidak ditampilkan."
lag-no-regions: "<prefix><muted>Tidak ada region pemain online untuk disampel."
lag-memory: "<prefix><muted>Memori: <highlight><used></highlight>/<highlight><max></highlight> MB (<highlight><percent></highlight>%) · <highlight><free></highlight> MB bebas."
lag-world-header: "<prefix><secondary>Dunia:"
lag-world-line: "<prefix><muted>· <highlight><world></highlight> — <highlight><entities></highlight> entitas, <highlight><chunks></highlight> chunk termuat, <highlight><players></highlight> pemain."
lag-worlds-empty: "<prefix><muted>Tidak ada hitungan dunia yang tersedia."
lag-worlds-unsupported: "<prefix><muted>Hitungan entitas dan chunk tidak diambil di Folia: data itu milik region, bukan thread global."
lag-entity: "<prefix><muted>Batas entitas: <highlight><denied></highlight> spawn ditolak (<highlight><animals></highlight> hewan, <highlight><monsters></highlight> monster, <highlight><items></highlight> item, <highlight><minecarts></highlight> minecart)."
lag-entity-disabled: "<prefix><muted>Batas entitas: nonaktif."
lag-timeout: "<prefix><warning>Sebagian sampel habis waktu; nilai di atas hanya sebagian."
groundclean-usage: "<prefix><muted>Penggunaan: <highlight>/groundclean [dunia] [-s] [-now]</highlight>. Pakai <highlight>-now</highlight> untuk melewati hitung mundur, <highlight>-s</highlight> untuk menahan siaran (butuh <highlight>atrium.groundclean.silent</highlight>), <highlight>/groundclean cancel</highlight> untuk berhenti, <highlight>/groundclean history [halaman]</highlight> untuk riwayat. Drop milik pemain dengan <highlight>atrium.groundclean.protect</highlight> dipertahankan."
groundclean-started: "<prefix><success>Pembersihan tanah untuk <highlight><world></highlight> dimulai dalam <highlight><seconds></highlight> detik. Menghapus item dan orb XP yang lebih tua dari <highlight><age></highlight> detik dalam <highlight><radius></highlight> chunk di sekitar setiap pemain online."
groundclean-started-now: "<prefix><success>Pembersihan tanah untuk <highlight><world></highlight> berjalan sekarang. Menghapus item dan orb XP yang lebih tua dari <highlight><age></highlight> detik dalam <highlight><radius></highlight> chunk di sekitar setiap pemain online."
groundclean-warning: "<prefix><warning>Pembersihan tanah dalam <highlight><seconds></highlight> detik. Pindahkan drop berharga dari tanah."
groundclean-broadcast: "<prefix><muted>Pembersihan tanah selesai: <highlight><items></highlight> item dan <highlight><orbs></highlight> orb XP dihapus."
groundclean-done: "<prefix><success>Pembersihan tanah (<highlight><world></highlight>) selesai dalam <highlight><seconds></highlight> detik: <highlight><items></highlight> item dan <highlight><orbs></highlight> orb dihapus, <highlight><whitelisted></highlight> di-whitelist, <highlight><protected></highlight> dilindungi, <highlight><young></highlight> terlalu baru, <highlight><chunks></highlight> chunk dipindai, <highlight><players></highlight> pemain."
groundclean-partial: "<prefix><warning>Pembersihan tanah (<highlight><world></highlight>) habis waktu setelah <highlight><seconds></highlight> detik: <highlight><items></highlight> item dan <highlight><orbs></highlight> orb dihapus dari <highlight><chunks></highlight> chunk; <highlight><whitelisted></highlight> di-whitelist, <highlight><protected></highlight> dilindungi, <highlight><young></highlight> terlalu baru."
groundclean-cancelled-summary: "<prefix><warning>Pembersihan tanah (<highlight><world></highlight>) dibatalkan setelah <highlight><seconds></highlight> detik: <highlight><items></highlight> item dan <highlight><orbs></highlight> orb dihapus dari <highlight><chunks></highlight> chunk."
groundclean-cancelling: "<prefix><warning>Membatalkan pembersihan tanah…"
groundclean-cancelled: "<prefix><warning>Pembersihan tanah untuk <highlight><world></highlight> dibatalkan."
groundclean-cancel-none: "<prefix><muted>Tidak ada pembersihan tanah yang tertunda atau berjalan."
groundclean-busy: "<prefix><error>Pembersihan tanah sudah tertunda atau berjalan. Pakai <highlight>/groundclean cancel</highlight> dulu."
groundclean-unknown-world: "<prefix><error>Dunia <highlight><world></highlight> tidak dikenal."
groundclean-no-players: "<prefix><warning>Tidak ada pemain online, jadi tidak ada yang perlu dibersihkan."
groundclean-silent-denied: "<prefix><error>Kamu butuh <highlight>atrium.groundclean.silent</highlight> untuk menahan siaran."
groundclean-capped: "<prefix><warning>Hanya <highlight><max></highlight> pemain pertama yang diperiksa (max-players-per-run)."
groundclean-protection-failed: "<prefix><error>Pembersihan tanah dibatalkan sebelum menghapus apa pun: zona perlindungan tidak dapat dibaca tepat waktu."
groundclean-history-header: "<prefix><primary>Riwayat pembersihan tanah — halaman <highlight><page></highlight> (<highlight><count></highlight> kali):"
groundclean-history-line: "<prefix><muted><time></muted> <dark_gray>·</dark_gray> <highlight><world></highlight> <dark_gray>·</dark_gray> <highlight><items></highlight> item, <highlight><orbs></highlight> orb, <highlight><whitelisted></highlight> di-whitelist, <highlight><protected></highlight> dilindungi <dark_gray>·</dark_gray> <highlight><seconds></highlight> detik <dark_gray>·</dark_gray> <highlight><actor></highlight> (<trigger>)"
groundclean-history-empty: "<prefix><muted>Tidak ada pembersihan tanah tercatat di halaman <highlight><page></highlight>."
groundclean-history-next: "<prefix><muted>Pakai <highlight>/groundclean history <next></highlight> untuk riwayat lama."
groundclean-history-failed: "<prefix><error>Tidak dapat membaca riwayat pembersihan tanah. Periksa log server."
