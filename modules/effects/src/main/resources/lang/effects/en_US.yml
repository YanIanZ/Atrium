# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
no-permission: "<prefix><error>You need <highlight><permission></highlight> to use this."
list-header: "<muted><strikethrough>        </strikethrough> <primary><bold>Event effects</bold></primary> <muted>(<highlight><count></highlight>) <strikethrough>        </strikethrough>"
list-empty: "<prefix><muted>No event effects are configured. Add entries under 'events' in modules/effects.yml."
list-entry: " <success>●</success> <highlight><event></highlight> <muted>- <detail>"
list-entry-disabled: " <muted>○ <event> <dark_gray>(disabled) <muted>- <detail>"
unknown-event: "<prefix><error>No effect is configured for <highlight><event></highlight>. Available: <highlight><events></highlight>."
preview: "<prefix><success>Previewing <highlight><event></highlight> for <highlight><player></highlight>."
reloaded: "<prefix><success>Reloaded <highlight><events></highlight> event effects and <highlight><fixed></highlight> fixed effects. Warnings: <highlight><warnings></highlight> (see the console)."
reload-failed: "<prefix><error>Reload failed. The previous effects stay active; see the console."
save-failed: "<prefix><error>Saving the fixed effect failed. See the console."
usage:
  test: "<prefix><muted>Usage: <highlight>/effects test \\<event> [player]"
  fixed: "<prefix><muted>Usage: <highlight>/effects fixed create|delete|list|move|tp|edit"
  create: "<prefix><muted>Usage: <highlight>/effects fixed create \\<name> \\<shape> \\<particle> [radius] [colour]"
  delete: "<prefix><muted>Usage: <highlight>/effects fixed delete \\<name>"
  move: "<prefix><muted>Usage: <highlight>/effects fixed move \\<name></highlight> <muted>(moves the effect to you)"
  tp: "<prefix><muted>Usage: <highlight>/effects fixed tp \\<name>"
  edit: "<prefix><muted>Usage: <highlight>/effects fixed edit \\<name> \\<property> \\<value>"
fixed-invalid-name: "<prefix><error><input> is not a valid name. Use 1-32 letters, digits, '_' or '-'."
fixed-exists: "<prefix><error>A fixed effect named <highlight><name></highlight> already exists. Delete it first."
fixed-unknown: "<prefix><error>No fixed effect named <highlight><name></highlight>."
fixed-limit: "<prefix><error>The server already has the maximum of <highlight><max></highlight> fixed effects. Delete one first."
fixed-created: "<prefix><success>Created fixed effect <highlight><name></highlight> (<detail>)."
fixed-deleted: "<prefix><success>Deleted fixed effect <highlight><name></highlight>."
fixed-moved: "<prefix><success>Moved fixed effect <highlight><name></highlight> to your position."
fixed-teleported: "<prefix><success>Teleported to fixed effect <highlight><name></highlight>."
fixed-teleport-failed: "<prefix><error>The teleport was cancelled."
fixed-edited: "<prefix><success>Changed <highlight><property></highlight> of <highlight><name></highlight> to <highlight><value></highlight>."
fixed-list-header: "<muted><strikethrough>        </strikethrough> <primary><bold>Fixed effects</bold></primary> <muted>(<highlight><count></highlight>) <strikethrough>        </strikethrough>"
fixed-list-empty: "<prefix><muted>There are no fixed effects yet. Create one with <highlight>/effects fixed create</highlight>."
fixed-list-entry: " <success>●</success> <highlight><name></highlight> <muted>(<detail>) <dark_gray>at <world> <x> <y> <z>"
fixed-list-hover: "<accent>Click to teleport to <highlight><name></highlight>."
invalid-shape: "<prefix><error>Unknown shape <highlight><input></highlight>. Use: <highlight><shapes></highlight>."
invalid-particle: "<prefix><error>Unknown particle <highlight><input></highlight>. Use tab completion to see supported particles."
particle-unsupported: "<prefix><error>Particle <highlight><particle></highlight> needs <highlight><data></highlight> data, which this module does not support."
particle-needs-colour: "<prefix><error>Particle <highlight><particle></highlight> needs a colour, for example <highlight>#ff8800</highlight>."
particle-data-required: "<prefix><error>Particle <highlight><particle></highlight> cannot be used: <reason>."
invalid-colour: "<prefix><error><input> is not a valid colour. Use <highlight>#RRGGBB</highlight>."
invalid-property: "<prefix><error>Unknown property <highlight><input></highlight>. Use: <highlight><properties></highlight>."
invalid-range: "<prefix><error><input> is out of range (<min>-<max>)."
world-missing: "<prefix><error>The world of <highlight><name></highlight> is not loaded."
