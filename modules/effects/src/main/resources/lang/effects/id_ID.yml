# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
no-permission: "<prefix><error>Kamu butuh <highlight><permission></highlight> untuk memakai ini."
list-header: "<muted><strikethrough>        </strikethrough> <primary><bold>Efek event</bold></primary> <muted>(<highlight><count></highlight>) <strikethrough>        </strikethrough>"
list-empty: "<prefix><muted>Belum ada efek event yang diatur. Tambahkan entri di bagian 'events' pada modules/effects.yml."
list-entry: " <success>●</success> <highlight><event></highlight> <muted>- <detail>"
list-entry-disabled: " <muted>○ <event> <dark_gray>(nonaktif) <muted>- <detail>"
unknown-event: "<prefix><error>Tidak ada efek untuk <highlight><event></highlight>. Yang tersedia: <highlight><events></highlight>."
preview: "<prefix><success>Menampilkan pratinjau <highlight><event></highlight> untuk <highlight><player></highlight>."
reloaded: "<prefix><success>Memuat ulang <highlight><events></highlight> efek event dan <highlight><fixed></highlight> efek tetap. Peringatan: <highlight><warnings></highlight> (lihat konsol)."
reload-failed: "<prefix><error>Gagal memuat ulang. Efek sebelumnya tetap aktif; lihat konsol."
save-failed: "<prefix><error>Gagal menyimpan efek tetap. Lihat konsol."
usage:
  test: "<prefix><muted>Penggunaan: <highlight>/effects test \\<event> [player]"
  fixed: "<prefix><muted>Penggunaan: <highlight>/effects fixed create|delete|list|move|tp|edit"
  create: "<prefix><muted>Penggunaan: <highlight>/effects fixed create \\<name> \\<shape> \\<particle> [radius] [colour]"
  delete: "<prefix><muted>Penggunaan: <highlight>/effects fixed delete \\<name>"
  move: "<prefix><muted>Penggunaan: <highlight>/effects fixed move \\<name></highlight> <muted>(memindahkan efek ke posisimu)"
  tp: "<prefix><muted>Penggunaan: <highlight>/effects fixed tp \\<name>"
  edit: "<prefix><muted>Penggunaan: <highlight>/effects fixed edit \\<name> \\<property> \\<value>"
fixed-invalid-name: "<prefix><error><input> bukan nama yang valid. Pakai 1-32 huruf, angka, '_' atau '-'."
fixed-exists: "<prefix><error>Efek tetap bernama <highlight><name></highlight> sudah ada. Hapus dulu."
fixed-unknown: "<prefix><error>Tidak ada efek tetap bernama <highlight><name></highlight>."
fixed-limit: "<prefix><error>Server sudah mencapai batas <highlight><max></highlight> efek tetap. Hapus satu dulu."
fixed-created: "<prefix><success>Efek tetap <highlight><name></highlight> dibuat (<detail>)."
fixed-deleted: "<prefix><success>Efek tetap <highlight><name></highlight> dihapus."
fixed-moved: "<prefix><success>Efek tetap <highlight><name></highlight> dipindahkan ke posisimu."
fixed-teleported: "<prefix><success>Kamu teleport ke efek tetap <highlight><name></highlight>."
fixed-teleport-failed: "<prefix><error>Teleport dibatalkan."
fixed-edited: "<prefix><success><highlight><property></highlight> dari <highlight><name></highlight> diubah menjadi <highlight><value></highlight>."
fixed-list-header: "<muted><strikethrough>        </strikethrough> <primary><bold>Efek tetap</bold></primary> <muted>(<highlight><count></highlight>) <strikethrough>        </strikethrough>"
fixed-list-empty: "<prefix><muted>Belum ada efek tetap. Buat dengan <highlight>/effects fixed create</highlight>."
fixed-list-entry: " <success>●</success> <highlight><name></highlight> <muted>(<detail>) <dark_gray>di <world> <x> <y> <z>"
fixed-list-hover: "<accent>Klik untuk teleport ke <highlight><name></highlight>."
invalid-shape: "<prefix><error>Bentuk <highlight><input></highlight> tidak dikenal. Pakai: <highlight><shapes></highlight>."
invalid-particle: "<prefix><error>Partikel <highlight><input></highlight> tidak dikenal. Pakai tab completion untuk melihat partikel yang didukung."
particle-unsupported: "<prefix><error>Partikel <highlight><particle></highlight> butuh data <highlight><data></highlight>, yang tidak didukung modul ini."
particle-needs-colour: "<prefix><error>Partikel <highlight><particle></highlight> butuh warna, misalnya <highlight>#ff8800</highlight>."
particle-data-required: "<prefix><error>Partikel <highlight><particle></highlight> tidak bisa dipakai: <reason>."
invalid-colour: "<prefix><error><input> bukan warna yang valid. Pakai <highlight>#RRGGBB</highlight>."
invalid-property: "<prefix><error>Properti <highlight><input></highlight> tidak dikenal. Pakai: <highlight><properties></highlight>."
invalid-range: "<prefix><error><input> di luar jangkauan (<min>-<max>)."
world-missing: "<prefix><error>Dunia untuk <highlight><name></highlight> belum dimuat."
