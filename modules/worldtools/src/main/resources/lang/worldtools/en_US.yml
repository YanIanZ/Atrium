replace-usage: "<prefix><muted>Usage: <primary>/replaceblock <from> <to> [radius]</primary> (radius at most <highlight><max></highlight>). Chances need quotes: <primary>/replaceblock stone \"diamond_ore%5+gold_ore%10\" 16</primary>. Stop with <primary>/replaceblock cancel</primary>."
unknown-block: "<prefix><error>Unknown block <highlight><block></highlight>."
bad-replacement: "<prefix><error>Cannot read <highlight><spec></highlight>. Use <highlight>block[%chance]</highlight> entries joined with + (chance 0-100)."
radius-too-large: "<prefix><error>The radius may be at most <highlight><max></highlight> blocks."
replace-running: "<prefix><error>You already have a replace job running. Use <primary>/replaceblock cancel</primary> first."
replace-busy: "<prefix><error>Too many replace jobs are running on the server. Try again later."
replace-started: "<prefix><success>Replacing <highlight><from></highlight> with <highlight><to></highlight> within <highlight><radius></highlight> blocks (<highlight><chunks></highlight> chunks). Ungenerated chunks are skipped."
