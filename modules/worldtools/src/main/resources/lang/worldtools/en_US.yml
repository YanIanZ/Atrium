replace-none: "<prefix><muted>You have no replace job running."
replace-cancelled-all: "<prefix><warning>Cancelling <highlight><count></highlight> replace job(s)."
biome-usage: "<prefix><muted>Usage: <primary>/findbiome <biome> [radius]</primary>."
biome-searching: "<prefix><muted>Searching for <highlight><biome></highlight> within <highlight><radius></highlight> blocks…"
biome-found: "<prefix><success>Nearest <highlight><biome></highlight>: <highlight><loc_x> <loc_y> <loc_z></highlight> in <highlight><loc_world></highlight> (<highlight><distance></highlight> blocks away)."
biome-not-found: "<prefix><warning>No <highlight><biome></highlight> within <highlight><radius></highlight> blocks."
biome-busy: "<prefix><error>Your previous biome search is still running."
