replace-done: "<muted>Replace job finished in <highlight><seconds></highlight>s: <highlight><replaced></highlight> blocks replaced in <highlight><done></highlight> chunks (<highlight><skipped></highlight> skipped, <highlight><protected></highlight> protected)."
replace-cancelling: "<prefix><warning>Cancelling your replace job…"
