biome-not-found: "<prefix><warning>No <highlight><biome></highlight> within <highlight><radius></highlight> blocks."
biome-busy: "<prefix><error>Your previous biome search is still running."
biome-unsupported: "<prefix><error>Biome search is not supported on this server."
biome-failed: "<prefix><error>The biome search failed. Check the console for details."
