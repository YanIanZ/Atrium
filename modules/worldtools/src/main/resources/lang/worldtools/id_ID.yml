replace-usage: "<prefix><muted>Pemakaian: <primary>/replaceblock <dari> <ke> [radius]</primary> (radius maksimal <highlight><max></highlight>). Peluang perlu tanda kutip: <primary>/replaceblock stone \"diamond_ore%5+gold_ore%10\" 16</primary>. Hentikan dengan <primary>/replaceblock cancel</primary>."
unknown-block: "<prefix><error>Blok <highlight><block></highlight> tidak dikenal."
