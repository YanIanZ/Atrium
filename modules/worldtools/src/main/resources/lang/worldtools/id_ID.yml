replace-usage: "<prefix><muted>Pemakaian: <primary>/replaceblock <dari> <ke> [radius]</primary> (radius maksimal <highlight><max></highlight>). Peluang perlu tanda kutip: <primary>/replaceblock stone \"diamond_ore%5+gold_ore%10\" 16</primary>. Hentikan dengan <primary>/replaceblock cancel</primary>."
unknown-block: "<prefix><error>Blok <highlight><block></highlight> tidak dikenal."
bad-replacement: "<prefix><error>Tidak bisa membaca <highlight><spec></highlight>. Pakai entri <highlight>blok[%peluang]</highlight> yang digabung dengan + (peluang 0-100)."
radius-too-large: "<prefix><error>Radius maksimal <highlight><max></highlight> blok."
replace-running: "<prefix><error>Kamu masih punya tugas penggantian yang berjalan. Pakai <primary>/replaceblock cancel</primary> dulu."
replace-busy: "<prefix><error>Terlalu banyak tugas penggantian di server. Coba lagi nanti."
replace-started: "<prefix><success>Mengganti <highlight><from></highlight> dengan <highlight><to></highlight> dalam <highlight><radius></highlight> blok (<highlight><chunks></highlight> chunk). Chunk yang belum dibuat dilewati."
replace-progress: "<muted>Pekerjaan replace: <highlight><done></highlight>/<highlight><total></highlight> chunk (<highlight><percent></highlight>%), <highlight><replaced></highlight> blok diganti, <highlight><protected></highlight> dilindungi, kecepatan <highlight><speed></highlight>."
replace-done: "<muted>Pekerjaan replace selesai dalam <highlight><seconds></highlight>s: <highlight><replaced></highlight> blok diganti di <highlight><done></highlight> chunk (<highlight><skipped></highlight> dilewati, <highlight><protected></highlight> dilindungi)."
replace-cancelling: "<prefix><warning>Membatalkan tugas penggantianmu…"
replace-cancelled: "<muted>Pekerjaan replace dibatalkan setelah <highlight><seconds></highlight>s: <highlight><replaced></highlight> blok diganti di <highlight><done></highlight>/<highlight><total></highlight> chunk (<highlight><protected></highlight> dilindungi)."
replace-none: "<prefix><muted>Kamu tidak punya tugas penggantian yang berjalan."
replace-cancelled-all: "<prefix><warning>Membatalkan <highlight><count></highlight> tugas penggantian."
biome-usage: "<prefix><muted>Cara pakai: <primary>/findbiome <biome> [radius]</primary>."
biome-searching: "<prefix><muted>Mencari <highlight><biome></highlight> dalam <highlight><radius></highlight> blok…"
biome-found: "<prefix><success><highlight><biome></highlight> terdekat: <highlight><loc_x> <loc_y> <loc_z></highlight> di <highlight><loc_world></highlight> (<highlight><distance></highlight> blok)."
biome-not-found: "<prefix><warning>Tidak ada <highlight><biome></highlight> dalam <highlight><radius></highlight> blok."
biome-busy: "<prefix><error>Pencarian biome sebelumnya masih berjalan."
biome-unsupported: "<prefix><error>Pencarian biome tidak didukung di server ini."
biome-failed: "<prefix><error>Pencarian biome gagal. Lihat konsol untuk detailnya."
