# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage-wtp: "<prefix><muted>Penggunaan: <highlight>/wtp (dunia) [pemain]</highlight> atau <highlight>/wtp profile [pemain]</highlight>."
usage-worldinfo: "<prefix><muted>Penggunaan: <highlight>/worldinfo (dunia)</highlight>."
invalid-name: "<prefix><error>Nama dunia <highlight><world></highlight> tidak valid: gunakan huruf, angka dan _ - . + saja."
unknown: "<prefix><error>Dunia <highlight><world></highlight> tidak dikenal."
no-permission-world: "<prefix><error>Kamu tidak boleh teleport ke <highlight><world></highlight> <muted>(<permission>)</muted>."
no-access: "<prefix><error><highlight><player></highlight> tidak punya akses ke <highlight><world></highlight> <muted>(<provider>)</muted>."
loading: "<prefix><muted>Memuat dunia <highlight><world></highlight> <muted>(<provider>)</muted>..."
already-loaded: "<prefix><muted>Dunia <highlight><world></highlight> sudah dimuat."
loaded: "<prefix><success>Dunia <highlight><world></highlight> dimuat <muted>(<provider>)</muted>."
load-not-allowed: "<prefix><error>Dunia <highlight><world></highlight> belum dimuat dan tidak boleh dimuat sesuai permintaan."
load-busy: "<prefix><warning>Dunia <highlight><world></highlight> sedang sibuk (dibuat, dilepas atau disalin). Coba lagi sebentar."
load-timeout: "<prefix><error>Dunia <highlight><world></highlight> tidak selesai dimuat tepat waktu."
load-failed: "<prefix><error>Dunia <highlight><world></highlight> gagal dimuat: <muted><detail></muted>"
teleported: "<prefix><success>Teleport ke <highlight><world></highlight>."
teleported-other: "<prefix><success><highlight><player></highlight> diteleport ke <highlight><world></highlight>."
teleport-failed: "<prefix><error>Teleport <highlight><player></highlight> ke <highlight><world></highlight> gagal <muted>(<reason>)</muted>."
profile-unavailable: "<prefix><error>Profil tidak aktif di server ini."
profile-no-awf: "<prefix><error>Aurora World Fabric tidak tersedia, jadi dunia profil tidak bisa dimuat."
profile-none: "<prefix><error><highlight><player></highlight> tidak punya profil aktif."
profile-no-primary: "<prefix><error>Profil <highlight><profile></highlight> milik <highlight><player></highlight> tidak punya dunia utama."
profile-failed: "<prefix><error>Dunia profil <highlight><player></highlight> tidak bisa dibaca."
state-loaded: "<success>dimuat"
state-unloaded: "<muted>tidak dimuat"
list-header: "<prefix><primary>Dunia <muted>(<highlight><count></highlight>, halaman <highlight><page></highlight>/<highlight><pages></highlight>)"
list-empty: "<prefix><muted>Tidak ada dunia untuk ditampilkan."
list-entry: " <dark_gray>-</dark_gray> <highlight><world></highlight> <muted>[<provider>]</muted> <state> <muted>pemain: <highlight><players></highlight>"
list-entry-alias: " <dark_gray>-</dark_gray> <highlight><world></highlight> <muted>(<alias>) [<provider>]</muted> <state> <muted>pemain: <highlight><players></highlight>"
list-hover: "<muted>Klik untuk teleport ke <highlight><world></highlight>"
list-next: "<prefix><muted>Halaman berikutnya: <highlight>/worlds <page></highlight> <muted>(klik)"
unload-not-loaded: "<prefix><error>Dunia <highlight><world></highlight> tidak dimuat."
unload-main: "<prefix><error>Dunia utama <highlight><world></highlight> tidak bisa dilepas."
unload-unsupported: "<prefix><error>Dunia <highlight><world></highlight> <muted>(<provider>)</muted> tidak bisa dilepas di sini; hanya dunia Multiverse dan slime."
unload-players: "<prefix><error>Dunia <highlight><world></highlight> masih berisi <highlight><players></highlight> pemain."
unload-confirm: "<prefix><warning>Lepas <highlight><world></highlight> <muted>(<provider>)</muted>? Klik di sini atau jalankan <highlight>/worlds unload <world> confirm</highlight> dalam <highlight><seconds></highlight> detik."
unload-no-pending: "<prefix><error>Tidak ada yang perlu dikonfirmasi untuk <highlight><world></highlight>: jalankan <highlight>/worlds unload <world></highlight> dulu."
unloading: "<prefix><muted>Melepas <highlight><world></highlight>..."
unloaded: "<prefix><success>Dunia <highlight><world></highlight> dilepas."
unload-failed: "<prefix><error>Dunia <highlight><world></highlight> gagal dilepas: <muted><detail></muted>"
info-header: "<prefix><primary>Dunia <highlight><world></highlight>"
info-provider: " <muted>Penyedia: <highlight><provider>"
info-alias: " <muted>Alias: <highlight><alias>"
info-loaded: " <muted>Status: <state>"
info-spawn: " <muted>Spawn: <highlight><at_x> <at_y> <at_z>"
info-environment: " <muted>Lingkungan: <highlight><environment>"
info-players: " <muted>Pemain: <highlight><players>"
