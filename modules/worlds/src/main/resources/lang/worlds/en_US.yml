# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage-wtp: "<prefix><muted>Usage: <highlight>/wtp (world) [player]</highlight> or <highlight>/wtp profile [player]</highlight>."
usage-worldinfo: "<prefix><muted>Usage: <highlight>/worldinfo (world)</highlight>."
invalid-name: "<prefix><error>Invalid world name <highlight><world></highlight>: use letters, digits and _ - . + only."
unknown: "<prefix><error>Unknown world <highlight><world></highlight>."
no-permission-world: "<prefix><error>You may not teleport to <highlight><world></highlight> <muted>(<permission>)</muted>."
no-access: "<prefix><error><highlight><player></highlight> has no access to <highlight><world></highlight> <muted>(<provider>)</muted>."
loading: "<prefix><muted>Loading world <highlight><world></highlight> <muted>(<provider>)</muted>..."
already-loaded: "<prefix><muted>World <highlight><world></highlight> is already loaded."
loaded: "<prefix><success>World <highlight><world></highlight> loaded <muted>(<provider>)</muted>."
load-not-allowed: "<prefix><error>World <highlight><world></highlight> is not loaded and may not be loaded on demand."
load-busy: "<prefix><warning>World <highlight><world></highlight> is busy (being created, unloaded or copied). Try again soon."
load-timeout: "<prefix><error>World <highlight><world></highlight> did not finish loading in time."
load-failed: "<prefix><error>World <highlight><world></highlight> could not be loaded: <muted><detail></muted>"
teleported: "<prefix><success>Teleported to <highlight><world></highlight>."
teleported-other: "<prefix><success>Teleported <highlight><player></highlight> to <highlight><world></highlight>."
teleport-failed: "<prefix><error>Teleport of <highlight><player></highlight> to <highlight><world></highlight> failed <muted>(<reason>)</muted>."
profile-unavailable: "<prefix><error>Profiles are not active on this server."
profile-no-awf: "<prefix><error>Aurora World Fabric is not available, so profile worlds cannot be loaded."
profile-none: "<prefix><error><highlight><player></highlight> has no active profile."
profile-no-primary: "<prefix><error>Profile <highlight><profile></highlight> of <highlight><player></highlight> has no primary world."
profile-failed: "<prefix><error>The profile worlds of <highlight><player></highlight> could not be read."
state-loaded: "<success>loaded"
state-unloaded: "<muted>not loaded"
list-header: "<prefix><primary>Worlds <muted>(<highlight><count></highlight>, page <highlight><page></highlight>/<highlight><pages></highlight>)"
list-empty: "<prefix><muted>No worlds to show."
list-entry: " <dark_gray>-</dark_gray> <highlight><world></highlight> <muted>[<provider>]</muted> <state> <muted>players: <highlight><players></highlight>"
list-entry-alias: " <dark_gray>-</dark_gray> <highlight><world></highlight> <muted>(<alias>) [<provider>]</muted> <state> <muted>players: <highlight><players></highlight>"
list-hover: "<muted>Click to teleport to <highlight><world></highlight>"
list-next: "<prefix><muted>Next page: <highlight>/worlds <page></highlight> <muted>(click)"
unload-not-loaded: "<prefix><error>World <highlight><world></highlight> is not loaded."
unload-main: "<prefix><error>The main world <highlight><world></highlight> cannot be unloaded."
unload-unsupported: "<prefix><error>World <highlight><world></highlight> <muted>(<provider>)</muted> cannot be unloaded here; only Multiverse and slime worlds can."
unload-players: "<prefix><error>World <highlight><world></highlight> still has <highlight><players></highlight> player(s) in it."
unload-confirm: "<prefix><warning>Unload <highlight><world></highlight> <muted>(<provider>)</muted>? Click here or run <highlight>/worlds unload <world> confirm</highlight> within <highlight><seconds></highlight> s."
unload-no-pending: "<prefix><error>Nothing to confirm for <highlight><world></highlight>: run <highlight>/worlds unload <world></highlight> first."
unloading: "<prefix><muted>Unloading <highlight><world></highlight>..."
unloaded: "<prefix><success>World <highlight><world></highlight> unloaded."
unload-failed: "<prefix><error>World <highlight><world></highlight> could not be unloaded: <muted><detail></muted>"
info-header: "<prefix><primary>World <highlight><world></highlight>"
info-provider: " <muted>Provider: <highlight><provider>"
info-alias: " <muted>Alias: <highlight><alias>"
info-loaded: " <muted>State: <state>"
info-spawn: " <muted>Spawn: <highlight><at_x> <at_y> <at_z>"
info-environment: " <muted>Environment: <highlight><environment>"
info-players: " <muted>Players: <highlight><players>"
