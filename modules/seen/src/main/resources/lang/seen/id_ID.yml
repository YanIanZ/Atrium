# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage-seen: "<prefix><muted>Penggunaan: <highlight>/seen (pemain)</highlight>."
usage-whois: "<prefix><muted>Penggunaan: <highlight>/whois (pemain)</highlight>."
header: "<prefix><primary>Pemain <highlight><player></highlight>"
online: " <muted>Status: <success>online</success> selama <highlight><duration></highlight>"
