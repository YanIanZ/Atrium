offline: " <muted>Status: <error>offline</error>, terakhir terlihat <highlight><ago></highlight> lalu (<highlight><date></highlight>)"
vanished: " <muted>Menghilang (vanish): <highlight>ya"
first-join: " <muted>Pertama masuk: <highlight><date></highlight> (<highlight><ago></highlight> lalu)"
