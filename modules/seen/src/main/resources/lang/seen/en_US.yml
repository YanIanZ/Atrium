# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage-seen: "<prefix><muted>Usage: <highlight>/seen (player)</highlight>."
usage-whois: "<prefix><muted>Usage: <highlight>/whois (player)</highlight>."
header: "<prefix><primary>Player <highlight><player></highlight>"
online: " <muted>Status: <success>online</success> for <highlight><duration></highlight>"
online-unknown: " <muted>Status: <success>online"
offline: " <muted>Status: <error>offline</error>, last seen <highlight><ago></highlight> ago (<highlight><date></highlight>)"
vanished: " <muted>Vanished: <highlight>yes"
first-join: " <muted>First join: <highlight><date></highlight> (<highlight><ago></highlight> ago)"
location: " <muted>Location: <highlight><world></highlight> <highlight><x></highlight>, <highlight><y></highlight>, <highlight><z></highlight>"
location-logout: " <muted>Logout location: <highlight><world></highlight> <highlight><x></highlight>, <highlight><y></highlight>, <highlight><z></highlight>"
location-unknown: " <muted>Location: <dark_gray>unknown"
ip: " <muted>Last address: <highlight><ip></highlight>"
ip-unknown: " <muted>Last address: <dark_gray>unknown"
alts: " <muted>Other accounts on this address (<highlight><count></highlight>): <highlight><alts></highlight>"
alts-none: " <muted>Other accounts on this address: <dark_gray>none"
punishments: " <muted>Active punishments (<highlight><count></highlight>):"
punishments-none: " <muted>Active punishments: <success>none"
punishment: "  <dark_gray>-</dark_gray> <error><type></error> <muted>by <highlight><actor></highlight>: <highlight><reason></highlight> <dark_gray>(<remaining>)"
permanent: "permanent"
remaining: "<time> left"
flag-yes: "<success>yes"
flag-no: "<error>no"
whois-header: "<prefix><primary>Whois <highlight><player></highlight>"
whois-uuid: " <muted>UUID: <highlight><uuid>"
whois-health: " <muted>Health: <highlight><health>/<max></highlight>, food: <highlight><food></highlight>, saturation: <highlight><saturation></highlight>"
whois-state: " <muted>Gamemode: <highlight><gamemode></highlight>, flying: <flying><muted>, flight allowed: <allow_flight><muted>, op: <op><muted>, vanished: <vanished>"
whois-level: " <muted>Experience level: <highlight><level>"
whois-client: " <muted>Locale: <highlight><locale></highlight>, ping: <highlight><ping> ms</highlight>, client: <highlight><brand>"
whois-playtime: " <muted>Playtime: <highlight><time>"
whois-rank: " <muted>Rank: <highlight><rank>"
whois-left: "<prefix><error><highlight><player></highlight> disconnected before the information was read."
list-header: "<prefix><primary>Online players: <highlight><count></highlight>/<highlight><max></highlight>"
list-empty: "<prefix><muted>Nobody is online (0/<max>)."
list-group: " <group> <dark_gray>(<count>)</dark_gray><muted>: <players>"
list-player: "<highlight><player>"
list-player-vanished: "<muted><italic><player></italic><highlight>[V]"
list-separator: "<muted>, "
list-other: "<muted>Other"
