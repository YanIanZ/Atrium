# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (warna diatur di config.yml pada bagian "theme"). Utamakan tag ini dibanding warna mentah.
sit-started: "<prefix><muted>Kamu duduk. Tekan sneak untuk berdiri."
sit-stopped: "<prefix><muted>Kamu berdiri."
sit-started-other: "<prefix><muted><highlight><player></highlight> duduk."
sit-stopped-other: "<prefix><muted><highlight><player></highlight> berdiri."
lay-started: "<prefix><muted>Kamu berbaring. Tekan sneak untuk bangun."
lay-stopped: "<prefix><muted>Kamu bangun."
lay-started-other: "<prefix><muted><highlight><player></highlight> berbaring."
lay-stopped-other: "<prefix><muted><highlight><player></highlight> bangun."
crawl-started: "<prefix><muted>Kamu merangkak. Tekan sneak untuk berhenti."
crawl-stopped: "<prefix><muted>Kamu berhenti merangkak."
crawl-started-other: "<prefix><muted><highlight><player></highlight> mulai merangkak."
crawl-stopped-other: "<prefix><muted><highlight><player></highlight> berhenti merangkak."
crawl-seated: "<prefix><error>Berdiri dulu sebelum merangkak."
crawl-sneaking: "<prefix><error>Berhenti sneak sebelum merangkak."
crawl-airborne: "<prefix><error>Mendarat dulu sebelum merangkak."
crawl-water: "<prefix><error>Kamu tidak bisa merangkak di dalam air."
cannot-crawl-here: "<prefix><error>Kamu tidak bisa merangkak di sini."
cannot-sit-here: "<prefix><error>Tidak ada ruang untuk duduk di sini."
already-riding: "<prefix><error>Kamu sedang menaiki sesuatu."
not-a-seat: "<prefix><error>Kamu hanya bisa duduk di tangga, slab, atau karpet."
top-half: "<prefix><error>Bagian atas tangga atau slab bukan tempat duduk."
no-headroom: "<prefix><error>Tidak ada ruang di atas blok itu."
feature-disabled: "<prefix><error>Fitur duduk itu dinonaktifkan."
world-disabled: "<prefix><error>Fitur duduk dinonaktifkan di dunia ini."
spectator: "<prefix><error>Kamu tidak bisa melakukan itu dalam mode spectator."
sweep-result: "<prefix><success>Menghapus <highlight><count></highlight> catatan kursi yang basi."
sweep-none: "<prefix><muted>Tidak ada catatan kursi yang basi."
help:
  - "<prefix><primary>Perintah duduk"
  - "<muted>/sit [pemain] <dark_gray>- <highlight>Duduk, atau berdiri"
  - "<muted>/lay [pemain] <dark_gray>- <highlight>Berbaring, atau bangun"
  - "<muted>/crawl [pemain] <dark_gray>- <highlight>Merangkak, atau berhenti"
  - "<muted>/seating sweep <dark_gray>- <highlight>Hapus catatan kursi yang basi"
  - "<muted><dark_gray>Klik tangga atau slab dengan tangan kosong untuk duduk."
