# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
sit-started: "<prefix><muted>You sit down. Sneak to stand up."
sit-stopped: "<prefix><muted>You stand up."
sit-started-other: "<prefix><muted><highlight><player></highlight> sits down."
sit-stopped-other: "<prefix><muted><highlight><player></highlight> stands up."
lay-started: "<prefix><muted>You lay down. Sneak to get up."
lay-stopped: "<prefix><muted>You get up."
lay-started-other: "<prefix><muted><highlight><player></highlight> lays down."
lay-stopped-other: "<prefix><muted><highlight><player></highlight> gets up."
crawl-started: "<prefix><muted>You are crawling. Sneak to stop."
crawl-stopped: "<prefix><muted>You stop crawling."
crawl-started-other: "<prefix><muted><highlight><player></highlight> starts crawling."
crawl-stopped-other: "<prefix><muted><highlight><player></highlight> stops crawling."
crawl-seated: "<prefix><error>Stand up before you crawl."
crawl-sneaking: "<prefix><error>Stop sneaking before you crawl."
crawl-airborne: "<prefix><error>Land before you crawl."
crawl-water: "<prefix><error>You cannot crawl while in water."
cannot-crawl-here: "<prefix><error>You cannot crawl here."
cannot-sit-here: "<prefix><error>There is no room to sit here."
already-riding: "<prefix><error>You are already riding something."
not-a-seat: "<prefix><error>You can only sit on stairs, slabs or carpets."
top-half: "<prefix><error>The top half of a stair or slab is not a seat."
no-headroom: "<prefix><error>There is no room above that block."
feature-disabled: "<prefix><error>That seating feature is disabled."
world-disabled: "<prefix><error>Seating is disabled in this world."
spectator: "<prefix><error>You cannot do that in spectator mode."
sweep-result: "<prefix><success>Removed <highlight><count></highlight> stale seat record(s)."
sweep-none: "<prefix><muted>No stale seat records were found."
help:
  - "<prefix><primary>Seating commands"
  - "<muted>/sit [player] <dark_gray>- <highlight>Sit down, or stand up"
  - "<muted>/lay [player] <dark_gray>- <highlight>Lay down, or get up"
  - "<muted>/crawl [player] <dark_gray>- <highlight>Crawl, or stop crawling"
  - "<muted>/ride [player] <dark_gray>- <highlight>Ride the entity you look at or another player"
  - "<muted>/ride stop [player] <dark_gray>- <highlight>Get off (safely)"
  - "<muted>/ride launch [power] <dark_gray>- <highlight>Launch your mount upwards"
  - "<muted>/seating sweep <dark_gray>- <highlight>Remove stale seat records"
  - "<muted><dark_gray>Right-click a stair or slab with an empty hand to sit on it."
ride-started: "<prefix><muted>You are riding <highlight><target></highlight>. Use <primary>/ride stop</primary> or sneak to get off."
ride-stopped: "<prefix><muted>You got off."
ride-stopped-other: "<prefix><muted><highlight><player></highlight> got off."
ride-not-riding: "<prefix><error>You are not riding anything."
ride-not-riding-other: "<prefix><error><highlight><player></highlight> is not riding anything."
ride-no-target: "<prefix><error>Look at a player or mob close enough, or use /ride <player>."
ride-self: "<prefix><error>You cannot ride yourself."
ride-players-disabled: "<prefix><error>Riding other players is disabled."
ride-full: "<prefix><error>That mount has no free seat left."
ride-unsuitable: "<prefix><error>You cannot ride that."
ride-disabled: "<prefix><error>Riding is disabled in the seating config."
ride-launched: "<prefix><muted>Launched with power <highlight><power></highlight>."
