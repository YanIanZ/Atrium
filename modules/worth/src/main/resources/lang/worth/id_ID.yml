# Harga dan penjualan. Tag tema: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>.
hand: '<prefix><highlight><item></highlight> <muted>x<amount>: <highlight><unit></highlight> per item, total <highlight><total></highlight>.'
unsellable: '<prefix><error><highlight><item></highlight> tidak bisa dijual.'
all: '<prefix><muted>Item yang bisa kamu jual (<highlight><items></highlight>) bernilai <highlight><total></highlight>.'
material: '<prefix><muted><highlight><material></highlight> biasa bernilai <highlight><price></highlight> per item.'
material-none: '<prefix><error><highlight><material></highlight> biasa tidak punya harga.'
material-special: '<prefix><muted>Ada <highlight><count></highlight> harga khusus untuk varian kustom item ini.'
unknown-material: '<prefix><error>Tidak ada item bernama <highlight><material></highlight>.'
empty-hand: '<prefix><error>Pegang sebuah item di tangan utama.'
invalid-price: '<prefix><error>Harga tidak valid. Gunakan angka 0 atau lebih, misalnya <highlight>12.5</highlight>.'
