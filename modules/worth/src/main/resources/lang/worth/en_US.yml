# Worth and selling. Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>.
hand: '<prefix><highlight><item></highlight> <muted>x<amount>: <highlight><unit></highlight> each, <highlight><total></highlight> in total.'
unsellable: '<prefix><error><highlight><item></highlight> cannot be sold.'
all: '<prefix><muted>Your sellable items (<highlight><items></highlight>) are worth <highlight><total></highlight>.'
material: '<prefix><muted>A plain <highlight><material></highlight> is worth <highlight><price></highlight> each.'
material-none: '<prefix><error>A plain <highlight><material></highlight> has no price.'
material-special: '<prefix><muted><highlight><count></highlight> special price(s) exist for custom variants of this item.'
unknown-material: '<prefix><error>There is no item called <highlight><material></highlight>.'
empty-hand: '<prefix><error>Hold an item in your main hand.'
invalid-price: '<prefix><error>That is not a valid price. Use a number of 0 or more, such as <highlight>12.5</highlight>.'
set: '<prefix><success>The price of <highlight><item></highlight> is now <highlight><price></highlight> (entry <highlight><id></highlight>).'
set-exact: '<prefix><muted>This item has custom data, so the entry only matches items with exactly the same data.'
creative: '<prefix><error>You cannot sell items in creative or spectator mode.'
busy: '<prefix><error>Your previous sale is still being processed.'
failed: '<prefix><error>Something went wrong and nothing was sold. Contact an administrator if items are missing.'
nothing: '<prefix><error>You have nothing sellable for that.'
limit-reached: '<prefix><error>You have reached your daily sell limit.'
deposit-failed: '<prefix><error>The payment failed. Your items were given back.'
deposit-limit: '<prefix><error>The payment would exceed your balance limit. Your items were given back.'
sold: '<prefix><success>Sold <highlight><items></highlight> item(s) for <highlight><amount></highlight>. Balance: <highlight><balance></highlight>.'
sold-limited: '<prefix><success>Sold <highlight><items></highlight> item(s) for <highlight><amount></highlight>. <warning>Your daily sell limit stopped the rest.</warning> Balance: <highlight><balance></highlight>.'
gui-title: '<primary>Sell items <muted>- close to sell'
gui-opened: '<prefix><muted>Put items into the chest and close it to sell them. Items that cannot be sold are given back.'
gui-returned: '<prefix><warning><highlight><count></highlight> unsold item(s) were given back.'
returned-dropped: '<prefix><warning>Your inventory was full, so some returned items were dropped at your feet.'
returned-pending: '<prefix><success>Items that were owed to you have been returned.'
log-empty: '<prefix><muted>You have not sold anything yet.'
log-entry: '<prefix><muted><time> <secondary><mode></secondary>: <highlight><items></highlight> item(s) for <highlight><total></highlight> <dark_gray>(<detail>)'
usage-sell: '<prefix><muted>Usage: <highlight>/sell hand|same|blocks [amount]</highlight><muted>, <highlight>/sell all</highlight> <muted>or <highlight>/sell \<material> [amount]'
usage-setworth: '<prefix><muted>Usage: <highlight>/setworth \<price></highlight> <muted>while holding the item'
engine: '<prefix><muted>Price engine: <highlight><active></highlight> <muted>(configured: <configured>)'
engine-fallback: '<prefix><warning>Configured engine <highlight><configured></highlight> is unavailable (<reason>); using <highlight><active></highlight>.'
engine-capabilities: '<prefix><muted>Supports: <highlight><supported></highlight><muted>; missing: <missing>'
engine-available: '<prefix><muted>Available engines: <highlight><engines></highlight>.'
engine-switched: '<prefix><success>Price engine switched to <highlight><engine></highlight>. Set <muted>price-source: <engine></muted> in worth.yml to keep it after a restart.'
engine-unknown: '<prefix><error>Unknown price engine <highlight><input></highlight>. Choose: <highlight><engines></highlight>.'
engine-unavailable: '<prefix><error>The <highlight><engine></highlight> engine is unavailable (<reason>).'
import-started: '<prefix><muted>Importing sell prices from <highlight><source></highlight>...'
import-done: '<prefix><success>Import from <highlight><source></highlight> done: <highlight><imported></highlight> new, <highlight><updated></highlight> overwritten, <highlight><existing></highlight> already set, <highlight><skipped></highlight> skipped. Report: <muted><file>'
import-dry-run: '<prefix><muted>Dry run from <highlight><source></highlight>: <highlight><imported></highlight> would be written, <highlight><updated></highlight> would be overwritten, <highlight><existing></highlight> already set, <highlight><skipped></highlight> skipped. Nothing was written. Report: <muted><file>'
import-failed: '<prefix><error>The import failed: <reason>'
import-unknown-source: '<prefix><error>Unknown import source <highlight><input></highlight>. Choose: <highlight><sources></highlight>.'
import-hint: '<prefix><warning>Prices were written, but the active engine is still <highlight><engine></highlight>. Set <muted>price-source: atrium</muted> in worth.yml to use the imported prices.'
