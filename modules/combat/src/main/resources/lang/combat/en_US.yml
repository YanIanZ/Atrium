tag-start: "<prefix><error>You are in combat for <highlight><seconds></highlight> second(s). Teleport commands and flight are blocked."
tag-end: "<prefix><success>You are no longer in combat."
tag-actionbar: "<error>Combat</error> <muted>|</muted> <highlight><seconds>s</highlight>"
tag-bossbar: "<error>Combat <seconds>s</error>"
tag-status-self: "<prefix><error>You are in combat for another <highlight><seconds></highlight> second(s)."
tag-status-other: "<prefix><error><player> is in combat for another <highlight><seconds></highlight> second(s)."
tag-status-none-self: "<prefix><success>You are not in combat."
tag-status-none-other: "<prefix><success><player> is not in combat."
command-usage: "<prefix><muted>Usage: <primary>/combat [status|help]</primary>, <primary>/combat tag <player> [seconds]</primary>, <primary>/combat untag <player></primary>."
tag-command-blocked: "<prefix><error>You cannot use <highlight>/<command></highlight> while in combat."
tag-teleport-blocked: "<prefix><error>You cannot teleport while in combat."
tag-world-disabled: "<prefix><muted>Combat is disabled in this world; your combat tag ended."
tagged-other: "<prefix><success>Tagged <highlight><player></highlight> for <highlight><seconds></highlight> second(s)."
tag-not-applied: "<prefix><error><player> cannot be tagged right now (combat disabled, vanished or bypassing)."
untagged-other: "<prefix><success>Removed the combat tag of <highlight><player></highlight>."
untagged-none: "<prefix><muted><player> was not in combat."
target-left: "<prefix><error>The target player disconnected before the command ran."
logout-broadcast: "<prefix><error><player> logged out while in combat and lost their items."
notarget-disabled: "<prefix><error>The no-target option is disabled on this server."
notarget-on: "<prefix><success>Mobs will ignore you until you use <primary>/notarget</primary> again."
notarget-off: "<prefix><success>Mobs can target you again."
notarget-on-other: "<prefix><success><player> is now ignored by mobs."
notarget-off-other: "<prefix><success>Mobs can target <player> again."
damagecontrol-disabled: "<prefix><muted>Damage control is disabled. Enable it under <highlight>damage-control</highlight> in combat.yml."
damagecontrol-empty: "<prefix><muted>Damage control is enabled but has no rules."
damagecontrol-header: "<prefix><primary>Damage control rules (<count>):</primary>"
damagecontrol-rule: "<prefix><muted>»</muted> <highlight><cause></highlight> <muted>×<multiplier></muted> <muted>for</muted> <permissions> <muted>in</muted> <worlds>"
