# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
tfly-warning: "<prefix><warning>Temporary flight ends in <highlight><seconds></highlight>s."
tfly-ended: "<prefix><muted>Temporary flight ended. Slow falling will bring you down safely."
tfly-resumed: "<prefix><success>Your temporary flight resumes with <highlight><time></highlight> left."
tfly-started: "<prefix><success>Temporary flight enabled for <highlight><time></highlight>."
tfly-started-other: "<prefix><success>Gave <highlight><player></highlight> temporary flight for <highlight><time></highlight>."
tfly-stopped: "<prefix><muted>Your temporary flight was ended."
tfly-stopped-other: "<prefix><muted>Ended the temporary flight of <highlight><player></highlight>."
tfly-limit: "<prefix><error>The maximum temporary flight time is <highlight><max></highlight> seconds."
invalid-duration: "<prefix><error>That is not a valid duration. Use for example 30s, 5m, 2h30m or 1d."
no-flight-service: "<prefix><error>Flight is unavailable right now. Try again in a moment."
target-left: "<prefix><error>The target player disconnected before the command ran."
failed: "<prefix><error>The command failed. The error was logged for the server staff."
save-failed: "<prefix><error>The change could not be saved. The error was logged for the server staff."
player-not-found: "<prefix><error>No player named <highlight><player></highlight> was found."
no-silent: "<prefix><error>You need the <highlight>atrium.playerplus.silent</highlight> permission to use -s."
charge-disabled: "<prefix><error>Charged flight is disabled on this server."
charge-empty: "<prefix><error>You have no flight charge. Buy some with <highlight>/flightcharge buy</highlight>."
charge-empty-flight: "<prefix><error>Your flight charge ran out. Slow falling will bring you down safely."
charge-flight-enabled: "<prefix><success>Paid flight enabled; you have <highlight><charge></highlight> seconds of charge."
charge-flight-disabled: "<prefix><muted>Paid flight disabled. Your remaining charge is kept."
charge-status: "<prefix><muted>Flight charge: <highlight><charge></highlight>/<highlight><max></highlight>s. Paid flight: <highlight><active></highlight>. Auto-recharge: <highlight><auto></highlight>. Price: <highlight><price></highlight>."
charge-info: "<prefix><muted>Flight charge maximum: <highlight><max></highlight>s. Price: <highlight><price></highlight>. Default currency: <highlight><currency></highlight>. Auto-recharge: <highlight><auto></highlight>."
charge-bought: "<prefix><success>Bought <highlight><amount></highlight> seconds of flight for <highlight><cost></highlight>."
charge-bought-exp: "<prefix><success>Bought <highlight><amount></highlight> seconds of flight for <highlight><cost></highlight> experience points."
charge-auto-bought: "<prefix><success>Auto-recharged <highlight><amount></highlight> seconds of flight (-<highlight><cost></highlight>)."
charge-auto-failed: "<prefix><error>Auto-recharge failed; you cannot cover <highlight><cost></highlight>."
charge-full: "<prefix><muted>Your flight charge is already full (<highlight><max></highlight> seconds)."
insufficient-funds: "<prefix><error>You cannot afford <highlight><cost></highlight>."
insufficient-exp: "<prefix><error>You need <highlight><cost></highlight> experience points."
purchase-busy: "<prefix><warning>A purchase is already running. Wait for it to finish."
purchase-failed: "<prefix><error>The flight-charge purchase failed. The error was logged for the server staff."
no-economy: "<prefix><error>The economy is unavailable right now."
charge-autorecharge: "<prefix><success>Auto-recharge is now <highlight><state></highlight>."
charge-autorecharge-status: "<prefix><muted>Auto-recharge is <highlight><state></highlight>; it tops up below <highlight><below></highlight> seconds and buys <highlight><amount></highlight> seconds. Use <highlight>/autorecharge on|off</highlight>."
charge-admin-changed: "<prefix><success>Your flight charge is now <highlight><charge></highlight>/<highlight><max></highlight> seconds."
charge-admin-set: "<prefix><success>Flight charge of <highlight><player></highlight> set to <highlight><charge></highlight>/<highlight><max></highlight> seconds."
cuff-done: "<prefix><success><highlight><player></highlight> is now cuffed."
cuff-applied: "<prefix><warning>You have been cuffed by staff."
cuff-exempt: "<prefix><error><highlight><player></highlight> is exempt from cuffs."
not-cuffed: "<prefix><error><highlight><player></highlight> is not cuffed."
uncuff-done: "<prefix><success><highlight><player></highlight> is no longer cuffed."
uncuff-applied: "<prefix><success>You have been released from the cuffs."
cant-cuff-self: "<prefix><error>You cannot cuff yourself."
cuff-notice-online: "<prefix><error>You are still cuffed and may not leave this spot."
cuff-move-blocked: "<prefix><error>You cannot move further from the cuff point."
cuff-teleport-blocked: "<prefix><error>You cannot teleport away while cuffed."
cuff-command-blocked: "<prefix><error>You cannot use that command while cuffed."
cuff-interact-blocked: "<prefix><error>You cannot interact while cuffed."
cuff-damage-blocked: "<prefix><error>You cannot damage anyone while cuffed."
cuff-respawn: "<prefix><warning>Your cuff point moved to your respawn location."
giftpet-armed: "<prefix><warning>Right-click one of your tamed pets within <highlight><seconds></highlight> seconds to give it to <highlight><player></highlight>."
giftpet-expired: "<prefix><error>The pet-gift window expired. Use <highlight>/giftpet</highlight> again."
giftpet-not-tamed: "<prefix><error>That is not a tamed pet."
giftpet-not-yours: "<prefix><error>That pet belongs to someone else."
giftpet-target-left: "<prefix><error><highlight><player></highlight> is no longer online."
giftpet-self: "<prefix><error>You cannot give a pet to yourself."
giftpet-transferred: "<prefix><success>You gave your <highlight><pet></highlight> to <highlight><player></highlight>."
giftpet-received: "<prefix><success><highlight><player></highlight> gave you their <highlight><pet></highlight>."
hunger-set: "<prefix><success>Hunger set to <highlight><level></highlight>."
hunger-set-other: "<prefix><success>Set the hunger of <highlight><player></highlight> to <highlight><level></highlight>."
saturation-set: "<prefix><success>Saturation set to <highlight><saturation></highlight>."
saturation-set-other: "<prefix><success>Set the saturation of <highlight><player></highlight> to <highlight><saturation></highlight>."
charge-overflow-refunded: "<prefix><warning>Your flight charge filled up meanwhile; <highlight><amount></highlight> paid seconds did not fit and <highlight><cost></highlight> was refunded."
charge-overflow-refunded-exp: "<prefix><warning>Your flight charge filled up meanwhile; <highlight><amount></highlight> paid seconds did not fit and <highlight><cost></highlight> experience points were refunded."
