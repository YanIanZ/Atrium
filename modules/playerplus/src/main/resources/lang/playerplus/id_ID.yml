# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (warna diatur di config.yml pada bagian "theme"). Utamakan tag ini dibanding warna mentah.
tfly-warning: "<prefix><warning>Mode terbang sementara berakhir dalam <highlight><seconds></highlight> detik."
tfly-ended: "<prefix><muted>Mode terbang sementara berakhir. Slow falling membawamu mendarat dengan aman."
tfly-resumed: "<prefix><success>Mode terbang sementaramu dilanjutkan; sisa <highlight><time></highlight>."
tfly-started: "<prefix><success>Mode terbang sementara aktif selama <highlight><time></highlight>."
tfly-started-other: "<prefix><success><highlight><player></highlight> mendapat mode terbang sementara selama <highlight><time></highlight>."
tfly-stopped: "<prefix><muted>Mode terbang sementaramu dihentikan."
tfly-stopped-other: "<prefix><muted>Mode terbang sementara <highlight><player></highlight> dihentikan."
tfly-limit: "<prefix><error>Batas waktu terbang sementara adalah <highlight><max></highlight> detik."
invalid-duration: "<prefix><error>Itu bukan durasi yang valid. Gunakan misalnya 30s, 5m, 2h30m, atau 1d."
no-flight-service: "<prefix><error>Mode terbang sedang tidak tersedia. Coba lagi sebentar lagi."
target-left: "<prefix><error>Pemain tujuan keluar sebelum perintah dijalankan."
failed: "<prefix><error>Perintah gagal. Kesalahannya sudah dicatat untuk staf server."
save-failed: "<prefix><error>Perubahan tidak dapat disimpan. Kesalahannya sudah dicatat untuk staf server."
player-not-found: "<prefix><error>Tidak ada pemain bernama <highlight><player></highlight>."
no-silent: "<prefix><error>Kamu membutuhkan izin <highlight>atrium.playerplus.silent</highlight> untuk memakai -s."
charge-disabled: "<prefix><error>Mode terbang berbayar dinonaktifkan di server ini."
charge-empty: "<prefix><error>Charge terbangmu kosong. Beli dengan <highlight>/flightcharge buy</highlight>."
charge-empty-flight: "<prefix><error>Charge terbangmu habis. Slow falling membawamu mendarat dengan aman."
charge-flight-enabled: "<prefix><success>Mode terbang berbayar aktif; charge tersisa <highlight><charge></highlight> detik."
charge-flight-disabled: "<prefix><muted>Mode terbang berbayar dimatikan. Sisa charge tetap disimpan."
charge-status: "<prefix><muted>Charge terbang: <highlight><charge></highlight>/<highlight><max></highlight> detik. Terbang berbayar: <highlight><active></highlight>. Isi ulang otomatis: <highlight><auto></highlight>. Harga: <highlight><price></highlight>."
charge-info: "<prefix><muted>Maksimum charge terbang: <highlight><max></highlight> detik. Harga: <highlight><price></highlight>. Mata uang bawaan: <highlight><currency></highlight>. Isi ulang otomatis: <highlight><auto></highlight>."
charge-bought: "<prefix><success>Membeli <highlight><amount></highlight> detik terbang seharga <highlight><cost></highlight>."
charge-bought-exp: "<prefix><success>Membeli <highlight><amount></highlight> detik terbang seharga <highlight><cost></highlight> poin pengalaman."
