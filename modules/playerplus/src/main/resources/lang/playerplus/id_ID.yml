charge-auto-failed: "<prefix><error>Isi ulang otomatis gagal; kamu tidak dapat menutup <highlight><cost></highlight>."
charge-full: "<prefix><muted>Charge terbangmu sudah penuh (<highlight><max></highlight> detik)."
insufficient-funds: "<prefix><error>Kamu tidak mampu membayar <highlight><cost></highlight>."
