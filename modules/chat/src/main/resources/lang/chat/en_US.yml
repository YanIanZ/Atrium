room-exists: "<prefix><error>A room named <highlight><room></highlight> already exists."
room-limit: "<prefix><error>You already own the maximum number of rooms."
room-created: "<prefix><success>Room <highlight><room></highlight> created. Your chat now goes to that room."
room-unknown: "<prefix><error>No chat room named <highlight><room></highlight> exists."
room-locked: "<prefix><error>Room <highlight><room></highlight> is locked; you need an invitation."
room-full: "<prefix><error>Room <highlight><room></highlight> is full."
room-joined: "<prefix><success>You joined room <highlight><room></highlight>."
room-not-in-one: "<prefix><muted>You are not in a chat room."
room-left: "<prefix><muted>You left room <highlight><room></highlight>."
room-already-member: "<prefix><error><highlight><player></highlight> is already in your room."
room-invited: "<prefix><success>Invited <highlight><player></highlight> to <highlight><room></highlight>."
