emoji-empty: "<prefix><warning>No emoji shortcode is configured."
emoji-disabled: "<prefix><warning>Emoji are disabled on this server."
emoji-hover: "<highlight><emoji></highlight>"
muted: "<prefix><error>You are muted and cannot send messages."
caps-blocked: "<prefix><error>Your message was not sent because it was mostly upper case."
command-spam: "<prefix><error>You are using that command too often. Please slow down."
spam-similar: "<prefix><error>That message is too similar to one you just sent."
