chatcolor-current-none: "<prefix><muted>You have no chat colour. Use <highlight><usage></highlight> or <highlight>/chatcolor list</highlight>."
chatcolor-set: "<prefix><success>Chat colour set to <color> <muted>(<highlight><name></highlight>)."
chatcolor-reset: "<prefix><muted>Chat colour reset to the server default."
chatcolor-unknown: "<prefix><error>Unknown chat colour <highlight><color></highlight>. Available: <highlight><colors></highlight>."
chatcolor-wrong-type: "<prefix><error><highlight><color></highlight> is not a <highlight><type></highlight> colour."
chatcolor-no-permission: "<prefix><error>You do not have permission to use <highlight><color></highlight>."
