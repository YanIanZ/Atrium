room-not-owner: "<prefix><error>Only the room owner can do that."
room-deleted: "<prefix><warning>Room <highlight><room></highlight> was deleted."
room-who: "<prefix><primary><room></primary><muted>: <highlight><online></highlight> online, <highlight><members></highlight> member(s). Online: <highlight><players></highlight>."
room-gone: "<prefix><error>That chat room no longer exists. You are back in public chat."
