# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage-msg: "<prefix><muted>Usage: <highlight>/msg (player) (message)</highlight>."
usage-reply: "<prefix><muted>Usage: <highlight>/reply (message)</highlight>."
usage-ignore: "<prefix><muted>Usage: <highlight>/ignore (player)</highlight> or <highlight>/ignore list</highlight>."
usage-broadcast: "<prefix><muted>Usage: <highlight>/broadcast (message)</highlight>."
usage-me: "<prefix><muted>Usage: <highlight>/me (action)</highlight>."
msg-sent: "<muted>To <highlight><target></highlight><muted>: <reset><message>"
msg-received: "<muted>From <highlight><sender></highlight><muted>: <reset><message>"
msg-ignored: "<prefix><error><highlight><player></highlight> is ignoring you."
msg-disabled: "<prefix><error><highlight><player></highlight> has private messages disabled."
msg-self: "<prefix><error>You cannot message yourself."
reply-none: "<prefix><error>You have nobody to reply to."
reply-offline: "<prefix><error>That player is no longer online."
ignore-added: "<prefix><success>You now ignore <highlight><player></highlight>."
ignore-removed: "<prefix><success>You no longer ignore <highlight><player></highlight>."
ignore-self: "<prefix><error>You cannot ignore yourself."
ignore-exempt: "<prefix><error><highlight><player></highlight> cannot be ignored."
ignore-list-empty: "<prefix><muted>You are not ignoring anyone."
ignore-list: "<prefix><muted>Ignoring <highlight><count></highlight> player(s): <highlight><players></highlight>."
msgtoggle-on: "<prefix><success>Private messages enabled."
msgtoggle-off: "<prefix><muted>Private messages disabled."
socialspy-on: "<prefix><success>Social spy enabled."
socialspy-off: "<prefix><muted>Social spy disabled."
social-spy: "<dark_gray>[SPY] <highlight><sender></highlight> <dark_gray>→ <highlight><target></highlight><dark_gray>: <reset><message>"
staff-on: "<prefix><success>Staff chat mode enabled."
staff-off: "<prefix><muted>Staff chat mode disabled."
staff-format: "<error>[STAFF]</error> <highlight><player></highlight><dark_gray> » <reset><message>"
broadcast-format: "<primary>[Broadcast]</primary> <highlight><message>"
me-format: "<muted>* <highlight><player></highlight> <reset><message>"
clearchat-broadcast: "<prefix><warning>Chat was cleared by <highlight><player></highlight>."
clearchat-self: "<prefix><muted>Your chat was cleared."
filter-blocked: "<prefix><error>Your message was blocked by the chat filter."
filter-alert: "<prefix><error>[Filter]</error> <highlight><player></highlight> <muted>(<highlight><rules></highlight>): <reset><message>"
spam-too-fast: "<prefix><error>Slow down. Wait <highlight><seconds></highlight>s before chatting again."
spam-duplicate: "<prefix><error>You already sent that message. Please do not repeat it."
msg-unknown: "<prefix><error>Player <highlight><player></highlight> is not online here or anywhere on the network."
cross-server-format: "<dark_gray>[</dark_gray><highlight><server></highlight><dark_gray>]</dark_gray> <highlight><player></highlight> <dark_gray>»</dark_gray> <reset><message>"
cross-server-unavailable: "<prefix><error>That player is not on this server and cross-server chat is unavailable."
chatcolor-current: "<prefix><muted>Your chat colour is <color> <muted>(<highlight><name></highlight>). Use <highlight>/chatcolor list</highlight> to change it."
chatcolor-current-none: "<prefix><muted>You have no chat colour. Use <highlight><usage></highlight> or <highlight>/chatcolor list</highlight>."
chatcolor-set: "<prefix><success>Chat colour set to <color> <muted>(<highlight><name></highlight>)."
chatcolor-reset: "<prefix><muted>Chat colour reset to the server default."
chatcolor-unknown: "<prefix><error>Unknown chat colour <highlight><color></highlight>. Available: <highlight><colors></highlight>."
chatcolor-wrong-type: "<prefix><error><highlight><color></highlight> is not a <highlight><type></highlight> colour."
chatcolor-no-permission: "<prefix><error>You do not have permission to use <highlight><color></highlight>."
chatcolor-save-failed: "<prefix><error>Your chat colour could not be saved. Try again."
chatcolor-list-header: "<prefix><primary>Available chat colours (<highlight><count></highlight>):"
chatcolor-list-empty: "<prefix><warning>No chat colour is available to you."
chatcolor-hover: "<muted>Click to use <highlight><name></highlight>"
emoji-header: "<prefix><primary>Emoji shortcodes (<highlight><count></highlight>), click one to insert it:"
emoji-empty: "<prefix><warning>No emoji shortcode is configured."
emoji-disabled: "<prefix><warning>Emoji are disabled on this server."
emoji-hover: "<highlight><emoji></highlight>"
muted: "<prefix><error>You are muted and cannot send messages."
