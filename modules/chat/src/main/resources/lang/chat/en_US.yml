room-save-failed: "<prefix><error>The room change could not be saved. Try again."
room-format: "<dark_aqua>[<room>]</dark_aqua> <gray><player><dark_gray> » <white><message>"
tag-none: "<prefix><muted>You have no chat tag. Use <highlight>/chattag list</highlight> to pick one."
tag-current: "<prefix><muted>Your chat tag is <highlight><tag></highlight>."
tag-list-empty: "<prefix><warning>No chat tag is available to you."
tag-list-header: "<prefix><primary>Chat tags (<highlight><count></highlight>), click one to use it:"
tag-hover: "<muted>Click to use the <highlight><tag></highlight> tag"
tag-unknown: "<prefix><error>Unknown chat tag <highlight><tag></highlight>."
tag-no-permission: "<prefix><error>You do not have permission to use the <highlight><tag></highlight> tag."
tag-set: "<prefix><success>Chat tag set to <highlight><tag></highlight>."
tag-reset: "<prefix><muted>Your chat tag was removed."
rangespy-on: "<prefix><success>Range spy enabled."
rangespy-off: "<prefix><muted>Range spy disabled."
rangespy-disabled: "<prefix><warning>Range spy is disabled on this server."
delete-unknown: "<prefix><error>That message is no longer in the delete history."
