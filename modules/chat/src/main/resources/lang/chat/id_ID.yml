# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage-msg: "<prefix><muted>Penggunaan: <highlight>/msg (pemain) (pesan)</highlight>."
usage-reply: "<prefix><muted>Penggunaan: <highlight>/reply (pesan)</highlight>."
usage-ignore: "<prefix><muted>Penggunaan: <highlight>/ignore (pemain)</highlight> atau <highlight>/ignore list</highlight>."
usage-broadcast: "<prefix><muted>Penggunaan: <highlight>/broadcast (pesan)</highlight>."
usage-me: "<prefix><muted>Penggunaan: <highlight>/me (aksi)</highlight>."
msg-sent: "<muted>Ke <highlight><target></highlight><muted>: <reset><message>"
msg-received: "<muted>Dari <highlight><sender></highlight><muted>: <reset><message>"
msg-ignored: "<prefix><error><highlight><player></highlight> sedang mengabaikanmu."
msg-disabled: "<prefix><error><highlight><player></highlight> menonaktifkan pesan pribadi."
msg-self: "<prefix><error>Kamu tidak bisa mengirim pesan ke dirimu sendiri."
reply-none: "<prefix><error>Tidak ada orang untuk dibalas."
reply-offline: "<prefix><error>Pemain itu sudah tidak online."
ignore-added: "<prefix><success>Kamu sekarang mengabaikan <highlight><player></highlight>."
ignore-removed: "<prefix><success>Kamu tidak lagi mengabaikan <highlight><player></highlight>."
ignore-self: "<prefix><error>Kamu tidak bisa mengabaikan dirimu sendiri."
ignore-exempt: "<prefix><error><highlight><player></highlight> tidak bisa diabaikan."
ignore-list-empty: "<prefix><muted>Kamu tidak mengabaikan siapa pun."
ignore-list: "<prefix><muted>Mengabaikan <highlight><count></highlight> pemain: <highlight><players></highlight>."
msgtoggle-on: "<prefix><success>Pesan pribadi diaktifkan."
msgtoggle-off: "<prefix><muted>Pesan pribadi dinonaktifkan."
socialspy-on: "<prefix><success>Social spy diaktifkan."
socialspy-off: "<prefix><muted>Social spy dinonaktifkan."
social-spy: "<dark_gray>[SPY] <highlight><sender></highlight> <dark_gray>→ <highlight><target></highlight><dark_gray>: <reset><message>"
staff-on: "<prefix><success>Mode staff chat diaktifkan."
staff-off: "<prefix><muted>Mode staff chat dinonaktifkan."
staff-format: "<error>[STAFF]</error> <highlight><player></highlight><dark_gray> » <reset><message>"
broadcast-format: "<primary>[Broadcast]</primary> <highlight><message>"
me-format: "<muted>* <highlight><player></highlight> <reset><message>"
clearchat-broadcast: "<prefix><warning>Chat dibersihkan oleh <highlight><player></highlight>."
clearchat-self: "<prefix><muted>Chat-mu dibersihkan."
filter-blocked: "<prefix><error>Pesanmu diblokir oleh filter chat."
filter-alert: "<prefix><error>[Filter]</error> <highlight><player></highlight> <muted>(<highlight><rules></highlight>): <reset><message>"
spam-too-fast: "<prefix><error>Pelan-pelan. Tunggu <highlight><seconds></highlight>s sebelum mengirim pesan lagi."
spam-duplicate: "<prefix><error>Kamu sudah mengirim pesan itu. Jangan mengulanginya."
msg-unknown: "<prefix><error>Pemain <highlight><player></highlight> tidak online di sini maupun di jaringan."
cross-server-format: "<dark_gray>[</dark_gray><highlight><server></highlight><dark_gray>]</dark_gray> <highlight><player></highlight> <dark_gray>»</dark_gray> <reset><message>"
cross-server-unavailable: "<prefix><error>Pemain itu tidak ada di server ini dan chat lintas server tidak tersedia."
chatcolor-current: "<prefix><muted>Warna chat-mu <color> <muted>(<highlight><name></highlight>). Gunakan <highlight>/chatcolor list</highlight> untuk menggantinya."
chatcolor-current-none: "<prefix><muted>Kamu belum punya warna chat. Gunakan <highlight><usage></highlight> atau <highlight>/chatcolor list</highlight>."
chatcolor-set: "<prefix><success>Warna chat diatur ke <color> <muted>(<highlight><name></highlight>)."
chatcolor-reset: "<prefix><muted>Warna chat dikembalikan ke bawaan server."
chatcolor-unknown: "<prefix><error>Warna chat <highlight><color></highlight> tidak dikenal. Tersedia: <highlight><colors></highlight>."
chatcolor-wrong-type: "<prefix><error><highlight><color></highlight> bukan warna bertipe <highlight><type></highlight>."
chatcolor-no-permission: "<prefix><error>Kamu tidak punya izin memakai <highlight><color></highlight>."
chatcolor-save-failed: "<prefix><error>Warna chat-mu gagal disimpan. Coba lagi."
chatcolor-list-header: "<prefix><primary>Warna chat yang tersedia (<highlight><count></highlight>):"
chatcolor-list-empty: "<prefix><warning>Tidak ada warna chat yang tersedia untukmu."
chatcolor-hover: "<muted>Klik untuk memakai <highlight><name></highlight>"
emoji-header: "<prefix><primary>Kode emoji (<highlight><count></highlight>), klik untuk menyisipkan:"
emoji-empty: "<prefix><warning>Belum ada kode emoji yang dikonfigurasi."
emoji-disabled: "<prefix><warning>Emoji dinonaktifkan di server ini."
emoji-hover: "<highlight><emoji></highlight>"
muted: "<prefix><error>Kamu sedang dibisukan dan tidak bisa mengirim pesan."
