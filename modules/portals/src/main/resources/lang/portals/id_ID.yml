# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (warna diatur di config.yml pada bagian "theme"). Utamakan tag ini dibanding warna mentah.
wand-name: "<primary>Tongkat portal</primary> <muted>(klik kiri: pos1, klik kanan: pos2)"
wand-given: "<prefix><muted>Tongkat portal ditambahkan ke inventaris. Klik kiri blok untuk pos1, klik kanan untuk pos2."
inventory-full: "<prefix><error>Inventarismu penuh."
pos-set: "<prefix><muted>Posisi <highlight><pos></highlight> diatur ke <highlight><world> <x> <y> <z></highlight>. Seleksi: <highlight><size></highlight>"
invalid-name: "<prefix><error>Nama portal hanya boleh berisi huruf, angka, _ dan - (maksimal 32 karakter)."
no-selection: "<prefix><error>Pilih kedua sudut dulu, dengan tongkat atau <highlight>/portal pos1</highlight> dan <highlight>/portal pos2</highlight>."
selection-worlds: "<prefix><error>Kedua sudut harus berada di world yang sama."
too-large: "<prefix><error>Seleksi terlalu besar: setiap sisi maksimal <highlight><max></highlight> blok."
created: "<prefix><success>Portal <highlight><portal></highlight> dibuat (<highlight><area></highlight>). Atur tujuannya dengan <highlight>/portal settarget</highlight>."
exists: "<prefix><error>Portal bernama <highlight><portal></highlight> sudah ada."
overlap: "<prefix><error>Portal <highlight><portal></highlight> akan bertumpuk dengan portal <highlight><other></highlight>."
not-found: "<prefix><error>Tidak ada portal bernama <highlight><portal></highlight>."
deleted: "<prefix><muted>Portal <highlight><portal></highlight> dihapus."
save-failed: "<prefix><error>Portal tidak dapat disimpan. Tidak ada yang diubah. Kesalahannya sudah dicatat untuk staf server."
list-header: "<prefix><primary>Portal (<highlight><count></highlight>):"
list-empty: "<muted>  tidak ada"
list-entry: "<muted> - <highlight><portal></highlight> <dark_gray>(<world>)</dark_gray> <muted>→ <highlight><target></highlight>"
info:
  - "<prefix><primary>Portal <highlight><portal></highlight>"
  - "<secondary>  Area: <highlight><area></highlight> <dark_gray>(<size>)</dark_gray>"
  - "<secondary>  Tujuan: <highlight><target></highlight>"
  - "<secondary>  Izin: <highlight><permission></highlight>"
  - "<secondary>  Aksi: <highlight><action></highlight>"
  - "<secondary>  Dibuat oleh: <highlight><creator></highlight>"
target-invalid: "<prefix><error>Tujuan harus <highlight>none</highlight>, <highlight>location</highlight>, <highlight>warp:NAMA</highlight>, atau <highlight>server:NAMA</highlight>."
target-set: "<prefix><success>Portal <highlight><portal></highlight> sekarang menuju <highlight><target></highlight>."
target-set-server: "<prefix><warning>Portal <highlight><portal></highlight> sekarang menuju <highlight><target></highlight>. Hanya disimpan: dukungan proxy belum tersedia."
server-connecting: "<prefix><muted>Mengirim kamu ke <highlight><server></highlight>..."
actions-unavailable: "<prefix><error>Baris aksi membutuhkan modul actions, yang tidak aktif."
# <error> di sini adalah teks kesalahan, jadi baris ini memakai warna biasa.
command-invalid: "<prefix><red>Baris aksi tidak valid: <highlight><error></highlight>"
command-set: "<prefix><success>Baris aksi portal <highlight><portal></highlight> diatur."
command-cleared: "<prefix><muted>Baris aksi portal <highlight><portal></highlight> dihapus."
permission-invalid: "<prefix><error>Node izin hanya boleh berisi huruf, angka, _ . dan -."
permission-set: "<prefix><success>Portal <highlight><portal></highlight> sekarang membutuhkan <highlight><permission></highlight>."
permission-cleared: "<prefix><muted>Portal <highlight><portal></highlight> tidak lagi membutuhkan izin."
no-permission: "<prefix><error>Kamu tidak boleh memakai portal <highlight><portal></highlight>."
cooldown: "<prefix><error>Tunggu <highlight><time></highlight> sebelum memakai portal lagi."
teleported: "<prefix><muted>Kamu melewati portal <highlight><portal></highlight>."
world-not-loaded: "<prefix><error>World tujuan <highlight><world></highlight> tidak dimuat."
target-unavailable: "<prefix><error>Portal <highlight><portal></highlight> saat ini tidak menuju ke mana pun."
server-unavailable: "<prefix><warning>Server <highlight><server></highlight> belum dapat dijangkau dari sini."
