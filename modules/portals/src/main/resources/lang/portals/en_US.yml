# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
wand-name: "<primary>Portal wand</primary> <muted>(left click: pos1, right click: pos2)"
wand-given: "<prefix><muted>Portal wand added to your inventory. Left click a block for pos1, right click for pos2."
inventory-full: "<prefix><error>Your inventory is full."
pos-set: "<prefix><muted>Position <highlight><pos></highlight> set to <highlight><world> <x> <y> <z></highlight>. Selection: <highlight><size></highlight>"
invalid-name: "<prefix><error>Portal names may only contain letters, digits, _ and - (at most 32 characters)."
no-selection: "<prefix><error>Select both corners first, with the wand or <highlight>/portal pos1</highlight> and <highlight>/portal pos2</highlight>."
selection-worlds: "<prefix><error>Both corners must be in the same world."
too-large: "<prefix><error>The selection is too large: each side may be at most <highlight><max></highlight> blocks."
created: "<prefix><success>Portal <highlight><portal></highlight> created (<highlight><area></highlight>). Set where it leads with <highlight>/portal settarget</highlight>."
exists: "<prefix><error>A portal called <highlight><portal></highlight> already exists."
overlap: "<prefix><error>Portal <highlight><portal></highlight> would overlap portal <highlight><other></highlight>."
not-found: "<prefix><error>There is no portal called <highlight><portal></highlight>."
deleted: "<prefix><muted>Portal <highlight><portal></highlight> deleted."
save-failed: "<prefix><error>The portal could not be saved. Nothing was changed. The error was logged for the server staff."
list-header: "<prefix><primary>Portals (<highlight><count></highlight>):"
list-empty: "<muted>  none"
list-entry: "<muted> - <highlight><portal></highlight> <dark_gray>(<world>)</dark_gray> <muted>→ <highlight><target></highlight>"
info:
  - "<prefix><primary>Portal <highlight><portal></highlight>"
  - "<secondary>  Area: <highlight><area></highlight> <dark_gray>(<size>)</dark_gray>"
  - "<secondary>  Target: <highlight><target></highlight>"
  - "<secondary>  Permission: <highlight><permission></highlight>"
  - "<secondary>  Action: <highlight><action></highlight>"
  - "<secondary>  Created by: <highlight><creator></highlight>"
  - "<secondary>  Cost: <highlight><cost></highlight>"
target-invalid: "<prefix><error>Target must be <highlight>none</highlight>, <highlight>location</highlight>, <highlight>warp:NAME</highlight> or <highlight>server:NAME</highlight>."
target-set: "<prefix><success>Portal <highlight><portal></highlight> now leads to <highlight><target></highlight>."
target-set-server: "<prefix><warning>Portal <highlight><portal></highlight> now targets <highlight><target></highlight>. Stored only: proxy support is not available yet."
server-connecting: "<prefix><muted>Sending you to <highlight><server></highlight>..."
actions-unavailable: "<prefix><error>Action lines need the actions module, which is not enabled."
# <error> is the error text here, so this line uses a plain colour.
command-invalid: "<prefix><red>Invalid action line: <highlight><error></highlight>"
command-set: "<prefix><success>Action line of portal <highlight><portal></highlight> set."
command-cleared: "<prefix><muted>Action line of portal <highlight><portal></highlight> removed."
permission-invalid: "<prefix><error>Permission nodes may only contain letters, digits, _ . and -."
permission-set: "<prefix><success>Portal <highlight><portal></highlight> now requires <highlight><permission></highlight>."
permission-cleared: "<prefix><muted>Portal <highlight><portal></highlight> no longer requires a permission."
no-permission: "<prefix><error>You may not use the portal <highlight><portal></highlight>."
cooldown: "<prefix><error>Wait <highlight><time></highlight> before using a portal again."
teleported: "<prefix><muted>You went through portal <highlight><portal></highlight>."
world-not-loaded: "<prefix><error>The destination world <highlight><world></highlight> is not loaded."
target-unavailable: "<prefix><error>Portal <highlight><portal></highlight> leads nowhere right now."
server-unavailable: "<prefix><warning>Server <highlight><server></highlight> cannot be reached from here yet."
cost-set: "<prefix><success>Portal <highlight><portal></highlight> now costs <highlight><cost></highlight> per use."
cost-cleared: "<prefix><muted>Portal <highlight><portal></highlight> uses the default cost (<highlight><cost></highlight>)."
cost-invalid: "<prefix><error>The cost must be a non-negative number, or <highlight>default</highlight>."
no-funds: "<prefix><error>This portal costs <highlight><cost></highlight> and you cannot pay it."
payment-failed: "<prefix><error>The portal price of <highlight><cost></highlight> could not be charged, so the portal was not used."
charged: "<prefix><muted>Portal <highlight><portal></highlight> charged <highlight><cost></highlight>."
refunded: "<prefix><muted>The portal price of <highlight><cost></highlight> was refunded."
refund-failed: "<prefix><error>The refund of <highlight><cost></highlight> failed. The error was logged; contact an administrator with the time of the teleport."
warmup: "<prefix><muted>Portal <highlight><portal></highlight> in <highlight><time></highlight>. Stay inside."
warmup-cancelled: "<prefix><warning>Portal <highlight><portal></highlight> cancelled: you left the region."
kicked: "<prefix><error>Portal <highlight><portal></highlight> pushed you back."
