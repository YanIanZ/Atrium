# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# <package> is the package display-name from modules/webstore.yml; <buyer>, <player> and <message> are plain text.
delivered: "<prefix><success>Your purchase <package> <success>has been delivered. Thank you for supporting the server!"
delivered-title: "<package>"
delivered-subtitle: "<success>Purchase delivered. Thank you!"
gifted: "<prefix><success><highlight><buyer></highlight> gifted you <package><success>!"
gift-message: "<prefix><muted>Message from <highlight><buyer></highlight>: <white>\"<message>\""
gifted-title: "<package>"
gifted-subtitle: "<success>A gift from <highlight><buyer></highlight>!"
anonymous: "Someone"
buyer-delivered: "<prefix><success>Your gift <package> <success>was delivered to <highlight><player></highlight>."
broadcast: "<prefix><highlight><player></highlight> <muted>just received <package> <muted>from the store!"
broadcast-gift: "<prefix><highlight><player></highlight> <muted>just received <package> <muted>as a gift from <highlight><buyer></highlight>!"
usage: "<prefix><muted>Usage: <highlight>/webstore status</highlight> or <highlight>/webstore retry (order_id)</highlight>."
status-header: "<prefix><primary>Webstore deliveries:"
status-entry: "<prefix><muted>  <status>: <highlight><count></highlight>"
retry-done: "<prefix><success>Order <highlight><order></highlight> is pending again; it will be delivered on the next poll."
retry-not-found: "<prefix><error>No webstore order <highlight><order></highlight> exists."
retry-not-failed: "<prefix><error>Order <highlight><order></highlight> is <highlight><status></highlight>; only failed orders can be retried."
storage-error: "<prefix><error>The webstore database could not be reached. See the console for details."
