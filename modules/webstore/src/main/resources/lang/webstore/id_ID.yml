# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# <package> adalah display-name paket dari modules/webstore.yml; <buyer>, <player> dan <message> adalah teks biasa.
delivered: "<prefix><success>Pembelianmu <package> <success>telah dikirim. Terima kasih telah mendukung server!"
delivered-title: "<package>"
delivered-subtitle: "<success>Pembelian dikirim. Terima kasih!"
gifted: "<prefix><success><highlight><buyer></highlight> menghadiahkan <package> <success>untukmu!"
gift-message: "<prefix><muted>Pesan dari <highlight><buyer></highlight>: <white>\"<message>\""
gifted-title: "<package>"
gifted-subtitle: "<success>Hadiah dari <highlight><buyer></highlight>!"
anonymous: "Seseorang"
buyer-delivered: "<prefix><success>Hadiahmu <package> <success>telah dikirim ke <highlight><player></highlight>."
broadcast: "<prefix><highlight><player></highlight> <muted>baru saja menerima <package> <muted>dari toko!"
broadcast-gift: "<prefix><highlight><player></highlight> <muted>baru saja menerima <package> <muted>sebagai hadiah dari <highlight><buyer></highlight>!"
usage: "<prefix><muted>Penggunaan: <highlight>/webstore status</highlight> atau <highlight>/webstore retry (order_id)</highlight>."
status-header: "<prefix><primary>Pengiriman webstore:"
status-entry: "<prefix><muted>  <status>: <highlight><count></highlight>"
retry-done: "<prefix><success>Pesanan <highlight><order></highlight> kembali menunggu; akan dikirim pada pengecekan berikutnya."
retry-not-found: "<prefix><error>Pesanan webstore <highlight><order></highlight> tidak ada."
retry-not-failed: "<prefix><error>Pesanan <highlight><order></highlight> berstatus <highlight><status></highlight>; hanya pesanan gagal yang dapat diulang."
storage-error: "<prefix><error>Database webstore tidak dapat dihubungi. Lihat konsol untuk detailnya."
