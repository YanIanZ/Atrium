# Tag tema: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (warna diatur di config.yml pada bagian "theme"). Gunakan ini alih-alih warna mentah.
usage-delhome: "<prefix><muted>Penggunaan: <highlight>/delhome <nama></highlight> atau <highlight>/delhome <pemain>:<nama></highlight>."
teleported: "<prefix><success>Teleport ke home <highlight><home></highlight>."
set: "<prefix><success>Home <highlight><home></highlight> diatur di <highlight><at_x> <at_y> <at_z></highlight>."
replaced: "<prefix><success>Home <highlight><home></highlight> dipindah ke <highlight><at_x> <at_y> <at_z></highlight>."
deleted: "<prefix><muted>Home <highlight><home></highlight> dihapus."
deleted-other: "<prefix><muted>Home <highlight><home></highlight> milik <highlight><player></highlight> dihapus."
not-found: "<prefix><error>Kamu tidak punya home bernama <highlight><home></highlight>."
not-found-other: "<prefix><error><highlight><player></highlight> tidak punya home bernama <highlight><home></highlight>."
invalid-name: "<prefix><error>Nama home hanya boleh berisi huruf, angka, _ dan - (maksimal 32 karakter)."
name-reserved: "<prefix><error><highlight><home></highlight> dipakai untuk kasurmu."
limit-reached: "<prefix><error>Kamu sudah mencapai batas <highlight><limit></highlight> home. Hapus satu dengan <highlight>/delhome</highlight> dulu."
limit-reached-world: "<prefix><error>Kamu mencapai batas <highlight><limit></highlight> home di <highlight><world></highlight>. Gunakan <highlight>/homes</highlight> untuk melihat home dan <highlight>/delhome</highlight> untuk mengosongkan slot."
set-world-blocked: "<prefix><error>Kamu tidak bisa membuat home di <highlight><world></highlight>."
world-blocked: "<prefix><error>Home di <highlight><world></highlight> tidak bisa dipakai."
world-not-loaded: "<prefix><error>World <highlight><world></highlight> dari home ini tidak dimuat."
no-bed: "<prefix><error>Kamu tidak punya kasur atau respawn anchor."
bed-no-permission: "<prefix><error>Kamu tidak diizinkan memakai kasur sebagai home."
unsafe-confirm: "<prefix><warning>Home <highlight><home></highlight> tampak tidak aman. <accent><u>Klik di sini</u></accent> untuk tetap teleport."
unsafe-confirm-hover: "<accent>Teleport ke titik persis, walaupun berbahaya."
list-header: "<prefix><primary><bold>Home kamu</bold></primary> <muted>(<highlight><count></highlight>/<highlight><limit></highlight>):"
list-header-other: "<prefix><primary><bold>Home milik <highlight><player></highlight></bold></primary> <muted>(<highlight><count></highlight>):"
list-empty: "<muted>  tidak ada"
list-entry: "<accent><home></accent>"
list-entry-bed: "<secondary><home></secondary>"
list-separator: "<dark_gray>, </dark_gray>"
list-hover: "<accent>Klik untuk teleport ke <highlight><home></highlight><newline><muted><world> <x> <y> <z>"
save-failed: "<prefix><error>Home kamu belum bisa disimpan. Server akan terus mencoba; galatnya sudah dicatat untuk staf."
