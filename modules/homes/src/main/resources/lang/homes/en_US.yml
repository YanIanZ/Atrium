# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
# (colours are set in config.yml under "theme"). Prefer them over raw colours.
usage-delhome: "<prefix><muted>Usage: <highlight>/delhome <name></highlight> or <highlight>/delhome <player>:<name></highlight>."
teleported: "<prefix><success>Teleported to home <highlight><home></highlight>."
set: "<prefix><success>Home <highlight><home></highlight> set at <highlight><at_x> <at_y> <at_z></highlight>."
replaced: "<prefix><success>Home <highlight><home></highlight> moved to <highlight><at_x> <at_y> <at_z></highlight>."
deleted: "<prefix><muted>Home <highlight><home></highlight> deleted."
deleted-other: "<prefix><muted>Home <highlight><home></highlight> of <highlight><player></highlight> deleted."
not-found: "<prefix><error>You have no home called <highlight><home></highlight>."
not-found-other: "<prefix><error><highlight><player></highlight> has no home called <highlight><home></highlight>."
invalid-name: "<prefix><error>Home names may only contain letters, digits, _ and - (at most 32 characters)."
name-reserved: "<prefix><error><highlight><home></highlight> is reserved for your bed."
limit-reached: "<prefix><error>You reached your limit of <highlight><limit></highlight> homes. Delete one with <highlight>/delhome</highlight> first."
set-world-blocked: "<prefix><error>You cannot set homes in <highlight><world></highlight>."
world-blocked: "<prefix><error>Homes in <highlight><world></highlight> cannot be used."
world-not-loaded: "<prefix><error>The world <highlight><world></highlight> of this home is not loaded."
no-bed: "<prefix><error>You have no bed or respawn anchor."
bed-no-permission: "<prefix><error>You are not allowed to use your bed as a home."
unsafe-confirm: "<prefix><warning>Home <highlight><home></highlight> looks unsafe. <accent><u>Click here</u></accent> to teleport anyway."
unsafe-confirm-hover: "<accent>Teleports to the exact spot, even if it is dangerous."
list-header: "<prefix><primary><bold>Your homes</bold></primary> <muted>(<highlight><count></highlight>/<highlight><limit></highlight>):"
list-header-other: "<prefix><primary><bold>Homes of <highlight><player></highlight></bold></primary> <muted>(<highlight><count></highlight>):"
list-empty: "<muted>  none"
list-entry: "<accent><home></accent>"
list-entry-bed: "<secondary><home></secondary>"
list-separator: "<dark_gray>, </dark_gray>"
list-hover: "<accent>Click to teleport to <highlight><home></highlight><newline><muted><world> <x> <y> <z>"
save-failed: "<prefix><error>Your homes could not be saved right now. The server keeps retrying; the error was logged for the staff."
