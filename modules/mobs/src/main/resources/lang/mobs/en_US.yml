spawn-usage: "<prefix><muted>Usage: <primary>/spawnmob <type>[+<rider>...] [amount] [player]</primary>. Up to <highlight><depth></highlight> per stack and <highlight><max></highlight> stacks."
unknown-type: "<prefix><error>Unknown or unspawnable entity type <highlight><type></highlight>."
stack-too-deep: "<prefix><error>A riding stack may hold at most <highlight><max></highlight> entities."
amount-too-high: "<prefix><error>You can spawn at most <highlight><max></highlight> at once."
no-permission-type: "<prefix><error>You may not use <highlight><type></highlight> (<highlight><permission></highlight>)."
spawned: "<prefix><success>Spawned <highlight><count></highlight> entities (<highlight><type></highlight>) at <highlight><player></highlight>."
spawned-limited-total: "<prefix><warning>Spawned <highlight><count></highlight> of <highlight><requested></highlight> entities (<highlight><type></highlight>): the per-command limit was reached."
spawned-limited-chunk: "<prefix><warning>Spawned <highlight><count></highlight> of <highlight><requested></highlight> entities (<highlight><type></highlight>): the chunk is nearly full."
chunk-full: "<prefix><error>That chunk already holds too many entities (limit <highlight><cap></highlight>). Nothing was spawned."
spawn-protected: "<prefix><error>You cannot spawn mobs at the location of <highlight><player></highlight>: that area is protected."
spawn-failed: "<prefix><error>Spawning failed. Check the console for details."
radius-required: "<prefix><error>Give a radius: <primary>/killall [type] [radius]</primary> (at most <highlight><max></highlight>)."
radius-too-large: "<prefix><error>The radius may be at most <highlight><max></highlight> blocks."
unknown-flag: "<prefix><error>Unknown flag <highlight><flag></highlight>. Use named or tamed."
no-permission-flag: "<prefix><error>You may not use the <highlight><flag></highlight> flag (<highlight><permission></highlight>)."
killed: "<prefix><success>Removed <highlight><count></highlight> entities (<highlight><type></highlight>) within <highlight><radius></highlight> blocks."
killed-partial: "<prefix><warning>Removed <highlight><count></highlight> entities (<highlight><type></highlight>) within <highlight><radius></highlight> blocks; some areas failed, see the console."
no-entity: "<prefix><error>Look at an entity first."
entity-elsewhere: "<prefix><error>That entity is handled by another region right now. Move closer and try again."
info:
  - "<primary>Entity <highlight><type></highlight> <muted><uuid>"
  - "<secondary>Name: <highlight><name></highlight>  <secondary>Health: <highlight><health></highlight>"
  - "<secondary>Location: <highlight><loc_world> <loc_x> <loc_y> <loc_z></highlight>  <secondary>Age: <highlight><ticks></highlight> ticks"
  - "<secondary>Owner: <highlight><owner></highlight>  <secondary>Passengers: <highlight><passengers></highlight>  <secondary>Vehicle: <highlight><vehicle></highlight>"
spawner-usage: "<prefix><muted>Usage: <primary>/setspawner <type></primary>. Look at the spawner first."
not-spawner: "<prefix><error>Look at a spawner first."
not-spawner-type: "<prefix><error>A spawner cannot be set to <highlight><type></highlight>."
spawner-set: "<prefix><success>The spawner now spawns <highlight><type></highlight>."
spawner-denied: "<prefix><error>You cannot change this spawner here."
spawner-protected: "<prefix><error>You cannot change this spawner: that area is protected."
spawner-failed: "<prefix><error>Changing the spawner failed. Check the console for details."
