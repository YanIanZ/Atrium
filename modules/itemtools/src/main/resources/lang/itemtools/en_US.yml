usage:
  itemcmdata: "<prefix><muted>Usage: <highlight>/itemcmdata <value|clear>"
  giveall: "<prefix><muted>Usage: <highlight>/giveall <item> [amount]"
  itemframe: "<prefix><muted>Usage: <highlight>/itemframe <invisible|visible|fixed|unfixed>"
  donate: "<prefix><muted>Usage: <highlight>/donate <player></highlight> to offer the held item, or <highlight>/donate accept|deny [player]</highlight> to answer an offer."
empty-hand: "<prefix><error>Hold an item in your main hand first."
failed: "<prefix><error>The item command failed. The error was logged for the server staff."
itemcmdata-set: "<prefix><success>Custom model data set to <highlight><value></highlight>."
itemcmdata-cleared: "<prefix><success>Custom model data cleared."
hideflags-on: "<prefix><success>Extra tooltip lines are now hidden."
hideflags-off: "<prefix><success>Extra tooltip lines are visible again."
glow-on: "<prefix><success>The item now glows."
glow-off: "<prefix><success>The item no longer glows."
condense-invalid: "<prefix><error><highlight><item></highlight> cannot be condensed."
condense-none: "<prefix><muted>You have nothing that can be condensed."
condense-done: "<prefix><success>Condensed <highlight><used></highlight> item(s) into <highlight><produced></highlight> item(s)."
condense-dropped: "<prefix><warning><highlight><dropped></highlight> item(s) did not fit and were dropped at your feet."
giveall-invalid-item: "<prefix><error><highlight><item></highlight> is not a valid item."
giveall-invalid-amount: "<prefix><error>Use an amount from 1 to <highlight><max></highlight>."
giveall-confirm: "<prefix><warning>Repeat the same command within <highlight><seconds></highlight> seconds to give <highlight><amount> <item></highlight> to every online player."
giveall-none: "<prefix><muted>No players are online."
giveall-sent: "<prefix><success>Gave <highlight><amount> <item></highlight> to <highlight><players></highlight> player(s)."
getbook-not-book: "<prefix><error>Hold a written book in your main hand."
getbook-denied: "<prefix><error>You can only copy books you wrote yourself."
getbook-no-blank: "<prefix><error>You need an empty book and quill in your inventory to hold the copy."
getbook-given: "<prefix><success>The book was copied into an empty book and quill from your inventory."
getbook-dropped: "<prefix><warning>Your inventory was full, so the copied book was dropped at your feet."
frame-none: "<prefix><error>Look at an item frame within reach."
frame-gone: "<prefix><error>That item frame is gone or out of reach."
frame-protected: "<prefix><error>You are not allowed to change this item frame here."
frame-updated: "<prefix><success>Item frame changed: <highlight><action></highlight>."
repaircost-show: "<prefix><muted>Repair cost: <highlight><value></highlight>."
repaircost-set: "<prefix><success>Repair cost set to <highlight><value></highlight>."
repaircost-unsupported: "<prefix><error>That item has no repair cost."
donate-self: "<prefix><error>You cannot donate an item to yourself."
donate-no-item: "<prefix><error>Hold the item you want to donate in your main hand."
donate-failed: "<prefix><error>The donation could not be prepared. The error was logged for the server staff."
donate-pending: "<prefix><error>You already have an unanswered offer for <highlight><player></highlight>. Wait for their answer."
donate-full: "<prefix><error><highlight><player></highlight> already has <highlight><max></highlight> pending donations. Try again later."
donate-offer-sent: "<prefix><success>Offered <highlight><item></highlight> to <highlight><player></highlight>. They have <highlight><seconds></highlight> seconds to accept."
donate-offer-received: "<prefix><warning><highlight><player></highlight> wants to give you <highlight><item></highlight>. Use <accent>/donate accept <player></accent> within <highlight><seconds></highlight> seconds."
donate-none: "<prefix><muted>You have no pending donation."
donate-ambiguous: "<prefix><warning>You have several pending donations. Use <accent>/donate accept <player></accent>."
donate-invalid: "<prefix><error>The offered item is no longer in the donor's hand. Nothing was transferred."
donate-accepted-receiver: "<prefix><success>You accepted <highlight><item></highlight> from <highlight><player></highlight>."
donate-accepted-donor: "<prefix><success><highlight><player></highlight> accepted your <highlight><item></highlight>."
donate-dropped: "<prefix><warning>Your inventory was full, so <highlight><item></highlight> was dropped at your feet."
donate-denied: "<prefix><muted>You declined the donation."
donate-denied-donor: "<prefix><muted><highlight><player></highlight> declined your donation."
donate-restored: "<prefix><warning>The receiver left, so your item was returned."
donate-restored-dropped: "<prefix><warning>Your inventory was full, so the returned item was dropped at your feet."
donate-donor-left: "<prefix><error>The donor left before the donation was accepted."
donate-receiver-left: "<prefix><error>The receiver left before they could accept your donation."
dispose-title: "<primary>Trash <muted>(deleted when closed)"
