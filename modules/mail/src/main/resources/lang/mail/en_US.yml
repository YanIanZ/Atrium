# Theme tags: <primary> <secondary> <accent> <muted> <success> <warning> <error> <highlight>
usage-send: "<prefix><muted>Usage: <highlight>/mail send (player) (message)</highlight>."
usage-sendall: "<prefix><muted>Usage: <highlight>/mail sendall (message)</highlight>."
usage-sendtemp: "<prefix><muted>Usage: <highlight>/mail sendtemp (player) (duration) (message)</highlight>."
help:
  - "<prefix><primary>Mail commands:"
  - " <highlight>/mail send (player) (message)</highlight> <dark_gray>- <muted>send mail, also to offline players"
  - " <highlight>/mail read [page]</highlight> <dark_gray>- <muted>read your mailbox"
  - " <highlight>/mail clear [all|number]</highlight> <dark_gray>- <muted>delete mail"
  - " <highlight>/mail sendall (message)</highlight> <dark_gray>- <muted>mail every known player"
  - " <highlight>/mail sendtemp (player) (duration) (message)</highlight> <dark_gray>- <muted>expiring mail"
sent: "<prefix><success>Mail sent to <highlight><target></highlight>."
accepted: "<prefix><success>Mail accepted."
full: "<prefix><error><highlight><target></highlight>'s mailbox is full."
muted: "<prefix><error>You cannot send mail while muted."
blank: "<prefix><error>Write a message to send."
too-long: "<prefix><error>That message is too long (maximum <highlight><max></highlight> characters)."
rate-limited: "<prefix><error>Wait <highlight><seconds></highlight>s before sending mail again."
empty: "<prefix><muted>Your mailbox is empty."
list-header: "<prefix><primary>Mailbox <dark_gray>(page <highlight><page></highlight>/<highlight><pages></highlight>, <highlight><total></highlight> total, <highlight><unread></highlight> unread)"
list-read: "<dark_gray>#<id> <muted><sender> <dark_gray>(<date>, <expiry>) <muted>[read]"
list-unread: "<dark_gray>#<id> <muted><sender> <dark_gray>(<date>, <expiry>) <warning>[unread]"
list-body: "  <reset><body>"
expiry-never: "<muted>no expiry"
expiry-at: "<muted>expires <highlight><date></highlight>"
cleared-all: "<prefix><success>Deleted <highlight><count></highlight> mail."
cleared-one: "<prefix><success>Deleted mail <highlight>#<id></highlight>."
not-found: "<prefix><error>No mail with that number."
notify-join: "<prefix><warning>You have <highlight><count></highlight> unread mail. Use <highlight>/mail read</highlight>."
notify-online: "<prefix><warning>New mail from <highlight><sender></highlight>. Use <highlight>/mail read</highlight>."
sendall-sent: "<prefix><success>Mail sent to <highlight><count></highlight> of <highlight><total></highlight> players."
sendall-none: "<prefix><muted>There are no known players to mail."
