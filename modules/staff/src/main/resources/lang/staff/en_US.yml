# Staff tools, sudo, command spy and spectator mode.
mode-enabled: "<prefix><success>Staff mode enabled. Your inventory, experience and effects were saved."
mode-enabled-other: "<prefix><success><highlight><player></highlight> entered staff mode."
mode-disabled: "<prefix><success>Staff mode disabled. Your previous state was restored."
mode-disabled-other: "<prefix><muted><highlight><player></highlight> left staff mode."
save-failed: "<prefix><error>Staff mode was not enabled because your inventory could not be saved. Nothing changed."
enter-failed: "<prefix><error>Staff mode could not be enabled; your previous state was restored."
restore-failed: "<prefix><error>Your previous state could not be restored. Staff mode stays active; the error was logged."
delete-failed: "<prefix><warning>The saved snapshot of <highlight><player></highlight> was restored but could not be deleted yet."
restored-on-join: "<prefix><warning>Your inventory was restored from a saved staff mode session."
snapshot-missing: "<prefix><warning>No saved inventory was found. The staff tools were removed, but nothing was restored."
