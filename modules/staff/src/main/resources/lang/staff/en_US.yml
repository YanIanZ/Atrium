spectate-world-missing: "<prefix><warning>The saved world is not loaded; your previous location was not restored."
spectate-join-restored: "<prefix><muted>Your spectator session ended; your previous location was restored."
player-gone: "<prefix><warning><highlight><player></highlight> is no longer online."
tool:
