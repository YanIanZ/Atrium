  freeze-lore: "<muted>Right-click a player to freeze or unfreeze them."
  inspect: "<primary>Inspector"
  inspect-lore: "<muted>Right-click a player to open their inventory."
  random-teleport: "<primary>Random teleport"
  random-teleport-lore: "<muted>Right-click to teleport to a random visible player."
  vanish: "<primary>Vanish"
  vanish-lore: "<muted>Right-click to toggle vanish."
  players: "<primary>Online players"
  players-lore: "<muted>Right-click to open the player list."
menu-title: "<primary>Online players"
menu-player-name: "<primary><player>"
menu-player-lore: "<muted>Click to choose an action for <highlight><player></highlight>."
menu-actions-title: "<primary>Actions: <highlight><player>"
menu-action-teleport: "<primary>Teleport"
menu-action-teleport-lore: "<muted>Teleport to this player."
menu-action-invsee: "<primary>Inventory"
menu-action-invsee-lore: "<muted>Open this player's inventory."
menu-action-enderchest: "<primary>Ender chest"
menu-action-enderchest-lore: "<muted>Open this player's ender chest."
menu-action-freeze: "<primary>Freeze / unfreeze"
menu-action-freeze-lore: "<muted>Toggle the moderation freeze for this player."
restore-pending: "<prefix><warning>A previous staff session of <highlight><player></highlight> was not restored yet; restoring it now. Try again afterwards."
recover-held: "<prefix><error>The staff snapshot of <highlight><player></highlight> is held for review. Use <accent>/staffmode recover <player></accent>."
recover-held-self: "<prefix><warning>Your saved inventory from staff mode needs a staff review before it can be restored. Nothing was duplicated or lost."
recover-needed: "<prefix><warning>The staff snapshot of <highlight><player></highlight> needs a review: <accent>/staffmode recover <player></accent>."
recover-none: "<prefix><success>No staff snapshots are held for review."
recover-overview: "<prefix><warning><highlight><count></highlight> held staff snapshot(s): <secondary><players></secondary>."
recover-empty: "<prefix><muted><highlight><player></highlight> has no stored staff snapshot."
recover-info: "<prefix><muted>Staff snapshot of <highlight><player></highlight>: state <accent><state></accent>, saved <secondary><created></secondary> at <secondary><location></secondary>. <muted>apply replaces the current inventory; discard deletes the snapshot."
recover-apply-refused: "<prefix><error>The snapshot of <highlight><player></highlight> can only be applied when it is held for review and the player is online and not in staff mode."
recover-applied: "<prefix><success>The held snapshot of <highlight><player></highlight> was applied and removed."
recover-discard-refused: "<prefix><error>Only a snapshot held for review can be discarded; the one of <highlight><player></highlight> is still in use."
recover-discarded: "<prefix><success>The held snapshot of <highlight><player></highlight> was discarded."
recover-failed: "<prefix><error>The staff snapshot could not be read or changed. The error was logged."
command-blocked: "<prefix><error><highlight><command></highlight> cannot be used in staff mode."
sudo-not-player: "<prefix><error>/sudo only works on players."
