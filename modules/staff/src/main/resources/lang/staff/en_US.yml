world-missing: "<prefix><warning>The saved world is not loaded; your location was not restored."
restore-teleport-failed: "<prefix><warning>Your inventory was restored, but you could not be teleported back to your previous location."
extra-items-dropped: "<prefix><muted><highlight><count></highlight> extra item(s) were dropped at your feet."
no-permission: "<prefix><error>You do not have permission to use that staff tool."
tool-needs-player: "<warning>Right-click a player with this tool."
tool-too-far: "<warning>That player is out of reach."
item-pickup-blocked: "<warning>Item pickup is disabled in staff mode."
item-drop-blocked: "<warning>Dropping items is disabled in staff mode."
item-move-blocked: "<warning>Staff tools cannot be moved into containers."
freeze-applied: "<prefix><success>Froze <highlight><player></highlight>."
freeze-lifted: "<prefix><success>Unfroze <highlight><player></highlight>."
freeze-cancelled: "<prefix><warning>The freeze was cancelled by another plugin."
freeze-exempt: "<prefix><error><highlight><player></highlight> is exempt from punishments."
freeze-failed: "<prefix><error>The freeze could not be applied. The error was logged."
freeze-self: "<prefix><error>You cannot freeze yourself."
freeze-unavailable: "<prefix><error>The moderation freeze is not available on this server."
inspect-unavailable: "<prefix><error>The inventory command is not available. Is the player module enabled?"
random-none: "<prefix><warning>No other visible players are online."
random-teleported: "<prefix><success>Teleported to <highlight><player></highlight>."
random-failed: "<prefix><error>The teleport failed. The error was logged."
vanish-enabled: "<prefix><success>You are now vanished."
vanish-disabled: "<prefix><muted>You are visible again."
vanish-failed: "<prefix><error>Toggling vanish failed. The error was logged."
vanish-unavailable: "<prefix><error>The vanish module is not enabled."
usage:
  sudo: "<prefix><muted>Usage: <highlight>/sudo <player> <command></highlight> or <highlight>/sudo <player> c:<message>"
  recover: "<prefix><muted>Usage: <highlight>/staffmode recover [player] [list|apply|discard]"
sudo-done: "<prefix><success><highlight><player></highlight> ran <secondary><command></secondary>."
sudo-chat-done: "<prefix><success><highlight><player></highlight> said: <secondary><message></secondary>."
sudo-exempt: "<prefix><error><highlight><player></highlight> is exempt from /sudo."
sudo-op: "<prefix><error>Only the console can use /sudo on an operator."
sudo-failed: "<prefix><error>The command could not be run as <highlight><player></highlight>."
commandspy-enabled: "<prefix><success>Command spy enabled."
commandspy-disabled: "<prefix><muted>Command spy disabled."
commandspy-save-failed: "<prefix><warning>Command spy changed but could not be saved yet; saving will be retried."
commandspy-format: "<muted>[<accent>Spy</accent>] <highlight><player></highlight> <muted>» <secondary><command>"
commandspy-format-cancelled: "<muted>[<accent>Spy</accent>] <highlight><player></highlight> <muted>» <secondary><command> <error>(cancelled)"
spectate-started: "<prefix><success>Now spectating <highlight><player></highlight>. Use <accent>/spectate</accent> to return."
