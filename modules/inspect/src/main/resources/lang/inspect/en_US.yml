statsedit-usage: "<prefix><muted>Usage: <highlight>/statsedit <player> <statistic> <set|add|take> <amount> [subtype]</highlight>. Amounts are seconds for time statistics, metres for distances and a count otherwise."
statsedit-invalid-mode: "<prefix><error>Unknown mode. Use <highlight>set</highlight>, <highlight>add</highlight> or <highlight>take</highlight>."
statsedit-unknown: "<prefix><error>Unknown statistic <highlight><statistic></highlight>. Use tab completion."
statsedit-offline: "<prefix><error><player> is not online; statistics only exist for online players."
statsedit-needs-subtype: "<prefix><error><statistic> needs a material or entity subtype, e.g. <highlight>/statsedit Steve mine_block add 10 stone</highlight>."
statsedit-no-subtype: "<prefix><error><statistic> has no subtype; leave the last argument out."
statsedit-unknown-subtype: "<prefix><error>Unknown or incompatible subtype <highlight><subtype></highlight>."
statsedit-done: "<prefix><success><player>'s <highlight><statistic></highlight> changed by <highlight><mode></highlight>: <highlight><before></highlight> → <highlight><after></highlight> (<formatted>)."

util-usage: "<prefix><muted>Usage: <highlight>/util <commands|permissions|materials|info></highlight>. The dump is written under the Atrium data folder."
util-unknown: "<prefix><error>Unknown dump <highlight><kind></highlight>. Use <highlight>commands</highlight>, <highlight>permissions</highlight>, <highlight>materials</highlight> or <highlight>info</highlight>."
util-written: "<prefix><success>Wrote the <highlight><kind></highlight> dump (<highlight><lines></highlight> lines) to <highlight><file></highlight>."

sameip-empty: "<prefix><muted>No two online players share an address right now."
sameip-header: "<prefix><primary>Shared addresses: <highlight><groups></highlight> group(s), <highlight><accounts></highlight> account(s)"
sameip-group: "<prefix><secondary>Address <highlight><address></highlight> <dark_gray>(<count>)"
sameip-entry: "<prefix><muted>• <highlight><player>"

removeuser-usage: "<prefix><muted>Usage: <highlight>/removeuser <player|duplicates> [confirm]</highlight>. Only Atrium data is deleted; the account must be offline and no longer cached."
removeuser-confirm: "<prefix><warning>Delete every Atrium row of <highlight><player></highlight> (homes, kits, playtime, ranks, economy, mail, ...)? Run the command again within <highlight><seconds></highlight>s or click <accent><u>here</u></accent>."
removeuser-loaded: "<prefix><error><player> is still online or cached. Let them log out and wait a few minutes (or restart) so the in-memory copy cannot be saved back."
removeuser-done: "<prefix><success>Removed <highlight><player></highlight>: <highlight><rows></highlight> rows from <highlight><tables></highlight> table(s)."
removeuser-duplicates-confirm: "<prefix><warning><highlight><groups></highlight> name(s) have duplicate accounts (<highlight><accounts></highlight> removable, <highlight><skipped></highlight> still loaded). Run the command again within <highlight><seconds></highlight>s to delete the extra accounts; the most recently seen one is kept."
removeuser-duplicates-none: "<prefix><success>No duplicate account names were found."
removeuser-duplicates-done: "<prefix><success>Removed <highlight><accounts></highlight> duplicate account(s) in <highlight><groups></highlight> name(s): <highlight><rows></highlight> rows."
removeuser-duplicates-skipped: "<prefix><warning><highlight><skipped></highlight> duplicate account(s) were skipped because they are online or cached."

reset-usage: "<prefix><muted>Usage: <highlight>/resetdbfields <group> <player></highlight>. Groups: <highlight><groups></highlight>. The account must be offline and no longer cached."
reset-unknown: "<prefix><error>Unknown dataset <highlight><group></highlight>. Use tab completion."
reset-confirm: "<prefix><warning>Reset the <highlight><group></highlight> data of <highlight><player></highlight>? This deletes rows and cannot be undone. Run the command again within <highlight><seconds></highlight>s to confirm."
reset-loaded: "<prefix><error><player> is still online or cached. Let them log out and wait a few minutes (or restart) so the in-memory copy cannot be saved back."
reset-done: "<prefix><success>Reset <highlight><group></highlight> for <highlight><player></highlight>: <highlight><rows></highlight> rows from <highlight><tables></highlight> table(s)."
confirm-expired: "<prefix><error>No matching confirmation is pending or it expired. Run the command again."
